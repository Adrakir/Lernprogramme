 .theme-toggle {display:none!important}

</head><body><div id="root"></div><script type="module" src="./offline-build/main.tsx"></script>
<script id="mk-theme-patch-20261124">
/* mk-theme-patch-20261124: unabhängig vom Kontrastmodus, ohne Änderungen am Übungszustand */
(()=>{
 const storageKey='mathe-kompass-theme';
 let mode='light';
 try {mode=localStorage.getItem(storageKey)==='dark'?'dark':'light'} catch {}
 function apply(){document.documentElement.dataset.theme=mode;document.documentElement.style.colorScheme=mode}
 function update(button){
  const dark=mode==='dark';
  const label=dark?'☀ Hellmodus':'☾ Dunkelmodus';
  if(button.textContent!==label) button.textContent=label;
  button.setAttribute('aria-label',dark?'Zum Hellmodus wechseln':'Zum Dunkelmodus wechseln');
  button.setAttribute('aria-pressed',String(dark));
  button.title=dark?'Helle Darstellung einschalten':'Dunkle Darstellung einschalten';
 }
 function ensure(){
  const bar=document.querySelector('.topbar');
  if(!bar || document.getElementById('mk-theme-toggle'))return;
  const button=document.createElement('button');
  button.id='mk-theme-toggle';button.type='button';button.className='btn ghost theme-toggle no-print';
  button.addEventListener('click',()=>{
   mode=mode==='dark'?'light':'dark';apply();update(button);
   try{localStorage.setItem(storageKey,mode)}catch{}
  });
  update(button);
  const contrast=bar.querySelector('.contrast-toggle');
  if(contrast)bar.insertBefore(button,contrast);else bar.appendChild(button);
 }
 apply();
 const mount=document.getElementById('root');
 if(mount){new MutationObserver(()=>{if(!document.getElementById('mk-theme-toggle'))ensure()}).observe(mount,{childList:true,subtree:true})}
 ensure();
})();
</script>
</body></html>
