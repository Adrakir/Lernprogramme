sx)(`path`,{d:`M36 27v54c0 8 15 14 34 14s34-6 34-14V27`,fill:`#d8eff4`,stroke:`#397b89`,strokeWidth:`3`}),(0,H.jsx)(`ellipse`,{cx:`70`,cy:`27`,rx:`34`,ry:`14`,fill:`#eefaff`,stroke:`#397b89`,strokeWidth:`3`}),(0,H.jsx)(`path`,{d:`M36 81c0 8 15 14 34 14s34-6 34-14`,fill:`none`,stroke:`#397b89`,strokeWidth:`3`})]}),(0,H.jsx)(`b`,{children:`Zylinder`}),(0,H.jsx)(`span`,{children:`2 Kreisflächen und eine gekrümmte Mantelfläche.`})]}),(0,H.jsxs)(`div`,{children:[(0,H.jsxs)(`svg`,{viewBox:`0 0 140 110`,role:`img`,"aria-label":`Kegel mit einer Kreisgrundfläche und einer Spitze`,children:[(0,H.jsx)(`path`,{d:`M70 14 34 80c0 8 16 15 36 15s36-7 36-15Z`,fill:`#ffe6d4`,stroke:`#b66a38`,strokeWidth:`3`}),(0,H.jsx)(`ellipse`,{cx:`70`,cy:`80`,rx:`36`,ry:`15`,fill:`#fff3ea`,stroke:`#b66a38`,strokeWidth:`3`}),(0,H.jsx)(`path`,{d:`M34 80c0 8 16 15 36 15s36-7 36-15`,fill:`none`,stroke:`#b66a38`,strokeWidth:`2`,strokeDasharray:`4 3`})]}),(0,H.jsx)(`b`,{children:`Kegel`}),(0,H.jsx)(`span`,{children:`1 Kreisgrundfläche, gekrümmte Mantelfläche und 1 Spitze.`})]}),(0,H.jsxs)(`div`,{children:[(0,H.jsxs)(`svg`,{viewBox:`0 0 140 110`,role:`img`,"aria-label":`Kugel mit gekrümmter Oberfläche`,children:[(0,H.jsx)(`defs`,{children:(0,H.jsxs)(`radialGradient`,{id:`sphere-shade`,children:[(0,H.jsx)(`stop`,{offset:`0`,stopColor:`#fff`,stopOpacity:`.8`}),(0,H.jsx)(`stop`,{offset:`1`,stopColor:`#8c78bd`})]})}),(0,H.jsx)(`circle`,{cx:`70`,cy:`55`,r:`39`,fill:`url(#sphere-shade)`,stroke:`#685692`,strokeWidth:`3`}),(0,H.jsx)(`path`,{d:`M32 55c12-18 64-18 76 0M32 55c12 18 64 18 76 0`,fill:`none`,stroke:`#685692`,strokeWidth:`2`,opacity:`.65`})]}),(0,H.jsx)(`b`,{children:`Kugel`}),(0,H.jsx)(`span`,{children:`Eine gekrümmte Oberfläche; keine Kanten und keine Ecken.`})]})]})}var Pg=(...e)=>(0,H.jsx)(`div`,{className:`worked`,children:e.map((e,t)=>(0,H.jsx)(`span`,{children:e},t))}),Fg={arithmetic:[{title:`Addieren und Subtrahieren mit Übertrag`,text:`Schriftlich rechnen klappt, wenn Einer genau unter Einern, Zehner unter Zehnern und Hunderter unter Hundertern stehen. Beginne rechts bei den Einern. Bei der Addition tauschst du 10 Einer gegen 1 Zehner. Bei der Subtraktion kannst du 1 Hunderter in 10 Zehner und 1 Zehner in 10 Einer entbündeln. Das Stellenwertbild zeigt jeden Tausch.`,rule:`Stellen untereinander schreiben. Von rechts rechnen. Übertrag oder Entbündelung in die richtige Nachbarstelle eintragen und anschließend mit der Umkehraufgabe prüfen.`,visual:(0,H.jsx)(Eg,{}),coach:`Ich richte erst Hunderter, Zehner und Einer aus. Dann rechne ich eine Stelle nach der anderen und sage bei jedem Übertrag, welchen Wert ich tausche.`},{title:`Schriftlich multiplizieren`,text:`Bei 347 · 26 rechnest du 347 · 6 = 2.082 und 347 · 20 = 6.940. Addiere beide Teilprodukte. Die zweite Teilrechnung steht eine Stelle weiter links, weil du mit Zehnern rechnest.`,rule:`Jede Ziffer des zweiten Faktors berücksichtigen. Stellenwerte der Teilprodukte beachten.`,visual:Pg(`347 · 6 = 2.082`,`347 · 20 = 6.940`,`2.082 + 6.940 = 9.022`)},{title:`Schriftlich dividieren`,text:`Bei 1.248 : 6 beginnst du links: 12 : 6 = 2. Ziehe 12 ab. Hole die 4 herunter: 4 : 6 ergibt 0, also schreibe die 0 im Quotienten. Hole die 8 herunter: 48 : 6 = 8. Ergebnis: 208. Bei Division mit Rest muss der Rest kleiner als der Divisor sein.`,rule:`Teilen → multiplizieren → abziehen → nächste Ziffer herunterholen. Nullen im Quotienten nicht auslassen.`,visual:Pg(`12 : 6 = 2; 12 − 12 = 0`,`4 : 6 = 0 Rest 4; dann 48 : 6 = 8`,`1.248 : 6 = 208; Probe: 208 · 6 = 1.248`,`1.250 : 6 = 208 Rest 2`)},{title:`Regeln, Potenzen und Sachaufgaben`,text:`3³ bedeutet 3 · 3 · 3 = 27. Potenzen stehen vor Punkt- und Strichrechnung. Das Distributivgesetz erlaubt 7 · (20 + 4) = 7 · 20 + 7 · 4. Bei Sachaufgaben klärst du zuerst die Frage. Für 25 Kinder und Busse mit 8 Kinderplätzen brauchst du 4 Busse, weil der Rest einen zusätzlichen Bus verlangt.`,rule:`Verstehen → Rechnung aufstellen → rechnen → mit Einheit antworten → Ergebnis prüfen.`,visual:Pg(`3³ + 2 · 5 = 27 + 10 = 37`,`7 · 24 = 140 + 28 = 168`,`□ · 4 + 3 = 31 → □ = (31 − 3) : 4 = 7`)}],divisibility:[{title:`Teiler und Vielfache`,text:`12 = 3 · 4: 3 und 4 sind Teiler von 12; 12 ist ein Vielfaches von 3 und 4. Die positiven Teiler von 12 sind 1, 2, 3, 4, 6 und 12. Positive Vielfache von 4 sind 4, 8, 12, 16 und so weiter.`,rule:`Teiler teilen ohne Rest. Vielfache entstehen durch Multiplikation mit natürlichen Zahlen.`,visual:Pg(`12 = 1 · 12 = 2 · 6 = 3 · 4`,`Teiler paarweise suchen; jeden nur einmal zählen.`)},{title:`Teilbarkeitsregeln anwenden`,text:`Durch 2: letzte Ziffer gerade. Durch 5: letzte Ziffer 0 oder 5. Durch 10: letzte Ziffer 0. Für 3 und 9 addierst du alle Ziffern zur Quersumme. Eine Zahl ist durch 3 beziehungsweise 9 teilbar, wenn ihre Quersumme durch diese Zahl teilbar ist.`,rule:`Endziffer für 2, 5, 10; Quersumme für 3, 9.`,visual:Pg(`234: Quersumme 2 + 3 + 4 = 9`,`234 ist durch 2, 3 und 9 teilbar, aber nicht durch 5 oder 10.`)},{title:`Primzahlen erkennen`,text:`Eine Primzahl ist größer als 1 und hat genau zwei positive Teiler: 1 und sich selbst. 2 ist die einzige gerade Primzahl. 1 ist keine Primzahl. 21 ist zusammengesetzt, denn 21 = 3 · 7. Ein systematisches Streichen von Vielfachen hilft beim Finden von Primzahlen.`,rule:`Nicht jede ungerade Zahl ist prim. Suche einen echten Teiler.`,visual:Pg(`Primzahlen bis 20: 2, 3, 5, 7, 11, 13, 17, 19`,`9 = 3 · 3; 15 = 3 · 5; 21 = 3 · 7`)},{title:`Zahlenmuster und zusätzliche Werkzeuge`,text:`Bei 5, 9, 13, 17 wächst jede Zahl um 4; danach kommt 21. Quadratzahlen entstehen aus zwei gleichen Faktoren. Der größte gemeinsame Teiler ist der größte Wert in beiden Teilerlisten. Zahlenfolgen, Quadratzahlen und ggT sind zusätzliche Vertiefungen.`,rule:`Vermutete Regel an jedem Schritt prüfen. ggT und Quadratzahlen sind Zusatzaufgaben.`,visual:Pg(`4² = 16; 5² = 25`,`Teiler von 12: 1, 2, 3, 4, 6, 12`,`Teiler von 18: 1, 2, 3, 6, 9, 18 → ggT = 6`),extension:!0}],geometry:[{title:`Geraden, Strecken, Kreise und Figuren`,text:`Eine Gerade geht in beide Richtungen immer weiter. Ein Strahl beginnt an einem Punkt und geht in eine Richtung weiter. Eine Strecke hat zwei Endpunkte und eine messbare Länge. Parallele Geraden treffen sich nicht; senkrechte Geraden bilden einen rechten Winkel. Ein Quadrat ist auch ein Rechteck: Es hat vier rechte Winkel und vier gleich lange Seiten. Beim Kreis reicht der Radius vom Mittelpunkt zum Rand; der Durchmesser geht durch den Mittelpunkt und ist doppelt so lang.`,rule:`Suche Ecken, Seiten und rechte Winkel. Jedes Quadrat ist ein Rechteck, aber nicht jedes Rechteck ein Quadrat.`,visual:(0,H.jsxs)(H.Fragment,{children:[(0,H.jsx)(Mg,{}),(0,H.jsxs)(`div`,{className:`worked`,children:[(0,H.jsx)(`span`,{children:`Strecke: zwei Endpunkte`}),(0,H.jsx)(`span`,{children:`Strahl: ein Anfangspunkt`}),(0,H.jsx)(`strong`,{children:`Radius 3 cm → Durchmesser 6 cm`})]})]})},{title:`Winkel verstehen und messen`,text:`Lege den Mittelpunkt des Geodreiecks auf den Scheitelpunkt. Die Nullkante liegt auf einem Schenkel. Lies die Skala ab, die auf diesem Schenkel bei 0° beginnt. Spitze Winkel sind kleiner als 90°, rechte genau 90°, stumpfe zwischen 90° und 180°, gestreckte genau 180°. Winkel über 180° und unter 360° heißen überstumpf.`,rule:`Prüfe die richtige Skala und schätze vorher: spitz, recht oder stumpf?`,visual:(0,H.jsx)(kg,{})},{title:`Koordinaten ablesen und eintragen`,text:`Ein Punkt wird durch zwei Zahlen beschrieben: P(3|4). Gehe vom Ursprung drei Einheiten nach rechts und dann vier nach oben. Die x-Koordinate steht immer zuerst. Beim Verschieben nach rechts steigt x, beim Verschieben nach oben steigt y. Zeichne gleiche Einheiten an beiden Achsen.`,rule:`P(x|y): erst waagerecht, dann senkrecht.`,visual:(0,H.jsx)(wg,{shape:{kind:`grid`,a:3,b:4}})},{title:`Achsensymmetrie und Spiegelpunkte`,text:`Spiegelpunkte liegen gleich weit von der Spiegelachse entfernt. Ihre Verbindungsstrecke steht senkrecht zur Achse. P(2|3) hat an der Achse x = 5 den Spiegelpunkt P′(8|3). Ein Quadrat hat vier Symmetrieachsen: zwei Mittellinien und zwei Diagonalen. Ein Rechteck, das kein Quadrat ist, hat zwei.`,rule:`Gleicher Abstand, andere Seite. Zur Kontrolle kannst du entlang der Achse falten.`,visual:(0,H.jsx)(wg,{shape:{kind:`symmetry`,a:2,b:3}})}],measure:[{title:`Umfang und Fläche unterscheiden`,text:`Der Umfang ist die Länge des Randes, zum Beispiel eines Zauns. Der Flächeninhalt zählt, wie viele Einheitsquadrate das Innere bedecken. Ein Rechteck von 6 cm × 4 cm hat 20 cm Umfang und 24 cm² Fläche. Ändere die Seiten und beobachte beide Größen.`,rule:`U = 2 · (a + b) in Längeneinheiten. A = a · b in Flächeneinheiten.`,visual:(0,H.jsx)(Og,{})},{title:`Flächen zerlegen und Einheiten umrechnen`,text:`Eine zusammengesetzte Fläche kannst du in einfache Rechtecke teilen. Zähle jedes Teilstück genau einmal; überlappende Stücke dürfen nicht doppelt zählen. Bei Flächen geht es in zwei Richtungen: 1 m² ist ein Quadrat mit 10 dm Seitenlänge, also 10 · 10 = 100 dm². Beim Umrechnen der Flächeneinheiten ist ein Schritt deshalb jeweils mal 100 oder geteilt durch 100.`,rule:`Längen werden pro Einheitenschritt mit 10 umgerechnet; Flächen mit 100, weil Länge und Breite verändert werden.`,visual:(0,H.jsxs)(H.Fragment,{children:[(0,H.jsx)(wg,{shape:{kind:`rectangle`,a:6,b:4,fillColor:`#9bd4c8`}}),(0,H.jsxs)(`div`,{className:`worked`,children:[(0,H.jsx)(`span`,{children:`1 m² = 10 dm · 10 dm = 100 dm²`}),(0,H.jsx)(`strong`,{children:`6 cm · 4 cm = 24 cm²`})]})]})},{title:`Körper, Netze und Oberfläche`,text:`Ein Körper hat Länge, Breite und Höhe. Ein Würfel hat 6 quadratische Flächen, 12 Kanten und 8 Ecken. Ein Quader hat ebenfalls 6 Flächen, 12 Kanten und 8 Ecken; seine Flächen sind Rechtecke. Ein Dreiecksprisma und eine quadratische Pyramide haben andere Flächenformen. Ein Netz zeigt die flachen Flächen, aus denen ein Körper zusammengesetzt ist. Die Oberfläche ist die Summe der Flächen außen am Körper.`,rule:`Zähle jede Fläche, Kante und Ecke genau einmal. Oberfläche ist eine Fläche; Volumen beschreibt den Platz im Inneren.`,visual:(0,H.jsxs)(H.Fragment,{children:[(0,H.jsx)(Ng,{}),(0,H.jsx)(wg,{shape:{kind:`net`,a:1}}),(0,H.jsx)(`p`,{children:`Würfelnetz: 6 Quadrate lassen sich zu einem Würfel falten.`})]}),example:`Quader 4 cm × 3 cm × 2 cm: Oberfläche = 2 · (4·3 + 4·2 + 3·2) = 52 cm².`,extension:!0,coach:`Ich untersuche zuerst die Flächen. Dann zähle ich Kanten und Ecken. Beim Netz frage ich: Kann ich die Flächen ohne Lücken und Überlappungen zu einem Körper falten?`},{title:`Volumen und Raumeinheiten`,text:`In einen Quader von 4 cm × 3 cm × 2 cm passen zwei Schichten mit je 12 Einheitswürfeln. Das ergibt 24 cm³. Ein Würfel von 1 dm Kantenlänge enthält 10 · 10 · 10 = 1.000 cm³. 1 dm³ ist genau 1 Liter. Einheiten immer vor der Rechnung passend umwandeln.`,rule:`V = Länge · Breite · Höhe. Raumeinheiten: Faktor 1.000 pro benachbartem Schritt.`,visual:(0,H.jsx)(wg,{shape:{kind:`cuboid`,a:4,b:3,c:2}}),example:`2 dm³ = 2 l = 2.000 ml = 2.000 cm³.`,extension:!0}],fractions:[{title:`Brüche als Teile eines Ganzen · 5/6`,text:`Ein Bruch beschreibt gleich große Teile. Der Nenner steht unten: Er sagt, in wie viele gleiche Teile das Ganze geteilt wurde. Der Zähler steht oben: Er zählt die ausgewählten Teile. Bei 3/8 sind also 3 von 8 gleichen Teilen markiert. Von 24 Murmeln ist 1/8 genau 24 : 8 = 3 Murmeln; 3/8 sind dann 3 · 3 = 9 Murmeln.`,rule:`Bruchteil einer Menge: erst durch den Nenner teilen, dann mit dem Zähler malnehmen.`,visual:(0,H.jsxs)(H.Fragment,{children:[(0,H.jsx)(Ag,{}),(0,H.jsx)(jg,{parts:[{numerator:3,denominator:8,color:`#355fe4`,label:`3/8 von einem Ganzen`},{numerator:1,denominator:8,color:`#15a29b`,label:`1/8 von 24 Murmeln = 3 Murmeln`}]})]}),coach:`Ich frage zuerst: Wie viele gleich große Teile gibt es insgesamt? Das ist der Nenner. Dann zähle ich, wie viele davon ausgewählt sind: Das ist der Zähler.`},{title:`Erweitern und Kürzen`,text:`Ein Bruch ändert seinen Wert nicht, wenn jedes Teil gleichmäßig weitergeteilt wird. 1/2 und 2/4 bedeuten dieselbe Menge: Ein halbes Ganzes ist genauso groß wie zwei Viertel. Beim Erweitern malnehmen wir Zähler und Nenner mit derselben Zahl. Beim Kürzen teilen wir beide durch dieselbe Zahl. So bleibt die Größe gleich, nur die Einteilung wird anders.`,rule:`Zähler und Nenner immer mit derselben Zahl malnehmen oder teilen. Nie nur eine der beiden Zahlen verändern.`,visual:(0,H.jsxs)(H.Fragment,{children:[(0,H.jsx)(jg,{parts:[{numerator:1,denominator:2,color:`#355fe4`,label:`1/2`},{numerator:2,denominator:4,color:`#15a29b`,label:`2/4`},{numerator:4,denominator:8,color:`#a791e6`,label:`4/8`}]}),(0,H.jsxs)(`div`,{className:`worked`,children:[(0,H.jsx)(`strong`,{children:`1/2 = 2/4 = 4/8`}),(0,H.jsx)(`span`,{children:`6/8 kürzen: Zähler und Nenner durch 2 teilen → 3/4`})]})]}),coach:`Vergleiche die farbigen Streifen: Sie sind gleich lang. Nur die Anzahl der Teilstücke ändert sich.`},{title:`Brüche vergleichen`,text:`Vergleiche immer gleich große Ganze. Haben zwei Brüche den gleichen Nenner, sind ihre Teile gleich groß: 5/8 ist mehr als 3/8. Haben sie den gleichen Zähler, ist ein Bruch mit kleinerem Nenner größer, denn sein Ganzes wurde in weniger und damit größere Teile geteilt: 1/3 ist größer als 1/5. Bei unterschiedlichen Zählern und Nennern kannst du auf gleiche Nenner erweitern.`,rule:`Vergleiche gleich große Teile: gleiche Nenner → Zähler vergleichen. Bei ungleichen Nennern zuerst gleichnamig machen.`,visual:(0,H.jsxs)(H.Fragment,{children:[(0,H.jsx)(jg,{parts:[{numerator:3,denominator:8,color:`#355fe4`,label:`3/8`},{numerator:5,denominator:8,color:`#15a29b`,label:`5/8`},{numerator:2,denominator:3,color:`#a791e6`,label:`2/3 = 8/12`},{numerator:3,denominator:4,color:`#f0aa3c`,label:`3/4 = 9/12`}]}),(0,H.jsxs)(`div`,{className:`worked`,children:[(0,H.jsx)(`span`,{children:`3/8 < 5/8`}),(0,H.jsx)(`span`,{children:`1/3 > 1/5`}),(0,H.jsx)(`strong`,{children:`2/3 = 8/12 < 9/12 = 3/4`})]})]}),coach:`Ich stelle mir gleich große Ganze vor. Bei verschiedenen Nennern färbe ich dieselbe Einteilung ein oder erweitere auf einen gemeinsamen Nenner.`},{title:`Brüche addieren und subtrahieren`,text:`Bei gleichnamigen Brüchen sind die Stücke gleich groß. Darum zählst du beim Addieren nur die Stücke zusammen: 3/8 + 2/8 = 5/8. Bei ungleichen Nennern sind die Teile verschieden groß. Teile deshalb erst in gleich große Stücke um: 1/2 = 2/4; dann 2/4 + 1/4 = 3/4. Der Nenner bleibt beim Addieren gleich, sobald die Brüche gleichnamig sind.`,rule:`Erst gleichnamig machen, dann Zähler addieren oder subtrahieren. Der Nenner wird nicht addiert.`,visual:(0,H.jsxs)(H.Fragment,{children:[(0,H.jsx)(jg,{parts:[{numerator:1,denominator:2,color:`#355fe4`,label:`1/2 = 2/4`},{numerator:1,denominator:4,color:`#15a29b`,label:`1/4`},{numerator:3,denominator:4,color:`#a791e6`,label:`Ergebnis: 3/4`}]}),(0,H.jsxs)(`div`,{className:`worked`,children:[(0,H.jsx)(`span`,{children:`3/8 + 2/8 = 5/8`}),(0,H.jsx)(`strong`,{children:`1/2 + 1/4 = 2/4 + 1/4 = 3/4`}),(0,H.jsx)(`span`,{children:`5/6 − 1/3 = 5/6 − 2/6 = 3/6 = 1/2`})]})]}),extension:!0,coach:`Bei Brüchen mit verschiedenen Nennern stelle ich mir erst Stücke gleicher Größe her. Dann rechne ich nur, wie viele Stücke übrig sind.`}],decimals:[{title:`Zehntel und Hundertstel · 5/6`,text:`Rechts vom Komma stehen Zehntel, Hundertstel, Tausendstel. 2,35 bedeutet 2 Ganze, 3 Zehntel und 5 Hundertstel. Nullen am Ende ändern den Wert nicht: 2,5 = 2,50. Aber 2,05 und 2,5 sind verschieden.`,rule:`Von links nach rechts vergleichen. Zum Vergleichen Nullen rechts ergänzen.`,visual:Pg(`2,35 = 2 + 3/10 + 5/100`,`2,05 < 2,50; 0,7 > 0,65`)},{title:`Addieren, Subtrahieren und Runden`,text:`Schreibe beim Addieren und Subtrahieren Komma unter Komma. Ergänze Nullen: 2,5 + 0,75 = 2,50 + 0,75 = 3,25. Beim Runden auf Zehntel entscheidet die Hundertstelziffer. 2,35 wird 2,4; 2,34 wird 2,3.`,rule:`Gleiche Stellen untereinander; Rundungsziffer und Prüfziffer unterscheiden.`,visual:Pg(`5,00 − 2,75 = 2,25`,`2,35 ≈ 2,4; 2,34 ≈ 2,3`)},{title:`Multiplizieren und Dividieren`,text:`2,35 · 4 lässt sich in Hundertsteln rechnen: 235 Hundertstel · 4 = 940 Hundertstel = 9,40. Für 9,40 : 4 rechnest du rückwärts. Mal 100 verändert den Stellenwert jeder Ziffer um zwei Stellen nach links, geteilt durch 100 nach rechts.`,rule:`Kontrolliere die Größenordnung und nutze die Umkehraufgabe.`,visual:Pg(`2,35 · 4 = 9,4`,`9,4 : 4 = 2,35`,`2,35 · 100 = 235; 235 : 100 = 2,35`),extension:!0},{title:`Brüche, Dezimalzahlen und Geld`,text:`25/100 sind 0,25; durch Kürzen auch 1/4. Bei Geld sind Hundertstel eines Euros Cent. Für drei Hefte zu je 1,25 € rechnest du 125 Cent · 3 = 375 Cent = 3,75 €. Der Gesamtpreis braucht eine genaue Rechnung.`,rule:`Dezimalzahlen in dieser App mit Komma schreiben. Geldbeträge genau berechnen.`,visual:Pg(`1/2 = 0,5; 1/4 = 0,25; 3/4 = 0,75`,`3 · 1,25 € = 3,75 €`),extension:!0}]},Ig={data:{goal:`Ich lese Daten mit passender Einheit und Skala und begründe Vergleiche.`,discover:`Warum kann eine höhere Säule trotzdem für weniger Kinder stehen?`,explain:`Die Höhe allein reicht nicht: Erst Einheit und Schrittweite prüfen, dann die Werte vergleichen.`,types:[0,0,3,8,4,11,13,16]},numbers:{goal:`Ich erkläre Stellenwerte, Platzhalter-Nullen und große Zahlen.`,discover:`Ist die Ziffer 4 immer vier wert? Vergleiche 4, 40 und 400.`,explain:`Die Ziffer bleibt gleich, ihr Wert hängt vom Platz ab: 4 Einer, 4 Zehner oder 4 Hunderter.`,types:[0,1,2,0,3]},round:{goal:`Ich runde direkt auf die Zielstelle und prüfe den Zweck.`,discover:`Für 487 Kinder: 500 Eintrittskarten bestellen oder ungefähr 500 Kinder melden – ist beides dasselbe?`,explain:`Für einen Bericht kann eine Näherung passen. Für jedes Kind genau eine Karte braucht man die genaue Anzahl.`,types:[3,0,0,2,4]},mental:{goal:`Ich nutze Rechenregeln und erkläre einen günstigen Rechenweg.`,discover:`Haben 2 + 3 · 4 und (2 + 3) · 4 dasselbe Ergebnis?`,explain:`Nein: Ohne Klammer zuerst 3 · 4, also 14; mit Klammer zuerst 2 + 3, also 20.`,types:[0,1,2,3]},line:{goal:`Ich bestimme Schrittweiten und lese Positionen am Zahlenstrahl.`,discover:`Zwischen 100 und 200 liegen fünf Abstände. Ist jeder Abstand 1 wert?`,explain:`Nein: Die Differenz 100 wird auf fünf gleiche Abstände verteilt. Jeder Abstand zählt 20.`,types:[0,0,2,3]},units:{goal:`Ich wähle passende Einheiten und prüfe Umrechnungsfaktoren.`,discover:`Wird ein Tisch länger, wenn du seine Länge statt in Metern in Zentimetern angibst?`,explain:`Die Länge bleibt gleich. Nur die Einheit wird kleiner und die Maßzahl entsprechend größer.`,types:[0,1,3,1]},stats:{goal:`Ich unterscheide Anzahl, Anteil und Kennwerte einer Verteilung.`,discover:`Sind 12 Radfahrer von 30 Kindern ein größerer Anteil als 10 von 20?`,explain:`Nein: 12 von 30 sind 40 %, 10 von 20 sind 50 %. Die größere Anzahl muss nicht der größere Anteil sein.`,types:[0,1,2,3,2]},arithmetic:{goal:`Ich rechne stellengetreu und prüfe mit der Umkehraufgabe.`,discover:`Warum steht das Teilprodukt für die Zehner eine Stelle weiter links?`,explain:`Eine Zehnerziffer steht für Zehner: Bei 347 · 26 rechnen wir nicht nur mal 2, sondern mal 20.`,types:[0,2,3,6]},divisibility:{goal:`Ich unterscheide Teiler und Vielfache und begründe Teilbarkeit.`,discover:`Ist jede ungerade Zahl eine Primzahl? Prüfe 9 und 11.`,explain:`Nein: 9 hat auch den Teiler 3. 11 hat nur die positiven Teiler 1 und 11.`,types:[4,1,3,7]},geometry:{goal:`Ich beschreibe Figuren, Winkel, Koordinaten und Spiegelungen.`,discover:`Ist jedes Quadrat ein Rechteck? Und gilt auch die Umkehrung?`,explain:`Jedes Quadrat hat vier rechte Winkel und ist ein Rechteck. Ein Rechteck braucht aber nicht vier gleich lange Seiten.`,types:[0,1,4,6]},measure:{goal:`Ich unterscheide Rand, Fläche und Rauminhalt mit Einheiten.`,discover:`Kann ein Rechteck bei gleichem Umfang mehr Fläche als ein anderes haben?`,explain:`Ja: 6 × 4 und 8 × 2 haben beide 20 cm Umfang, aber 24 cm² beziehungsweise 16 cm² Fläche.`,types:[0,3,7,4]},fractions:{goal:`Ich deute Brüche als gleich große Teile und begründe Umformungen.`,discover:`Darfst du bei verschieden großen Stücken einfach die Stückzahl als Bruch nehmen?`,explain:`Nein. Ein Nenner beschreibt gleich große Teile eines Ganzen. Zum Vergleichen müssen auch die Ganzen gleich groß sein.`,types:[0,4,3,8]},decimals:{goal:`Ich erkläre Zehntel und Hundertstel und rechne stellengetreu.`,discover:`Ist 0,7 kleiner als 0,65, weil 7 kleiner als 65 ist?`,explain:`Nein: 0,7 = 0,70. 70 Hundertstel sind mehr als 65 Hundertstel.`,types:[0,4,6,2]}},Lg={data:[[`Wie verhinderst du beim Zählen, dass eine Antwort zweimal vorkommt?`,`Markiere gezählte Antworten und ordne jede Antwort genau einer passenden Kategorie zu.`],[`Warum ist ein Fünferbündel nicht sechs wert?`,`Der Querstrich ist bereits der fünfte Strich; er kommt zu den vier senkrechten hinzu.`],[`Welche Angaben braucht ein Diagramm, damit du seine Werte verstehst?`,`Titel, Kategorien, Einheit und eine gleichmäßige Skala mit beschriftetem Nullpunkt gehören dazu.`],[`Was rechnest du bei „zusammen“, was bei „wie viele mehr“?`,`Für die Gesamtzahl addierst du. Für den Unterschied ziehst du die kleinere von der größeren Zahl ab.`],[`Was ändert sich, wenn Säulen zu Balken werden?`,`Die Richtung ändert sich, aber Kategorien und Werte bleiben gleich. Lies die Zahlenachse neu.`],[`Kann die niedrigere Säule für mehr Kinder stehen?`,`Ja, wenn die Diagramme verschiedene Skalen haben. Vergleiche die abgelesenen Zahlen, nicht nur die Höhe.`],[`Wie beschriftest du sechs gleich große Abstände bis 60?`,`Mit 0, 10, 20, 30, 40, 50, 60. Jeder Abstand zählt zehn.`],[`Was musst du vor einer Umfrage festlegen?`,`Eine eindeutige Frage, die Befragten und passende Kategorien. So wird jede Antwort sinnvoll erfasst.`]],numbers:[[`Was bleibt gleich, wenn du zehn Einer zu einem Zehner tauschst?`,`Der Wert bleibt zehn. Nur die Darstellung wechselt von zehn einzelnen Plättchen zu einem Zehnerstreifen.`],[`Warum darfst du die Null in 40.203 nicht weglassen?`,`Sie hält den Tausenderplatz frei. 4.203 wäre eine andere, viel kleinere Zahl.`],[`Wie liest du die Gruppen 3 | 420 | 005 | 018?`,`3 Milliarden, 420 Millionen, 5 Tausend und 18. Die Dreiergruppen halten auch leere Stellen fest.`],[`Wie schreibst du zwei Millionen und fünfzig ohne einen Platz zu verlieren?`,`2 | 000 | 050 ergibt 2.000.050. Jede Gruppe nach der führenden Gruppe hat drei Ziffern.`],[`Welche Stelle entscheidet bei 2.403.050 und 2.430.050?`,`Von links sind 2 und 4 gleich. Die Zehntausenderziffer 0 ist kleiner als 3; darum ist die erste Zahl kleiner.`]],round:[[`Wann wären ungefähr 500 statt genau 487 unpassend?`,`Wenn du genau eine Eintrittskarte je Kind brauchst. Eine Übersicht über die Schulgröße darf gerundet sein.`],[`Warum wird 4.500 auf Tausender zu 5.000?`,`Die Zahl liegt genau in der Mitte. Beim hier verwendeten Runden wird ab der Mitte aufgerundet.`],[`Welche Ziffer entscheidet bei 14.582 auf Tausender?`,`Die Hunderterziffer 5 steht direkt rechts von der Tausenderstelle. Daher entsteht 15.000.`],[`Wie erkennst du, ob 49 · 21 ungefähr 10.000 sein kann?`,`Der Überschlag 50 · 20 = 1.000 zeigt: 10.000 wäre etwa zehnmal zu groß.`],[`Sind „genau 48.000“ und „etwa 48.000“ gleichbedeutend?`,`Nein. „Etwa“ kennzeichnet eine Näherung, „genau“ behauptet einen exakten Wert.`]],mental:[[`Was unterscheidet 2 + 3 · 4 von (2 + 3) · 4?`,`Ohne Klammer zuerst 3 · 4: 14. Mit Klammer zuerst 2 + 3: 20.`],[`Warum ist 48 : 6 · 2 nicht 4?`,`Mal und Geteilt sind gleichrangig. Von links: 48 : 6 = 8, dann 8 · 2 = 16.`],[`Wo beginnst du bei 3 · (8 + (12 − 4))?`,`In der innersten Klammer: 12 − 4 = 8. Dann 8 + 8 = 16, zuletzt 3 · 16 = 48.`],[`Warum ist 25 · 17 · 4 leicht zu rechnen?`,`Bei einer reinen Multiplikation darfst du Faktoren umordnen: 25 · 4 · 17 = 100 · 17 = 1.700.`]],line:[[`Sind fünf Teilstriche dasselbe wie fünf Abstände?`,`Nein. Zwischen fünf aufeinanderfolgenden Teilstrichen liegen nur vier Abstände.`],[`Zwischen 100 und 200 liegen zehn Abstände. Wo liegt 140?`,`Jeder Abstand ist zehn wert. 140 liegt vier Abstände rechts von 100.`],[`Ist der Nachfolger von 9.999 immer 10.099, wenn die Zeichnung Hunderterschritte zeigt?`,`Nein. Der unmittelbare Nachfolger ist immer eins mehr, hier 10.000.`],[`Warum ist 270 die Mitte zwischen 240 und 300?`,`Die Differenz ist 60. Die Hälfte ist 30; von 240 und 300 ist 270 jeweils 30 entfernt.`]],units:[[`Reicht „18“ als Angabe für einen Bleistift?`,`Nein, die Einheit fehlt. 18 cm ist eine plausible Länge; 18 kg beschreibt eine ganz andere Größe.`],[`Wird der Tisch länger, wenn du Meter in Zentimeter umrechnest?`,`Nein. Die Größe bleibt gleich. 2 m und 200 cm bezeichnen dieselbe Länge.`],[`Warum sind 2 h 15 min nicht 215 min?`,`Stunden haben je 60 Minuten. 2 · 60 + 15 = 135 Minuten.`],[`Warum ist 1 dm² nicht 10 cm²?`,`Das Quadrat ist 10 cm lang und 10 cm breit: 10 · 10 = 100 cm². Beim Würfel sind es drei Richtungen.`]],stats:[[`Sind 12 von 30 ein größerer Anteil als 10 von 20?`,`Nein: 40 % sind weniger als 50 %. Gruppen unterschiedlicher Größe vergleichst du mit Anteilen.`],[`Kannst du aus einem Viertelkreis allein die Anzahl der Kinder bestimmen?`,`Nein. Er zeigt 25 %. Für die Anzahl brauchst du die Gesamtzahl, zum Beispiel 24 : 4 = 6.`],[`Muss der Mittelwert unter den beobachteten Zahlen vorkommen?`,`Nein. Bei 2, 3, 3 und 8 ist der Mittelwert 4, obwohl niemand den Wert 4 hat.`],[`Was verändert der Ausreißer 20 statt 8 bei 2, 3, 3 und 8?`,`Der Mittelwert steigt von 4 auf 7 und die Spannweite von 6 auf 18. Der Modalwert bleibt 3.`],[`Kann derselbe Mittelwert zu verschiedenen Verteilungen gehören?`,`Ja. 4, 4, 4, 4 und 1, 2, 5, 8 haben beide Mittelwert 4, aber sehr unterschiedliche Streuungen.`]],arithmetic:[[`Warum bleibt 704 beim Entbündeln dieselbe Zahl?`,`7 Hunderter und 4 Einer werden zu 6 Hundertern, 9 Zehnern und 14 Einern. Beide Darstellungen ergeben 704.`],[`Warum steht das Zehner-Teilprodukt eine Stelle weiter links?`,`Bei 347 · 26 steht die 2 für 20. Deshalb ist dieses Teilprodukt 6.940 und nicht 694.`],[`Darfst du die Null im Ergebnis 1.248 : 6 = 208 auslassen?`,`Nein. 4 Zehner lassen sich nicht auf sechs volle Zehnergruppen verteilen. Die Null hält den Zehnerplatz im Quotienten frei.`],[`Warum braucht man für 25 Kinder und Busse mit acht Kinderplätzen vier Busse?`,`Drei Busse haben nur 24 Kinderplätze. Der Rest bedeutet ein weiteres Fahrzeug, nicht einen Bruchteil eines nutzbaren Busses.`]],divisibility:[[`Was verbindet 3 und 12 in 3 · 4 = 12?`,`3 ist ein Teiler von 12; 12 ist ein Vielfaches von 3. 12 : 3 hat keinen Rest.`],[`Warum reicht bei der Teilbarkeit durch 3 nicht die letzte Ziffer?`,`Die Regel nutzt die Quersumme aller Ziffern: 234 hat Quersumme 9 und ist durch 3 teilbar.`],[`Ist jede ungerade Zahl prim?`,`Nein. 9 = 3 · 3 ist ungerade, hat aber mehr als zwei positive Teiler.`],[`Wie prüfst du die Vermutung „immer plus vier“ bei einer Zahlenfolge?`,`Berechne jede Differenz zwischen Nachbarn. Eine einzige passende Differenz reicht noch nicht als Prüfung aller vorgegebenen Schritte.`]],geometry:[[`Ist jedes Quadrat auch ein Rechteck?`,`Ja. Es erfüllt die Rechteckeigenschaft von vier rechten Winkeln. Umgekehrt braucht ein Rechteck keine vier gleich langen Seiten.`],[`Wie vermeidest du die falsche Skala beim Winkelmessen?`,`Schätze erst die Winkelart. Lies dann die Skala, deren 0° auf dem angelegten Schenkel liegt.`],[`Warum sind (3|4) und (4|3) nicht derselbe Punkt?`,`Die erste Zahl bestimmt die waagerechte, die zweite die senkrechte Bewegung vom Ursprung. Vertauschen verändert die Position.`],[`Wo liegt das Spiegelbild von (2|3) an x = 5?`,`Drei Schritte rechts von der Achse, also bei (8|3). Beide Punkte haben dieselbe Höhe und denselben senkrechten Abstand zur Achse.`]],measure:[[`Haben Rechtecke mit gleichem Umfang auch gleiche Fläche?`,`Nein. 6 × 4 und 8 × 2 haben je 20 cm Umfang, aber 24 cm² und 16 cm² Fläche.`],[`Was muss beim Zerlegen einer Fläche vermieden werden?`,`Lücken und doppelt gezählte Überlappungen. Teile müssen zusammen genau die ursprüngliche Fläche ergeben.`],[`Warum braucht ein Würfelnetz sechs Quadrate?`,`Jedes Quadrat wird zu einer der sechs Außenflächen. Beim Falten dürfen sie sich nicht überdecken.`],[`Wie viele Einheitswürfel enthält ein Quader 4 × 3 × 2?`,`Eine Schicht enthält 4 · 3 = 12 Würfel. Zwei Schichten enthalten 24 Würfel, also 24 cm³ bei Zentimeterkanten.`]],fractions:[[`Wann sind drei markierte Stücke wirklich drei Achtel?`,`Wenn das Ganze in acht gleich große Stücke geteilt ist und genau drei davon markiert sind.`],[`Warum sind 1/2 und 2/4 gleich viel?`,`Jede Hälfte wird in zwei gleiche Teile zerlegt. Es gibt mehr, aber kleinere Stücke; die markierte Menge bleibt gleich.`],[`Warum ist 1/3 größer als 1/5?`,`Bei gleich großen Ganzen sind Drittel größere Stücke als Fünftel. Ein größerer Nenner bedeutet kleinere Einzelstücke.`],[`Warum ist 1/2 + 1/4 nicht 2/6?`,`Die Stücke sind verschieden groß. Erst 1/2 in 2/4 umteilen, dann die Viertel zählen: 2/4 + 1/4 = 3/4.`]],decimals:[[`Warum ist 0,7 größer als 0,65?`,`0,7 = 0,70. 70 Hundertstel sind mehr als 65 Hundertstel.`],[`Was bedeutet Komma unter Komma?`,`Gleiche Stellenwerte stehen untereinander: Einer unter Einer, Zehntel unter Zehntel. Ergänzte Nullen rechts ändern den Wert nicht.`],[`Warum ist 2,35 · 4 = 9,40?`,`235 Hundertstel mal vier sind 940 Hundertstel. 940/100 = 9,40.`],[`Wie kannst du drei Hefte zu 1,25 € ohne Kommarechnung berechnen?`,`Rechne in Cent: 125 · 3 = 375 Cent, also 3,75 €.`]]};function Rg(e,t){let n=Lg[e][t%Lg[e].length];return{question:n[0],explanation:n[1]}}function zg(e,t,n){let r=Ig[e].types;return e===`mental`?og(7241+t*193+n*997,1,[`order`,`order`,`bracket`,`smart`][t%4]):sg(e,7241+t*193+n*997,1,r[t%r.length])}function Bg(e,t){if(tg(e,t))return`Richtig. Vergleiche nun den Rechenweg und begründe einen Schritt.`;if(e.fields&&e.topic===`fractions`){let n=t.split(`|`).map(Number),r=String(e.answer).split(`|`).map(Number);return n.length===2&&n[0]===r[1]&&n[1]===r[0]?`Zähler und Nenner sind vertauscht. Oben zäh oint:140}})},{title:`Ordnen, Vorgänger und Nachfolger`,text:`3.098 ist kleiner als 3.108. Beim Vergleichen beginnen wir links. Die Tausender sind gleich. Die Hunderter entscheiden: 0 ist kleiner als 1. Der unmittelbare Vorgänger ist immer um 1 kleiner, der Nachfolger um 1 größer – auch wenn ein gezeichneter Abstand 100 bedeutet.`,rule:`< heißt kleiner als; > heißt größer als. Die offene Seite zeigt zur größeren Zahl.`,visual:(0,H.jsxs)(`div`,{className:`worked`,children:[(0,H.jsx)(`span`,{children:`3.098 < 3.108`}),(0,H.jsx)(`span`,{children:`9.999 < 10.000 < 10.001`}),(0,H.jsx)(`strong`,{children:`Vorgänger · Zahl · Nachfolger`})]})},{title:`Abstände und die Mitte`,text:`Zwischen 240 und 300 liegt ein Abstand von 60. Die Mitte teilt diesen Abstand in zwei gleich große Stücke: 30 und 30. Daher ist 270 die Mitte. Das hilft dir auch beim Runden und beim Ablesen zwischen Gitterlinien.`,rule:`Abstand = größere Zahl − kleinere Zahl. Mitte = kleinere Zahl + halber Abstand.`,visual:(0,H.jsx)(Vg,{line:{start:240,step:6,steps:10,point:270}}),example:`240 + (300 − 240) : 2 = 240 + 30 = 270.`}],units:[{title:`Welche Einheit passt?`,text:`Eine Maßzahl braucht eine passende Einheit. „18“ allein sagt noch nicht, ob es um 18 Zentimeter, 18 Kilogramm oder 18 Minuten geht. Ein Bleistift kann 18 cm lang sein. 18 km wären unplausibel. Auf einer Diagrammachse muss klar sein, was gemessen oder gezählt wird.`,rule:`Prüfe die Größe und die Größenordnung. Anzahl: Kinder oder Stück; Länge: mm, cm, m, km; Masse: g, kg, t; Zeit: s, min, h.`,visual:(0,H.jsx)(Wg,{headers:[`Situation`,`Plausible Angabe`],rows:[[`Länge eines Bleistifts`,`18 cm`],[`Masse eines Apfels`,`180 g`],[`Dauer einer Unterrichtsstunde`,`45 min`],[`Inhalt einer Trinkflasche`,`750 ml`]]})},{title:`Längen, Massen und Geld umrechnen`,text:`Zur kleineren Einheit wird die Maßzahl größer. 2 m sind 200 cm. Zur größeren Einheit wird die Maßzahl kleiner: 1.500 g sind 1,5 kg. Die Größe selbst bleibt gleich. In dieser App schreibst du Dezimalzahlen mit Komma.`,rule:`Zur kleineren Einheit: multiplizieren. Zur größeren Einheit: dividieren. Den Umrechnungsfaktor immer prüfen!`,visual:(0,H.jsx)(Wg,{headers:[`Größe`,`Zusammenhang`],rows:[[`Länge`,`1 km = 1.000 m; 1 m = 100 cm; 1 cm = 10 mm`],[`Masse`,`1 t = 1.000 kg; 1 kg = 1.000 g`],[`Geld`,`1 € = 100 ct`],[`Volumen`,`1 l = 1.000 ml`]]})},{title:`Zeit und Größen vergleichen`,text:`Bei Zeit rechnest du anders: Eine Stunde hat 60 Minuten. 2 Stunden und 15 Minuten sind 2 · 60 + 15 = 135 Minuten. Zum Vergleichen wandelst du beide Angaben in dieselbe Einheit um.`,rule:`Erst dieselbe Einheit herstellen, dann Zahlen vergleichen. 3 m = 300 cm; deshalb sind 3 m weniger als 320 cm.`,visual:(0,H.jsxs)(`div`,{className:`worked`,children:[(0,H.jsx)(`span`,{children:`2 h 15 min = 135 min`}),(0,H.jsx)(`span`,{children:`3 m = 300 cm`}),(0,H.jsx)(`strong`,{children:`3 m < 320 cm`})]})},{title:`Fläche und Volumen · Vertiefung`,text:`Bei Flächen zählen zwei Richtungen: Ein Quadrat mit Seitenlänge 1 dm hat Seitenlänge 10 cm. Darin liegen 10 · 10 = 100 Quadratzentimeter. Bei Rauminhalten sind es drei Richtungen: 1 dm³ = 10 · 10 · 10 cm³ = 1.000 cm³. Ein Kubikdezimeter entspricht einem Liter.`,rule:`1 dm² = 100 cm². 1 dm³ = 1.000 cm³ = 1 l = 1.000 ml. Nicht einfach den Faktor der Längeneinheiten übernehmen.`,visual:(0,H.jsx)(Wg,{headers:[`Länge`,`Fläche`,`Volumen`],rows:[[`1 dm = 10 cm`,`1 dm² = 100 cm²`,`1 dm³ = 1.000 cm³`],[`Eine Richtung`,`Zwei Richtungen`,`Drei Richtungen`]]}),extension:!0}],stats:[{title:`Anzahl und Anteil unterscheiden`,text:`Dieser Bereich vertieft Themen für die Klassen 5/6. Die absolute Häufigkeit zählt, wie oft etwas vorkommt. Die relative Häufigkeit vergleicht diese Anzahl mit der Gesamtzahl. 10 Radfahrer von 20 Kindern sind die Hälfte, also 50 %. 12 von 30 sind nur 40 %.`,rule:`Relative Häufigkeit = Anzahl : Gesamtzahl. Als Prozent: Anzahl : Gesamtzahl · 100. Verschieden große Gruppen vergleichst du mit Anteilen.`,visual:(0,H.jsx)(Wg,{headers:[`Klasse`,`Radfahrer`,`Gesamt`,`Anteil`],rows:[[`5a`,10,20,`50 %`],[`5b`,12,30,`40 %`]]})},{title:`Kreisdiagramme lesen`,text:`Der ganze Kreis steht für alle Antworten, also 100 %. Ein Halbkreis zeigt 50 %, ein Viertel 25 %. Die Sektoren müssen zusammen den ganzen Kreis ergeben. Farben und Legende sagen dir, welcher Sektor zu welcher Kategorie gehört.`,rule:`Das Kreisdiagramm zeigt Anteile. Die genaue Anzahl kannst du nur berechnen, wenn du die Gesamtzahl kennst.`,visual:(0,H.jsx)(Ug,{values:[50,25,25],labels:[`Rad`,`Bus`,`Zu Fuß`]}),example:`Bei insgesamt 24 Kindern sind 25 % genau 24 : 4 = 6 Kinder.`},{title:`Mittelwert und Modalwert`,text:`Vier Kinder lesen 2, 3, 3 und 8 Bücher. Der Mittelwert verteilt die gesamte Anzahl rechnerisch gleichmäßig: (2 + 3 + 3 + 8) : 4 = 4. Der Modalwert ist 3, weil dieser Wert am häufigsten vorkommt. Ein Mittelwert muss nicht selbst unter den beobachteten Werten vorkommen.`,rule:`Mittelwert: Summe : Anzahl. Modalwert: häufigster Wert. Es kann mehrere Modalwerte geben.`,visual:(0,H.jsxs)(`div`,{className:`worked`,children:[(0,H.jsx)(`span`,{children:`2 + 3 + 3 + 8 = 16`}),(0,H.jsx)(`strong`,{children:`Mittelwert: 16 : 4 = 4`}),(0,H.jsx)(`span`,{children:`Modalwert: 3`})]})},{title:`Spannweite und auffällige Werte`,text:`Die Spannweite ist größter Wert minus kleinster Wert. Bei 2, 3, 3 und 8 beträgt sie 6. Ein einzelner sehr großer Wert kann den Mittelwert stark erhöhen. Deshalb darf „durchschnittlich“ nicht mit „bei jeder Person“ verwechselt werden.`,rule:`Beschreibe Daten mit mehreren Informationen: Anzahl, Verteilung, häufigster Wert, Mittelwert und Spannweite.`,visual:(0,H.jsx)(Wg,{headers:[`Daten`,`Mittelwert`,`Modalwert`,`Spannweite`],rows:[[`2, 3, 3, 8`,4,3,6],[`2, 3, 3, 20`,7,3,18]]})},{title:`Was ein Diagramm verschweigt`,text:`Wenn du Werte gruppierst, verlierst du Einzelinformationen. Bei „0–2 Bücher: vier Kinder“ weißt du nicht mehr, wer genau 0, 1 oder 2 Bücher gelesen hat. Auch ein Mittelwert verrät nicht die einzelnen Werte. Frage immer, welche Information für dein Ziel gebraucht wird.`,rule:`Eine gute Auswertung beantwortet die Frage und nennt ihre Grenzen. Überprüfe auch, wie und bei wem die Daten erhoben wurden.`,visual:(0,H.jsxs)(H.Fragment,{children:[(0,H.jsx)(Wg,{headers:[`Gleicher Mittelwert`,`Unterschiedliche Verteilung`],rows:[[`4, 4, 4, 4 → Mittelwert 4`,`Spannweite 0`],[`1, 2, 5, 8 → Mittelwert 4`,`Spannweite 7`]]}),(0,H.jsx)(_g,{children:`Gleicher Durchschnitt bedeutet nicht gleiche Verteilung.`})]})}]},p_=[{title:`Balken und Säulen sicher unterscheiden`,text:`Im Säulendiagramm zeigt die Höhe den Wert. Im Balkendiagramm zeigt ihn die Länge. Die Daten können trotzdem dieselben sein. Die Zahlenachse liegt beim Balkendiagramm waagerecht. Lies die Achsen auch dann neu, wenn dir das Bild bekannt vorkommt.`,rule:`Säulen: senkrecht. Balken: waagerecht. Gleiche Daten bleiben beim Wechsel der Darstellung gleich.`,visual:(0,H.jsxs)(`div`,{className:`chart-pair`,children:[(0,H.jsx)(hg,{values:[8,6,10],labels:[`Apfel`,`Birne`,`Banane`],scale:2,unit:`Stück`,title:`Obstverkauf · Säulen`}),(0,H.jsx)(hg,{values:[8,6,10],labels:[`Apfel`,`Birne`,`Banane`],scale:2,unit:`Stück`,title:`Obstverkauf · Balken`,horizontal:!0})]})},{title:`Zwei Diagramme fair vergleichen`,text:`Schule A und B haben verschiedene Skalen. Die Radsäule kann in A höher aussehen, obwohl B mehr Radfahrer hat. Lies beide Werte ab: 40 und 60. B hat 20 mehr. Für den Anteil bräuchtest du zusätzlich die Gesamtzahl der Kinder beider Schulen.`,rule:`Vergleiche Titel, Zeitpunkt, Kategorien, Einheit und Skala. Unterscheide Anzahl und Anteil.`,visual:(0,H.jsxs)(`div`,{className:`chart-pair`,children:[(0,H.jsx)(hg,{values:[40,20],labels:[`Rad`,`Bus`],scale:10,maxValue:100,unit:`Kinder`,title:`Schule A`}),(0,H.jsx)(hg,{values:[60,40],labels:[`Rad`,`Bus`],scale:20,maxValue:200,unit:`Kinder`,title:`Schule B`})]})},{title:`Eine passende Skala auswählen`,text:`Der größte Wert ist 60. Wenn dein Diagramm sechs Gitterabstände hat, passt die Schrittweite 10 genau. Die Beschriftung lautet 0, 10, 20, 30, 40, 50, 60. Gleiche Abstände müssen gleich große Zahlenschritte bedeuten. Eine abgeschnittene Zahlenachse kann Unterschiede größer erscheinen lassen.`,rule:`Titel und Einheiten gehören dazu. Für unsere Säulen- und Balkendiagramme beginnt die Zahlenachse bei 0. Prüfe fremde Diagramme auf verzerrende Achsen.`,visual:(0,H.jsx)(hg,{values:[30,50,60],labels:[`Montag`,`Dienstag`,`Mittwoch`],scale:10,unit:`verkaufte Stück`,title:`Brötchenverkauf`})},{title:`Eine eigene Umfrage durchführen`,text:`Formuliere eine eindeutige Frage. Überlege vorab, wen du befragen willst und was du vermutest. Lege Kategorien fest, die sich nicht überschneiden. Erfasse jede Antwort einmal und überprüfe am Ende deine Vermutung mit den Daten.`,rule:`Frage → Vermutung → Auswahl der Befragten → Strichliste → Diagramm → begründetes Ergebnis.`,visual:(0,H.jsx)(Jg,{})}],m_={title:`Zahlen vergleichen und ordnen`,text:`Vergleiche natürliche Zahlen zuerst anhand ihrer Stellenanzahl. Bei gleicher Länge prüfst du von links nach rechts. 2.403.050 ist kleiner als 2.430.050, weil an der ersten unterschiedlichen Stelle 0 kleiner als 3 ist. Zum Ordnen kannst du die Zahlen gedanklich auf einen Zahlenstrahl setzen.`,rule:`Vergleiche die erste unterschiedliche Stelle von links. Vorgänger = Zahl − 1, Nachfolger = Zahl + 1.`,visual:(0,H.jsxs)(`div`,{className:`worked`,children:[(0,H.jsx)(`span`,{children:`999.999 < 1.000.000 < 1.000.001`}),(0,H.jsx)(`strong`,{children:`2.403.050 < 2.430.050`})]})},h_={title:`Die Genauigkeit muss zum Zweck passen`,text:`Für einen groben Bericht kann man 48.372 Besucher als etwa 48.000 angeben. Auf Tausender gerundet entscheidet die Hunderterziffer 3. Auf Zehntausender gerundet entscheidet dagegen die Tausenderziffer 8: etwa 50.000. Beim Kassieren brauchst du den exakten Geldbetrag.`,rule:`Wähle die Rundungsstelle passend zur Fragestellung. Kennzeichne gerundete Angaben mit „etwa“ oder „ungefähr“.`,visual:(0,H.jsx)(Wg,{headers:[`Angabe`,`Bedeutung`],rows:[[`48.372`,`Exakte Anzahl`],[`≈ 48.000`,`Auf Tausender gerundet`],[`≈ 50.000`,`Auf Zehntausender gerundet`]]})},g_={...f_,...Fg,data:[{title:`Aus Antworten werden Daten`,text:`Wie kommen die Kinder zur Schule? Jede Antwort ist ein Datenwert. Die unsortierte Sammlung heißt Urliste. Wir ordnen die Antworten in Kategorien: Rad, Bus und zu Fuß. Jede Antwort darf genau einmal gezählt werden.`,rule:`Urliste → Strichliste → Häufigkeit. Die Häufigkeit sagt dir, wie oft eine Antwort vorkommt.`,visual:(0,H.jsx)(vg,{})},{title:`Der fünfte Strich macht das Bündel`,text:`Für jede Antwort zeichnest du einen Strich. Den fünften Strich legst du schräg durch die ersten vier. So erkennst du Mengen schnell, ohne jeden Strich einzeln zu zählen.`,rule:`Ein vollständiges Fünferbündel steht für 5. Drei Bündel und zwei Striche sind 3 · 5 + 2 = 17.`,visual:(0,H.jsxs)(`div`,{className:`tally-demo`,children:[(0,H.jsx)(mg,{n:17}),(0,H.jsxs)(`span`,{children:[`= 5 + 5 + 5 + 2 = `,(0,H.jsx)(`strong`,{children:`17`})]})]})},{title:`Baue dein eigenes Diagramm`,text:`Ein Säulendiagramm hat senkrechte Säulen. Die Kategorien stehen unten. Die Zahlenachse zeigt, wie viele Kinder gezählt wurden. Alle Säulen sind gleich breit. Die Zahlenachse beginnt bei 0 und hat gleich große Schritte. Im Balkendiagramm verlaufen die Balken waagerecht.`,rule:`Lies immer Titel, Kategorien, Einheit und Schrittweite. Eine Gitterlinie bedeutet nicht automatisch 1.`,visual:(0,H.jsx)(yg,{})},{title:`Daten vergleichen und kritisch lesen`,text:`In der Umfrage wählen 7 Kinder Rad, 4 Bus und 9 zu Fuß. Zu Fuß gehen 2 Kinder mehr als mit dem Rad fahren. Insgesamt sind es 20 Kinder. Vergleiche bei zwei Diagrammen zuerst die Skalen: Eine höhere Säule bedeutet bei verschiedenen Skalen nicht automatisch eine größere Zahl.`,rule:`Unterschied: größere Zahl minus kleinere Zahl. Gesamtzahl: alle Häufigkeiten addieren. Vergleiche Zahlen, nicht nur Säulenhöhen.`,visual:(0,H.jsx)(hg,{values:[7,4,9],labels:[`Rad`,`Bus`,`Zu Fuß`],scale:2,highlight:2}),example:`9 − 7 = 2 Kinder Unterschied · 7 + 4 + 9 = 20 Kinder insgesamt`}],numbers:[{title:`Zehn passen in die nächste Stelle`,text:`Unser Zahlensystem heißt Zehnersystem. Zehn Einer werden zu einem Zehner. Zehn Zehner werden zu einem Hunderter. Jede Stelle hat den zehnfachen Wert ihrer rechten Nachbarstelle.`,rule:`Nach links wird der Stellenwert immer zehnmal so groß. Nach rechts wird er durch zehn geteilt.`,visual:(0,H.jsx)(bg,{})},{title:`Jede Ziffer hat ihren Platz`,text:`Die Ziffer 4 hat in 45.203 den Wert 40.000. Die 5 steht für 5.000, die 2 für 200 und die 3 für 3. Bei den Zehnern steht eine 0. Sie hält den Platz frei. Ohne diese Null würde eine andere Zahl entstehen.`,rule:`Ziffer ist das Zeichen; Stellenwert ist der Wert des Platzes. Eine Null kann ein unverzichtbarer Platzhalter sein.`,visual:(0,H.jsxs)(H.Fragment,{children:[(0,H.jsx)(gg,{n:45203,highlight:1}),(0,H.jsxs)(`div`,{className:`mini-equations`,children:[(0,H.jsx)(`span`,{children:`4 · 10.000`}),(0,H.jsx)(`span`,{children:`5 · 1.000`}),(0,H.jsx)(`span`,{children:`2 · 100`}),(0,H.jsx)(`span`,{children:`0 · 10`}),(0,H.jsx)(`span`,{children:`3 · 1`})]})]})},{title:`Große Zahlen in Dreiergruppen lesen`,text:`Bilde Dreiergruppen von rechts. Nach der Einergruppe kommen Tausender, Millionen und Milliarden. Eine Million sind tausend Tausender. Eine Milliarde sind tausend Millionen. Lies zum Beispiel: drei Milliarden, vierhundertzwanzig Millionen, fünftausendachtzehn.`,rule:`3 | 420 | 005 | 018 → Milliarden | Millionen | Tausender | Einer. Trennpunkte verbessern die Lesbarkeit; sie sind keine Dezimalkommas.`,visual:(0,H.jsxs)(H.Fragment,{children:[(0,H.jsxs)(`div`,{className:`group-number`,children:[(0,H.jsxs)(`span`,{children:[`3`,(0,H.jsx)(`small`,{children:`Milliarden`})]}),(0,H.jsxs)(`span`,{children:[`420`,(0,H.jsx)(`small`,{children:`Millionen`})]}),(0,H.jsxs)(`span`,{children:[`005`,(0,H.jsx)(`small`,{children:`Tausender`})]}),(0,H.jsxs)(`span`,{children:[`018`,(0,H.jsx)(`small`,{children:`Einer`})]})]}),(0,H.jsx)(gg,{n:3420005018})]})},{title:`Zahlwörter in Ziffern übersetzen`,text:`Zwei Millionen vierhundertdreitausendfünfzig wird zu 2.403.050. Das sind 2 Millionen, 403 Tausender und 50 Einer. In der Gruppe 403 steht die 4 bei den Hunderttausendern. Die Zehntausender sind 0. Fülle die Tafel aus.`,rule:`Fehlende Stellen innerhalb einer Zahl füllst du mit 0. Im Deutschen sprechen wir Einer vor Zehnern: vierunddreißig = 34.`,visual:(0,H.jsx)(xg,{})}],round:[{title:`Runden heißt: sinnvoll vereinfachen`,text:`Eine Schule hat 487 Kinder. Für einen groben Überblick sagen wir: ungefähr 500. Beim Verteilen von Eintrittskarten brauchen wir die genaue Zahl 487. Runden vereinfacht eine Zahl, passt aber nicht zu jeder Situation.`,rule:`Prüfe zuerst den Zweck. „≈“ bedeutet „ist ungefähr gleich“. Verwende „=“ nur für genau gleiche Werte.`,visual:(0,H.jsxs)(`div`,{className:`compare-pair`,children:[(0,H.jsxs)(`div`,{children:[(0,H.jsx)(`small`,{children:`GENAU`}),(0,H.jsx)(`strong`,{children:`487`}),(0,H.jsx)(`span`,{children:`Eintrittskarten bestellen`})]}),(0,H.jsxs)(`div`,{children:[(0,H.jsx)(`small`,{children:`GERUNDET`}),(0,H.jsx)(`strong`,{children:`≈ 500`}),(0,H.jsx)(`span`,{children:`Über die Schulgröße berichten`})]})]})},{title:`Welche runde Zahl liegt näher?`,text:`Beim Runden auf Tausender suchen wir den nächsten Tausender. 4.470 liegt näher an 4.000 als an 5.000. 4.500 liegt genau in der Mitte. Für diesen Fall legen wir fest: aufrunden.`,rule:`0, 1, 2, 3, 4: abrunden. 5, 6, 7, 8, 9: aufrunden. Entscheidend ist die Ziffer direkt rechts neben der Rundungsstelle.`,visual:(0,H.jsx)(Sg,{})},{title:`Eine Nachbarziffer entscheidet`,text:`Runde 14.582 auf Tausender. Die Tausenderziffer ist 4. Direkt rechts steht die 5 bei den Hundertern. Daher wird aufgerundet: 15.000. Alle Ziffern rechts von der Rundungsstelle werden 0.`,rule:`Runde direkt auf die gefragte Stelle. Kein Kettenrunden: 14.449 auf Tausender ist 14.000, nicht
