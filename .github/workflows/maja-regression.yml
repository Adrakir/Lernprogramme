name: Maja – regression checks

on:
  push:
    paths:
      - 'majas-wortwerkstatt/**'
      - '.github/workflows/maja-regression.yml'
  pull_request:
    paths:
      - 'majas-wortwerkstatt/**'
      - '.github/workflows/maja-regression.yml'
  workflow_dispatch:

jobs:
  smoke:
    name: Node.js static smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Maja mobile navigation
        run: node majas-wortwerkstatt/mobile-start.test.cjs
      - name: Check Maja learning experience & handoff
        run: node majas-wortwerkstatt/experience.test.cjs
      - name: Validate all hearing tests, spelling tests and comics
        run: node majas-wortwerkstatt/pruefungen-comics.test.cjs
      - name: Validate wardrobe inventory and saved-outfit compatibility
        run: node majas-wortwerkstatt/baerli-inventar.test.cjs
      - name: Validate treehouse exam gating and virtual shop
        run: node majas-wortwerkstatt/baumhaus.test.cjs

  browser:
    name: Chromium browser smoke checks (emulated viewports)
    # Pinned: Playwright unterstützt "ubuntu-latest" (26.04) noch nicht.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        working-directory: majas-wortwerkstatt
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Lint JavaScript sources
        working-directory: majas-wortwerkstatt
        run: npm run lint
      - name: Test Maja routes and listening settings
        working-directory: majas-wortwerkstatt
        run: npm run test:browser
      - name: Upload comic visual review captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maja-comic-visual-review
          path: majas-wortwerkstatt/qa-comic-shots/*.png
          if-no-files-found: ignore
      - name: Upload Bärli wardrobe screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maja-baerli-wardrobe-review
          path: majas-wortwerkstatt/qa-wardrobe-shots/*.png
          if-no-files-found: ignore
      - name: Upload Regen- und Weihnachts-Schrank-Bilder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maja-saison-schrank-review
          path: majas-wortwerkstatt/qa-season-shots/*.png
          if-no-files-found: ignore
      - name: Upload Baumhaus and Bärli AG shop preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maja-baumhaus-shop-review
          path: majas-wortwerkstatt/qa-treehouse-shots/*.png
          if-no-files-found: ignore
      - name: Upload failed-run browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maja-playwright-report
          path: |
            majas-wortwerkstatt/playwright-report/
            majas-wortwerkstatt/test-results/
          if-no-files-found: ignore
