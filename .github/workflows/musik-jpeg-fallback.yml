name: Musik JPEG-Kompatibilität
on:
  push:
    branches: [qa/musik-imac-bilder-20261030]
    paths:
      - '.github/workflows/musik-jpeg-fallback.yml'
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet pillow
      - run: python3 musik/Musik-Lernapp/tests/build-jpeg-fallback.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add musik/Musik-Lernapp/images/*.jpg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Musikbilder zusätzlich als JPEG für ältere Safari-Browser"
          git push origin HEAD:refs/heads/qa/musik-imac-bilder-20261030
