name: Musikapp – automatisierte Qualitätsprüfung
on:
  push:
    branches: [main]
    paths:
      - 'musik/Musik-Lernapp/**'
      - '.github/workflows/musik-qualitaet.yml'
  pull_request:
    paths:
      - 'musik/Musik-Lernapp/**'
      - '.github/workflows/musik-qualitaet.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Lernwege, Notation, Audio und Offline-Modus
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: musik/Musik-Lernapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: musik/Musik-Lernapp/package-lock.json
      - name: Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund
      - name: Vollständige Fach-, Funktions- und Offline-Tests
        run: npm test
      - name: Echter Browsertest mit Chromium (390px, 320px, Desktop)
        run: node tests/browser-check.cjs
      - name: PDF-Hefte mit echtem PDF-Parser lesen
        run: |
          python3 -m pip install --quiet --disable-pip-version-check --target "$RUNNER_TEMP/music-pdfdeps" pypdf
          PYTHONPATH="$RUNNER_TEMP/music-pdfdeps" python3 - <<'PY'
          from pypdf import PdfReader
          books=[("documents/lernheft-musik.pdf",42),("documents/arbeitsheft-musik.pdf",71)]
          for path,expected in books:
              book=PdfReader(path)
              pages=len(book.pages)
              text_by_page=[len(page.extract_text() or "") for page in book.pages]
              print(f"{path}: {pages} Seiten; {sum(text_by_page)} extrahierbare Zeichen; {sum(n==0 for n in text_by_page)} textleere Seiten")
              assert pages==expected, f"Falsche Seitenzahl: {path}, erwartet {expected}, gefunden {pages}"
              assert sum(text_by_page)>2000, f"Zu wenig lesbarer Text in {path}"
          PY
      - name: Screenshots für die Sichtprüfung bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musik-browser-screenshots
          path: musik/Musik-Lernapp/tests/artifacts/
          if-no-files-found: ignore
