name: Musikapp – automatisierte Qualitätsprüfung
on:
  push:
    branches: [main]
    paths:
      - 'musik/Musik-Lernapp/**'
      - '.github/workflows/musik-qualitaet.yml'
  pull_request:
    paths:
      - 'musik/Musik-Lernapp/**'
      - '.github/workflows/musik-qualitaet.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Lernwege, Notation, Audio und Offline-Modus
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: musik/Musik-Lernapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: musik/Musik-Lernapp/package-lock.json
      - name: Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund
      - name: Vollständige Regressionstests
        run: npm test
      - name: Echter Browsertest mit Chromium (390px, 320px, Desktop)
        run: node tests/browser-check.cjs
      - name: PDF-Hefte wirklich öffnen und Seitenzahlen vergleichen
        run: |
          if command -v pdfinfo >/dev/null 2>&1; then
            pdfinfo documents/lernheft-musik.pdf | grep -E '^Pages:[[:space:]]+42      - name: Browserbilder für die Sichtprüfung bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musik-browser-screenshots
          path: musik/Musik-Lernapp/tests/artifacts/
          if-no-files-found: ignore

            pdfinfo documents/arbeitsheft-musik.pdf | grep -E '^Pages:[[:space:]]+71      - name: Browserbilder für die Sichtprüfung bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musik-browser-screenshots
          path: musik/Musik-Lernapp/tests/artifacts/
          if-no-files-found: ignore

            echo "PDF-Seitenzahlen 42 und 71 stimmen mit den Inhaltsverzeichnissen überein."
          else
            echo "::warning::pdfinfo ist auf dem Runner nicht installiert; PDF-Seitenzahl ungeprüft."
          fi
      - name: Browserbilder für die Sichtprüfung bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musik-browser-screenshots
          path: musik/Musik-Lernapp/tests/artifacts/
          if-no-files-found: ignore
