name: Maja Pages - einmalige Entsperrung

on:
  push:
    paths:
      - ".github/workflows/maja-pages-unblock.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  actions: write

jobs:
  unblock-stale-pages:
    if: github.repository == 'Adrakir/Lernprogramme' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Veralteten noch laufenden Pages-Build von Commit 182fa4f57 gezielt abbrechen
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLD_RUN: "42717570628"
          EXPECTED_SHA: "182fa4f57d"
        run: |
          set -euo pipefail
          endpoint="repos/${GITHUB_REPOSITORY}/actions/runs/${OLD_RUN}"
          current_sha="$(gh api "$endpoint" --jq '.head_sha')"
          state="$(gh api "$endpoint" --jq '.status')"
          echo "Alter Lauf: $OLD_RUN | Commit: $current_sha | Status: $state"
          if [[ "$current_sha" == "$EXPECTED_SHA"* && "$state" != "completed" ]]; then
            echo "Veralteten Lauf stoppen, damit die neuere Advent-Version veröffentlichen kann."
            gh api -X POST "$endpoint/cancel"
          else
            echo "Kein Abbruch nötig (oder Commits stimmen nicht überein)."
          fi
      - name: Festhängende Pages-Bereitstellung gezielt prüfen und abbrechen
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STALE_PAGES_SHA: 15879a9846036f2fef7a377b16751d49f4ca8faa
        run: |
          set -euo pipefail
          endpoint="repos/${GITHUB_REPOSITORY}/pages/deployments/${STALE_PAGES_SHA}"
          echo "Prüfe festhängendes Pages-Deployment: ${STALE_PAGES_SHA}"
          status="$(gh api "$endpoint" --jq '.status')"
          echo "Status vor Reparatur: ${status}"
          case "${status}" in
            succeed|failed|deployment_cancelled)
              echo "Pages-Deployment ist bereits beendet; keine Änderung."
              ;;
            *)
              echo "Abbruch nur des festhängenden Pages-Deployments wird angefordert."
              gh api -X POST "${endpoint}/cancel"
              echo "Abbruch angefordert."
              ;;
          esac
          echo "Status nach Reparatur:"
          gh api "$endpoint" --jq '.status'
