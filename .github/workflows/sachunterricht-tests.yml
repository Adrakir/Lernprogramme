name: Sachunterricht prüfen
on:
  push:
    paths:
      - "sachunterricht-maja/**"
      - ".github/workflows/sachunterricht-tests.yml"
  pull_request:
    paths:
      - "sachunterricht-maja/**"
      - ".github/workflows/sachunterricht-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lernapp:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            os: ubuntu-24.04
          - browser: firefox
            os: macos-15
          - browser: webkit
            os: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Inhalte, Dateien und alte Lernstände prüfen
        run: |
          node --test sachunterricht-maja/tests/inhalt.test.cjs
          node sachunterricht-maja/redaktion-bauen.cjs --check
      - name: Browserwerkzeuge installieren
        run: |
          npm install --prefix "$RUNNER_TEMP/sachunterricht-tools" --no-save --no-audit --no-fund --ignore-scripts playwright@1.62.1
          if [ "${{ matrix.browser }}" = "chromium" ] && command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            "$RUNNER_TEMP/sachunterricht-tools/node_modules/.bin/playwright" install ${{ matrix.browser }}
          else
            "$RUNNER_TEMP/sachunterricht-tools/node_modules/.bin/playwright" install --with-deps ${{ matrix.browser }}
          fi
      - name: Geprüfte Bildreferenz für identische Systemschriften laden
        if: matrix.browser == 'chromium'
        uses: actions/checkout@v4
        with:
          ref: 2de7dde7d76407576db17a920a8928cf43d06227
          path: bildreferenz
          sparse-checkout: sachunterricht-maja
          persist-credentials: false
      - name: Lernen, Prüfungen und Offline-Nutzung durchspielen
        env:
          BROWSER_ENGINE: ${{ matrix.browser }}
          NODE_PATH: ${{ runner.temp }}/sachunterricht-tools/node_modules
          VIEW_REFERENCE: ${{ github.workspace }}/bildreferenz/sachunterricht-maja
          VIEW_OUTPUT: ${{ runner.temp }}/sachunterricht-ansichten
        run: node sachunterricht-maja/tests/browser.test.cjs
      - name: Vergleichsbilder aufbewahren
        if: always() && matrix.browser == 'chromium'
        uses: actions/upload-artifact@v4
        with:
          name: sachunterricht-ansichten
          path: ${{ runner.temp }}/sachunterricht-ansichten
          if-no-files-found: ignore
