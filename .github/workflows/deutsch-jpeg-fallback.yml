name: Deutsch JPEG-Kompatibilitaet (einmalige Generierung)
on:
  push:
    branches: [qa/deutsch-gesamtpruefung-20261030]
    paths:
      - '.github/workflows/deutsch-jpeg-fallback.yml'
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Bildbibliothek bereitstellen
        run: python3 -m pip install --quiet pillow
      - name: WebP-Originalbilder zu JPEG konvertieren
        run: python3 deutsch/Deutschapp_Minka_Fuji/tests/build-jpeg-fallback.py
      - name: JPEG-Dateien dem bestehenden Testzweig hinzufuegen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deutsch/Deutschapp_Minka_Fuji/assets/*.jpg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Deutsch: Fuji, Minka und Erzaehlbilder als JPEG fuer Safari"
          git push origin HEAD:refs/heads/qa/deutsch-gesamtpruefung-20261030
