name: Erdkunde – Folge 4 aus gespeicherten neuen Stimmen rendern

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: erdkunde-film4-upload
  cancel-in-progress: false

jobs:
  rendern:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Projekt auschecken
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python für den Videoschnitt vorbereiten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Erforderliche Programme
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0,<3" "scipy>=1.14,<2"

      - name: Gespeicherte Stimmen verwenden – ohne Sprachdienst oder Credits
        run: |
          set -euo pipefail
          ROOT="erdkunde/Erdkunde_Entdecker_Klasse5_V11/filme"
          mkdir -p "$RUNNER_TEMP/gustav-folge4"
          git fetch origin 44e8415f18d0b1426db61ba34396116eff8bbcbc
          git show "44e8415f18d0b1426db61ba34396116eff8bbcbc:$ROOT/videos/folge-4.mp4" > "$RUNNER_TEMP/gustav-folge4/original.mp4"
          python -u "$ROOT/quelle/revoice_folge4.py" --original "$RUNNER_TEMP/gustav-folge4/original.mp4" --work "$RUNNER_TEMP/gustav-folge4/render"
          cp "$RUNNER_TEMP/gustav-folge4/render/folge-4-neu.mp4" "$ROOT/videos/folge-4.mp4"
          cp "$RUNNER_TEMP/gustav-folge4/render/Gustav_Globus_Folge4_Untertitel.srt" "$ROOT/videos/Gustav_Globus_Folge4_Untertitel.srt"

      - name: MP4 und Laufzeit validieren
        run: |
          set -euo pipefail
          MEDIA="erdkunde/Erdkunde_Entdecker_Klasse5_V11/filme/videos"
          test "$(wc -c < "$MEDIA/folge-4.mp4")" -gt 200000
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 "$MEDIA/folge-4.mp4"
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1 "$MEDIA/folge-4.mp4"
          ffmpeg -nostdin -v error -xerror -i "$MEDIA/folge-4.mp4" -f null -

      - name: Film und Untertitel veröffentlichen
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || {
            echo "main wurde während des Renderns geändert. Bitte aus aktuellem main erneut rendern."
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add erdkunde/Erdkunde_Entdecker_Klasse5_V11/filme/videos/folge-4.mp4
          git add erdkunde/Erdkunde_Entdecker_Klasse5_V11/filme/videos/Gustav_Globus_Folge4_*
          git add erdkunde/Erdkunde_Entdecker_Klasse5_V11/filme/quelle/vertonung-1-bis-4/folge4_timeline.json
          if git diff --cached --quiet; then echo "Folge 4 bereits unverändert gespeichert"; exit 0; fi
          git commit -m "Erdkunde: Folge 4 mit gespeicherten neuen Stimmen reproduzieren"
          git push origin HEAD:main
