name: Erdkunde – Gustav Globus Folge 6 rendern und sichern

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/erdkunde-film6.yml'

permissions:
  contents: write

concurrency:
  group: erdkunde-film6-upload
  cancel-in-progress: false

jobs:
  rendern:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python 3.11 vorbereiten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Renderprogramme und Schriften installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak ffmpeg fonts-lato
          python -m pip install "numpy>=2.0,<3" "pillow>=11,<13" "scipy>=1.14,<2" "basemap>=2.0,<3"

      - name: Fachlogik und Rendercode prüfen
        run: |
          python -m py_compile erdkunde/Erdkunde_Entdecker_Klasse5_V11/filme/quelle/build_folge6.py

      - name: Gradnetz-Animationsfilm erstellen
        env:
          GUSTAV_VIDEO_OUT: ${{ github.workspace }}/erdkunde/Erdkunde_Entdecker_Klasse5_V11/filme/videos
          GUSTAV_VIDEO_TMP: ${{ runner.temp }}/gustav-folge6
        run: |
          mkdir -p "$GUSTAV_VIDEO_OUT" "$GUSTAV_VIDEO_TMP"
          python -u erdkunde/Erdkunde_Entdecker_Klasse5_V11/filme/quelle/build_folge6.py

      - name: MP4, deutsche Tonspur und Untertitel prüfen
        shell: bash
        run: |
          set -euo pipefail
          MEDIA="erdkunde/Erdkunde_Entdecker_Klasse5_V11/filme/videos"
          FILM="$MEDIA/Paul_und_Gustav_Globus_Folge_6_Gradnetz_Koordinaten.mp4"
          test "$(wc -c < "$FILM")" -gt 200000
          test -s "$MEDIA/Gustav_Globus_Folge6_Untertitel.srt"
          grep -q 'Breite vor Länge' "$MEDIA/Gustav_Globus_Folge6_Sprechtext.txt"
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 "$FILM"
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1 "$FILM"
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 "$FILM"
          mv "$FILM" "$MEDIA/folge-6.mp4"

      - name: MP4, Untertitel und Vorschaubilder im bestehenden Repository veröffentlichen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add erdkunde/Erdkunde_Entdecker_Klasse5_V11/filme/videos/folge-6.mp4
          git add erdkunde/Erdkunde_Entdecker_Klasse5_V11/filme/videos/Gustav_Globus_Folge6_*
          if git diff --cached --quiet; then echo "Folge 6 bereits vorhanden"; exit 0; fi
          git commit -m "Erdkunde: Gradnetz-Folge 6 als MP4, Untertitel und Vorschau"
          git pull --rebase origin main
          git push origin HEAD:main
