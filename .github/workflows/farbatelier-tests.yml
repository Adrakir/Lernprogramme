name: Farbatelier im Browser prüfen
on:
  pull_request:
    paths: ['farbatelier/**', '.github/workflows/farbatelier-tests.yml']
  push:
    paths: ['farbatelier/**', '.github/workflows/farbatelier-tests.yml']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install selenium==4.34.2
      - run: python -m unittest discover -s farbatelier/tests -v
  geraete:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: python farbatelier/tests/browser_matrix.py ${{ matrix.browser }}
