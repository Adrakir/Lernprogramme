name: ADHS-AuDHS Browser-Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'adhs-audhs-erwachsene/**'
      - '.github/workflows/adhs-audhs-browser-tests.yml'
  pull_request:
    paths:
      - 'adhs-audhs-erwachsene/**'
      - '.github/workflows/adhs-audhs-browser-tests.yml'

jobs:
  chromium-qa:
    name: Adult ADHD app browser regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: adhs-audhs-erwachsene
    steps:
      - name: Checkout current source
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Run 12 browser scenarios
        run: node qa-browser.cjs
