<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="t d"><title id="t">Kreis im Kreis · Ittens Farben in drei Ringen</title><desc id="d">Innen Gelb, Rot und Blau. Im mittleren Ring kommen Orange, Violett und Grün hinzu. Außen liegen alle zwölf Farben, einschließlich der sechs Tertiärfarben. Gelb liegt in allen Ringen oben.</desc><rect width="640" height="640" rx="20" fill="#faf8f2"/><g font-family="system-ui,sans-serif" text-anchor="middle"><g><title>Gelb</title><path d="M226.47,266 A108,108 0 0 1 413.53,266 L320,320Z" fill="#ffda35" stroke="#faf8f2" stroke-width="3"/><text x="320" y="258" font-size="20" font-weight="650" fill="#132034"><tspan x="320" dy="6">Gelb</tspan></text></g><g><title>Rot</title><path d="M413.53,266 A108,108 0 0 1 320,428 L320,320Z" fill="#e43950" stroke="#faf8f2" stroke-width="3"/><text x="373.69" y="351" font-size="20" font-weight="650" fill="white"><tspan x="373.69" dy="6">Rot</tspan></text></g><g><title>Blau</title><path d="M320,428 A108,108 0 0 1 226.47,266 L320,320Z" fill="#4068c8" stroke="#faf8f2" stroke-width="3"/><text x="266.31" y="351" font-size="20" font-weight="650" fill="white"><tspan x="266.31" dy="6">Blau</tspan></text></g><g><title>Gelb</title><path d="M217.5,142.46 A205,205 0 0 1 422.5,142.46 L374,226.47 A108,108 0 0 0 266,226.47Z" fill="#ffda35" stroke="#faf8f2" stroke-width="3"/><text x="320" y="163.5" font-size="20" font-weight="650" fill="#132034"><tspan x="320" dy="6">Gelb</tspan></text></g><g><title>Orange</title><path d="M422.5,142.46 A205,205 0 0 1 525,320 L428,320 A108,108 0 0 0 374,226.47Z" fill="#ff902b" stroke="#faf8f2" stroke-width="3"/><text x="455.53" y="241.75" font-size="20" font-weight="650" fill="#132034"><tspan x="455.53" dy="6">Orange</tspan></text></g><g><title>Rot</title><path d="M525,320 A205,205 0 0 1 422.5,497.54 L374,413.53 A108,108 0 0 0 428,320Z" fill="#e43950" stroke="#faf8f2" stroke-width="3"/><text x="455.53" y="398.25" font-size="20" font-weight="650" fill