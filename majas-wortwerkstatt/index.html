<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Majas Wortwerkstatt. Sieben Deutschstationen für die 3. Klasse mit Fuji und Minka.">
<meta name="theme-color" content="#fcfaf3">
<title>Majas Wortwerkstatt · Deutsch Klasse 3</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%23185b4a'/%3E%3Cpath d='M24 34V16m0 1c-5-4-12-5-16-3v18c6-2 11-1 16 3 5-4 10-5 16-3V14c-4-2-11-1-16 3Z' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>:root {
  color-scheme:light;
  --ink:#203741;--muted:#51636a;--forest:#185b4a;--deep:#124637;--line:#deded2;--paper:#fcfaf3;
  --mint:#dbf1e7;--lilac:#eee3f8;--peach:#f9e1d3;--sand:#f8e9bb;--sky:#dcecf8;--rose:#f6e1e9;
  font-family:"Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);line-height:1.55}
[hidden]{display:none!important}
a{color:var(--forest);text-underline-offset:4px}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid #205d9e;outline-offset:4px}
.shell{width:min(1120px,calc(100% - 48px));margin-inline:auto}
.skip{position:fixed;top:-100px;left:12px;background:white;padding:12px;z-index:3}
.skip:focus{top:8px}
.top{border-bottom:1px solid #e5e5d9;background:#fffdf7}
.top-inner{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:inline-flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);line-height:1.25}
.brand strong{font-size:17px;display:block}
.brand small{color:var(--muted);font-size:13px}
.brand-symbol,.icon-box{display:grid;place-items:center;width:45px;height:45px;border-radius:14px;flex:none}
.brand-symbol{background:var(--forest);color:white}
svg.ico{width:22px;height:22px;vertical-align:middle;flex:none}
.star-button{border:1px solid #e9d797;border-radius:100px;background:#fff6d9;color:#5a4618;min-height:44px;padding:6px 13px;display:flex;align-items:center;gap:7px;font-weight:800;white-space:nowrap}
.star-button svg{fill:#ffd274;width:20px}
.hero{margin-top:32px;border:1px solid #c6dfd0;border-radius:30px;background:#eaf5ee;display:grid;grid-template-columns:1fr 1.04fr;align-items:center;min-height:358px;overflow:hidden;padding:31px 26px 31px 42px}
.kicker{font-size:12px;font-weight:850;letter-spacing:.11em;text-transform:uppercase;display:flex;align-items:center;gap:8px;color:var(--forest);margin:0 0 11px}
.kicker svg{width:17px;height:17px}
h1,h2,h3,p{margin-top:0}
h1,h2,h3{line-height:1.12;letter-spacing:-.025em}
.hero h1{font-size:clamp(41px,5.4vw,68px);margin-bottom:14px;line-height:.99;letter-spacing:-.06em}
.hero h1 em{font-style:normal;color:var(--forest)}
.hero p:not(.kicker){font-size:17px;max-width:37ch;margin-bottom:22px}
.hero-art svg{width:100%;height:auto;display:block}
.primary,.secondary,.plain{min-height:46px;padding:10px 16px;border-radius:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;line-height:1.2}
.primary{background:var(--forest);border:1px solid var(--forest);color:white;box-shadow:0 3px 0 #103f32}
.primary:hover{background:var(--deep)}
.secondary{background:#fffef9;color:var(--ink);border:1px solid #cbd4cb}
.secondary:hover,.plain:hover{background:#e8f4ee}
.plain{background:transparent;border:1px solid transparent;color:var(--forest);padding-inline:9px}
.primary:disabled,.secondary:disabled{opacity:.52}
.section-top{margin:35px 0 16px;display:flex;justify-content:space-between;align-items:end;gap:14px}
.section-top h2{font-size:clamp(27px,3vw,36px);margin:0 0 4px}
.section-top p,.subtle{color:var(--muted);margin-bottom:0}
.station-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.station{background:#fffefa;border:1px solid var(--line);border-radius:18px;padding:17px;display:flex;flex-direction:column;text-decoration:none;color:var(--ink);min-height:173px;transition:transform .15s,border-color .15s}
.station:hover{transform:translateY(-3px);border-color:#699c89}
.station-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:13px}
.icon-box{background:var(--tint,var(--mint));color:#284c49}
.mint{--tint:var(--mint)}.lilac{--tint:var(--lilac)}.peach{--tint:var(--peach)}.sand{--tint:var(--sand)}.sky{--tint:var(--sky)}.rose{--tint:var(--rose)}
.number{font-size:12px;font-weight:850;letter-spacing:.07em;color:#50646a}
.station h3{font-size:19px;margin:0 0 5px}
.station p{font-size:14px;color:var(--muted);margin:0 0 12px;line-height:1.3}
.station .card-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;color:var(--forest);font-weight:800;font-size:13px}
.card-foot svg{width:18px;height:18px}
.station.quiz{background:#fff3d5;border-color:#ead6a4}
.footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 16px;border-top:1px solid var(--line);padding:16px 0 22px;margin-top:32px;color:var(--muted);font-size:13px}
.route{width:min(820px,100%);margin-inline:auto;padding-top:22px}
.crumb{display:inline-flex;gap:8px;align-items:center;min-height:44px;font-size:14px;font-weight:850;text-decoration:none;margin-bottom:10px}
.crumb svg{width:17px}
.unit-head{padding:24px 27px;border-radius:22px;background:var(--tint,var(--mint));display:flex;gap:16px;align-items:flex-start;margin-bottom:17px}
.unit-head .icon-box{background:#fffdf5}
.unit-head h1{font-size:clamp(31px,6vw,46px);margin:0 0 8px}
.unit-head p:last-child{margin-bottom:0}
.unit-head .kicker{margin-bottom:7px}
.panel{background:#fffefa;border:1px solid var(--line);border-radius:20px;padding:clamp(17px,4vw,29px);margin-bottom:15px}
.panel h2{font-size:clamp(24px,4.5vw,33px);margin-bottom:13px}
.panel h3{margin-bottom:9px}
.lesson-examples{list-style:none;padding:0;margin:16px 0;display:grid;gap:6px}
.lesson-examples li{background:#edf5ee;border-left:4px solid #5b9d85;padding:7px 10px;border-radius:6px;font-weight:700}
.actions,.field-actions{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:15px}
.task-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:14px;font-weight:800;color:var(--muted)}
.bar{height:8px;background:#e6e9e0;border-radius:20px;overflow:hidden;margin-bottom:22px}
.bar span{background:#42927c;display:block;height:100%;border-radius:20px}
.context{padding:13px 15px;border-radius:12px;background:#edf5ee;font-size:clamp(18px,4vw,23px);font-weight:750;line-height:1.45;margin-bottom:16px}
.context strong{background:#ffe3a0;padding:1px 4px;border-radius:4px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.choice,.word,.tile{min-height:48px;padding:8px 12px;border:1px solid #cbd4cb;background:#fff;color:var(--ink);font-weight:750;border-radius:11px}
.choice:hover,.word:hover,.tile:hover{border-color:var(--forest);background:#eef7f0}
.choice[aria-pressed=true],.word[aria-pressed=true]{background:#d2ebdf;border-color:#236753;box-shadow:inset 0 0 0 1px #236753}
.word.noun[aria-pressed=true]{background:#d8ebff;border-color:#22619b;box-shadow:inset 0 0 0 1px #22619b}
.word.verb[aria-pressed=true]{background:#fbdedb;border-color:#a84e46;box-shadow:inset 0 0 0 1px #a84e46}
.word.adj[aria-pressed=true]{background:#d6ecd3;border-color:#3d7141;box-shadow:inset 0 0 0 1px #3d7141}
.wordset,.tile-set{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.sequence{background:#eff3eb;border-radius:12px;padding:9px;min-height:67px;border:1px dashed #a4b8ab;margin:8px 0 12px;align-items:center}
.sequence .tile{background:#d9eee3;border-color:#92baa8}
.field{display:block;font-weight:800;margin-top:11px}
input.answer,textarea.answer{width:100%;background:white;color:var(--ink);border:1.5px solid #acbdb3;border-radius:11px;padding:10px 12px;margin-top:5px;min-height:51px;font-size:18px;resize:vertical}
.feedback,.tip{padding:12px 15px;margin-top:14px;border-radius:11px;background:#fff3d5;border:1px solid #e1ca88}
.feedback.good{background:#e4f4e9;border-color:#a3cdb3}
.feedback p:last-child,.tip p:last-child{margin-bottom:0}
.feedback strong{display:block;margin-bottom:3px}
.inline-status{min-height:1.5em;margin:6px 0 0;color:var(--muted)}
.puzzle-grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));width:min(100%,480px);gap:3px}
.cell{padding:0;min-width:0;min-height:32px;aspect-ratio:1;border:1px solid #cbd4cb;background:#fff;color:var(--ink);font-size:clamp(13px,3vw,17px);font-weight:800;border-radius:5px}
.cell[data-state=start]{background:#ffdf85;border-color:#9d7524}
.cell[data-state=found]{background:#cfe9d8;border-color:#659e7b}
.found-list{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.found-list span{background:#e8f3e9;padding:3px 8px;border-radius:7px}
mark{background:#ffe5a7;color:#3f351f;border-radius:3px;padding:0 2px}
.review-list{padding-left:23px}
.review-list li{padding:8px 0;border-bottom:1px solid var(--line)}
.progress-list{list-style:none;padding:0;margin:0}
.progress-list li{border-bottom:1px solid var(--line);padding:10px 0;display:flex;justify-content:space-between;gap:12px}
@media(max-width:850px){.station-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{padding-left:28px;min-height:290px}}
@media(max-width:620px){.shell{width:calc(100% - 28px)}.top-inner{min-height:65px}.brand-symbol{width:37px;height:37px;border-radius:10px}.brand{gap:8px}.brand strong{font-size:15px}.hero{grid-template-columns:1fr;margin-top:18px;padding:21px 18px 5px;border-radius:22px}.hero-art{max-width:440px;width:100%;margin-inline:auto}.hero p:not(.kicker){font-size:16px;margin-bottom:15px}.station-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.station{padding:12px;min-height:159px}.station h3{font-size:17px}.station p{font-size:13px}.section-top{margin-top:23px}.unit-head{padding:17px 14px;gap:10px}.unit-head .icon-box{width:38px;height:38px}}
@media(max-width:375px){.options{grid-template-columns:1fr}.brand strong{font-size:14px}.star-button{padding-inline:8px;font-size:14px}.panel{padding:13px}.cell{min-height:27px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
details{margin:0 0 14px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fcfaf3}
summary{cursor:pointer;font-weight:800;color:var(--forest)}
details ol{margin-bottom:0}
@media(max-width:620px){.hero h1{font-size:clamp(32px,10vw,50px)}}
</style>
</head>

<script>const units = [
  {id:'wortarten', title:'Wortarten', icon:'book', tone:'mint', place:'Fuji sortiert Tierwörter', story:'Fuji schnuppert an drei Kisten. Auf jeder steht eine andere Wortart. Kannst du ihm beim Sortieren helfen?', rule:'Nomen (Namenwörter) schreibt man groß. Oft passen ein Artikel und eine Mehrzahl dazu. Verben (Tunwörter) kannst du verändern. Adjektive (Wiewörter) beschreiben, wie etwas ist.', examples:['der Hund → die Hunde','spielen → ich spiele, du spielst','Minka ist weich. → Wie ist Minka?']},
  {id:'endungen', title:'Nomen-Endungen', icon:'puzzle', tone:'lilac', place:'Minka baut neue Wörter', story:'Minka schiebt Wortkarten über den Tisch. Mit den passenden Endungen werden daraus Nomen.', rule:'Mit den Nachsilben -heit, -keit, -ung und -nis kannst du Nomen erkennen. In diesen Übungen entstehen Nomen mit -heit und -keit aus Adjektiven und Nomen mit -ung aus Verben. Bei -nis kann ein Adjektiv oder ein Verb dazugehören. Prüfe den Artikel und schreibe das Nomen groß.', examples:['wahr → die Wahrheit','freundlich → die Freundlichkeit','retten → die Rettung','geheim → das Geheimnis']},

const pick = (prompt, context, options, answer, hint, why) => ({type:'pick',prompt,context,options,answer,hint,why});
const write = (prompt, context, answer, hint, why, options={}) => ({type:'write',prompt,context,answer,hint,why,...options});
const mark = (prompt, sentence, positions, hint, why, tone='') =>

const sort = (prompt, context, tiles, hint, why) => ({type:'sort',prompt,context,tiles,answer:tiles.join(' → '),hint,why});
const search = (set) => ({type:'search',prompt:'Finde die Nomen im Buchstabengitter.',set,hint:'Alle Wörter stehen waagerecht. Tippe zuerst den Anfang und dann das Ende des Wortes an.',why:'Die farbigen Wortbausteine sind Nachsilben. Jedes gefundene Wort ist ein Nomen.'});

  mark('Markiere alle Verben.','Fuji bellt und Minka schnurrt.',[1,4],'Was tun die Tiere?','Fuji bellt. Minka schnurrt. Das sind die beiden Tätigkeiten.','verb'),
  mark('Markiere alle Adjektive.','Fuji ist treu und Minka ist sanft.',[2,6],'Wie sind Fuji und Minka?','treu und sanft sagen, wie Fuji und Minka sind.','adj'),

const families = [

 ['freundlich','die Freundlichkeit'],['flüssig','die Flüssigkeit'],['ehrlich','die Ehrlichkeit'],['tapfer','die Tapferkeit'],['fröhlich','die Fröhlichkeit'],['einsam','die Einsamkeit'],['heiter','die Heiterkeit'],['traurig','die Traurigkeit'],['gültig','die Gültigkeit'],['sauber','die Sauberkeit'],
 ['heizen','die Heizung'],['impfen','die Impfung'],['erklären','die Erklärung'],['erzählen','die Erzählung'],['zeichnen','die Zeichnung'],['retten','die Rettung'],['senden','die Sendung'],['spannen','die Spannung'],['drehen','die Drehung'],['tarnen','die Tarnung'],['wohnen','die Wohnung'],['kreuzen','die Kreuzung'],['üben','die Übung'],['rechnen','die Rechnung'],['erwarten','die Erwartung'],['beobachten','die Beobachtung'],

];

const searchSets = [

  pick('Welche Nachsilbe steckt in diesem Nomen?','die Freiheit',endings,'-heit','Lies die letzten Buchstaben.','Frei + heit ergibt Freiheit. Das Wort wird großgeschrieben.'),
  pick('Welches Wort gehört zu „tapfer“?','Minka zeigt viel …', ['die Tapferkeit','die Tapferheit','die Tapferung'],'die Tapferkeit','Lies die Wörter laut.','Aus dem Adjektiv tapfer und -keit wird das Nomen die Tapferkeit.'),
  mark('Markiere die beiden Nomen mit -ung.','Maja liest eine Erzählung und malt eine Zeichnung.',[3,7],'Suche am Wortende nach -ung.','Erzählung gehört zu erzählen. Zeichnung gehört zu zeichnen.'),
  mark('Markiere die Nomen mit -heit, -keit, -ung oder -nis.','Die Rettung ist ein Erlebnis und Fuji zeigt Tapferkeit.',[1,4,8],'Prüfe die Endung jedes Wortes.','Rettung endet auf -ung, Erlebnis auf -nis und Tapferkeit auf -keit.'),
  pick('Aus welcher Wortart entsteht „die Rettung“?','retten → die Rettung',types,'Verb','Ich rette, du rettest. Welche Wortart lässt sich so verändern?','retten ist ein Verb. Aus rett- und -ung wird die Rettung.'),
  search(searchSets[0]),
  search(searchSets[1]),
  ...families.map(([base,noun],i) => {
    const suffix = endings.find(end=>noun.endsWith(end.slice(1)));
    const word = noun.split(' ')[1];
    const root = word.slice(0,-suffix.length+1);
    const kind = suffix === '-ung' || (suffix === '-nis' && !['geheim','wild'].includes(base)) ? 'Verb' : 'Adjektiv';
    const why = `„${base}“ ist ein ${kind}. In „${noun}“ steckt ${root} + ${suffix.slice(1)}. Das Nomen ${word} beginnt groß.`;
    if (i%3===0) return write('Bilde das Nomen. Schreibe auch den Artikel.',base,noun,`Das Wort endet auf ${suffix}. Denk an den Artikel.`,why);
    if (i%3===1) return write(`Schreibe das verwandte ${kind}.`,noun,base,kind==='Verb'?'Schreibe die Grundform des Verbs.':'Schreibe das Wiewort klein.',why);
    return pick('Welche Nachsilbe steckt in diesem Nomen?',noun,endings,suffix,'Tippe den passenden Baustein am Ende an.',why);
  })
];

  ['Wahrheit','Wahr','heit'],

const pref = [
 ['verkaufen','kaufen','ver','Maja möchte ihre alten Bücher ___.'],
 ['bezahlen','zahlen','be','Maja muss die Hefte an der Kasse ___.'],
 ['erzählen','zählen','er','Maja möchte Fuji eine Geschichte ___.'],
 ['bemalen','malen','be','Maja möchte das Vogelhaus bunt ___.'],
 ['verlaufen','laufen','ver','Im Wald kann man sich ___.'],
 ['erfinden','finden','er','Minka möchte ein neues Spiel ___.'],
 ['verstecken','stecken','ver','Fuji will seinen Knochen unter der Decke ___.'],
 ['besuchen','suchen','be','Maja möchte ihre Oma ___.'],

 ['verkleiden','kleiden','ver','Für die Feier möchte Maja sich ___.'],
 ['bedecken','decken','be','Die Blätter können den Boden ganz ___.'],
 ['erleben','leben','er','Die drei möchten ein Abenteuer ___.']
];
questions.vorsilben = pref.map(([word,base,pre,line],i) => {
  const why = `Das Wort „${word}“ beginnt mit ${pre}-. Der restliche Baustein ist „${base}“.`;
  if (i%3===0) return pick('Welche Vorsilbe steht am Anfang?',word,['ver-','be-','er-'],pre+'-','Lies die ersten zwei oder drei Buchstaben.',why);

  return sort('Setze die Wortbausteine zusammen.',line,[pre,base],'Die Vorsilbe kommt zuerst.',why);
});

const compound = [
 ['der Garten','die Tür','die Gartentür'],['die Tür','der Schlüssel','der Türschlüssel'],
 ['die Katze','das Futter','das Katzenfutter'],['der Regen','der Schirm','der Regenschirm'],
 ['das Haus','das Dach','das Hausdach'],['das Dach','das Fenster','das Dachfenster'],
 ['der Wald','der Weg','der Waldweg'],['das Feld','der Weg','der Feldweg'],
 ['der Tisch','die Decke','die Tischdecke'],['der Baum','das Haus','das Baumhaus'],
 ['die Blume','der Topf','der Blumentopf'],['der Hund','die Leine','die Hundeleine'],
 ['das Eis','die Tüte','die Eistüte'],['das Bett','das Kissen','das Bettkissen'],
 ['der Ball','das Spiel','das Ballspiel'],['das Buch','der Schrank','der Bücherschrank'],
 ['die Schule','der Hof','der Schulhof'],['der Vogel','das Nest','das Vogelnest']
];
questions.wortketten = compound.map(([a,b,word],i)=>{
  const article = b.split(' ')[0];
  const why = `Das letzte Wort ist „${b}“. Darum heißt es „${word}“. Schreibe das neue Nomen zusammen und vorne groß.`;
  return i%3===1
    ? pick('Welcher Artikel passt zum neuen Nomen?',word.split(' ')[1],['der','die','das'],article,`Schau auf das letzte Nomen: ${b}.`,why)
    : write('Bilde ein neues Nomen. Schreibe es mit Artikel.',a+' + '+b,word,`Der Artikel von „${b}“ hilft dir.`,why);
});
questions.wortketten.splice(2,0,...[
 ['Haus','Dach','Fenster','das Hausdach','das Dachfenster'],
 ['Garten','Tür','Schlüssel','die Gartentür','der Türschlüssel'],
 ['Regen','Schirm','Ständer','der Regenschirm','der Schirmständer'],

].map(([a,b,c,first,second])=>sort('Lege eine Wortkette aus drei Bausteinen.',`Beginne mit „${a}“. Bilde danach ein Wort mit „${b}“ am Anfang.`,[a,b,c],`Der mittlere Baustein „${b}“ gehört zu beiden neuen Wörtern.`,`Aus ${a} und ${b} wird ${first}. Aus ${b} und ${c} wird ${second}.`)));

const persons = ['ich','du','er/sie/es','wir','ihr','sie (Mehrzahl)'];
const verbs = [

 ['fliegen','fliege','fliegst','fliegt','fliegen','fliegt','fliegen'],
 ['fallen','falle','fällst','fällt','fallen','fallt','fallen'],
 ['fegen','fege','fegst','fegt','fegen','fegt','fegen'],
 ['rütteln','rüttle','rüttelst','rüttelt','rütteln','rüttelt','rütteln'],

questions.verben = verbs.flatMap(([base,...forms],i)=>[i%6,(i+2)%6].map(n=>{
  const answer = forms[n];

 if(i%3===1) return write('Schreibe die 1. Vergleichsstufe.',base,first,'Oft endet die erste Vergleichsstufe auf -er. Achte darauf, ob sich der Wortstamm ändert.',why);

questions.steigern.push(
  pick('Welches Wort passt in die Lücke?','Majas Drachen fliegt höher ___ Fujis Drachen.',['als','wie'],'als','Die Drachen fliegen verschieden hoch.','Bei einem Unterschied steht nach der Vergleichsform „als“.'),

 mark('Markiere alle Adjektive.','Ein kalter Wind weht über die leeren Felder.',[1,6],'Wie ist der Wind? Wie sind die Felder?','Der Wind ist kalt und die Felder sind leer. Im Satz heißen die Formen „kalter“ und „leeren“.','adj'),

    'Nomen, Verben und Adjektive entdecken','Mit -heit, -keit, -ung und -nis bauen','ver-, be- und er- vorne einsetzen',
    'Wörter verbinden und den Artikel finden','Von ich bis sie in der Gegenwart','Die drei Vergleichsstufen üben','Großschreibung und Hörsätze üben'
  ];
  app.innerHTML=`<section class="hero">
    <div><p class="kicker">${icon('leaf')} Deutschabenteuer für Klasse 3</p>
    <h1>Majas<br><em>Wortwerkstatt</em></h1>
    <p>Im Herbstpark warten Wortschätze auf dich. Entdecke sie mit Maja, Fuji und Minka und sammle Sterne.</p>
    <a class="primary" href="#stationen">Station aussuchen ${icon('arrow')}</a></div>
    <div class="hero-art">${intro}</div>
  </section>
  <section aria-labelledby="stationen"><div class="section-top"><div><h2 id="stationen" tabindex="-1">Deine Stationen</h2><p>Du kannst mit jeder Station beginnen.</p></div></div>
  <div class="station-grid">${units.map((u,i)=>`<a class="station ${u.tone}" href="#${u.id}">
  <div class="station-top"><span class="icon-box">${icon(u.icon)}</span><span class="number">0${i+1}</span></div>
  <h3>${u.title}</h3><p>${descriptions[i]}</p><div class="card-foot"><span>${doneFor(u.id)} / ${questions[u.id].length} geschafft</span>${icon('arrow')}</div>
  </a>`).join('')}
  <a class="station quiz sand" href="#quiz"><div class="station-top"><span class="icon-box">${icon('trophy')}</span><span class="number">FINALE</span></div><h3>Werkstatt-Quiz</h3><p>14 gemischte Aufgaben ohne Zeitdruck</p><div class="card-foot"><span>${best===null?'Zum Quiz':'Rekord '+best+' / '+mixed.length}</span>${icon('arrow')}</div></a></div></section>`;
}
function showUnit(unit){
  const items=questions[unit.id];
  const first = items.findIndex(q=>!progress.has(q.id))+1;
  const special = unit.id==='endungen' ? [['Zum Suchsel',6]] : unit.id==='herbst' ? [['Zum Hörteil',10]] : [];

  <div class="unit-head ${unit.tone}"><span class="icon-box">${icon(unit.icon)}</span><div><p class="kicker">Station ${units.indexOf(unit)+1} von ${units.length}</p><h1 tabindex="-1">${unit.title}</h1><p>${unit.place}</p></div></div>
  <section class="panel"><h2>So geht’s</h2><p>${unit.story}</p><p>${unit.rule}</p><ul class="lesson-examples">${unit.examples.map(example=>`<li>${example}</li>`).join('')}</ul>
  ${unit.id==='herbst'?`<details><summary>Vorlesevorlage für Erwachsene</summary><ol>${autumn.map(([line])=>`<li>${line}</li>`).join('')}</ol></details>`:''}
  <p class="subtle">${doneFor(unit.id)} von ${items.length} Aufgaben geschafft</p>

  ${first>1?`<a class="plain" href="${unitLink(unit.id,1)}">Bei Aufgabe 1 beginnen</a>`:''}</div></section></div>`;

function showProgress(){
  app.innerHTML=`<div class="route">${homeLink()}
    <div class="unit-head sand"><span class="icon-box">${icon('star')}</span><div><p class="kicker">Deine Sammlung</p><h1 tabindex="-1">Deine Sterne</h1><p>Du bekommst für jede erstmals richtig gelöste Stationsaufgabe einen Stern.</p></div></div>
    <section class="panel"><h2>${progress.size} von ${Object.values(questions).flat().length} Sternen</h2>
    <ul class="progress-list">${units.map(u=>`<li><a href="#${u.id}">${u.title}</a><span>${doneFor(u.id)} / ${questions[u.id].length}</span></li>`).join('')}</ul>
    <p class="subtle" style="margin-top:13px">${best===null?'Dein Quiz-Rekord erscheint nach deiner ersten Runde.':'Quiz-Rekord: '+best+' von '+mixed.length+' Punkten.'}</p></section></div>`;
}
function showQuiz(){
  app.innerHTML=`<div class="route">${homeLink()}
    <div class="unit-head sand"><span class="icon-box">${icon('trophy')}</span><div><p class="kicker">Dein Finale</p><h1 tabindex="-1">Werkstatt-Quiz</h1><p>Maja, Fuji und Minka haben Aufgaben aus allen sieben Stationen für dich gesammelt.</p></div></div>
    <section class="panel"><h2>Bereit für die Runde?</h2><p>Du löst 14 Aufgaben in deinem Tempo. Für jede richtige Antwort bekommst du einen Punkt. Die Lösungen und Erklärungen siehst du am Ende.</p><button class="primary" id="start-quiz" type="button">Quiz starten ${icon('arrow')}</button></section></div>`;
  document.querySelector('#start-quiz').onclick=()=>{quiz=[];move('#quiz/1');};
}
const escapeHtml = str=>String(str).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = text=>escapeHtml(text).replace(/«([^»]+)»/g,'<strong>$1</strong>');
const normalize = str=>str.trim().normalize('NFC').replace(/\s+/g,' ');
const shuffledTiles = tiles=>[tiles.at(-1),...tiles.slice(0,-1)];
function puzzleBoard(set){
  const alphabet='ABCDEFGHIKLMNOPRSTUVWZ';
  let seed=set.join('').length;
  const rand = limit=>{seed=(seed*1664525+1013904223)>>>0;return seed%limit;};
  const grid=Array.from({length:80},()=>alphabet[rand(alphabet.length)]);
  const places=set.map((word,i)=>{
    const row=[3,0,6,2,7,4][i];
    const start=row*10+rand(11-word.length);
    [...word.toUpperCase()].forEach((letter,n)=>{grid[start+n]=letter;});
    return {word,start,end:start+word.length-1};
  });
  return {grid,places};
}
function answerView(q){
  switch(q.type){
    case 'pick': return `<div class="options" aria-label="Antworten">${q.options.map((text,i)=>`<button type="button" class="choice" data-choice="${i}" aria-pressed="false">${escapeHtml(text)}</button>`).join('')}</div>`;
    case 'mark': return `<div class="wordset" aria-label="Wörter zum Markieren">${q.words.map((word,i)=>`<button type="button" class="word ${q.tone}" data-choice="${i}" aria-pressed="false">${escapeHtml(word)}</button>`).join('')}</div>`;
    case 'sort': return `<div class="tile-set" id="tiles" aria-label="Verfügbare Bausteine"></div>
      <div class="field">Deine Reihenfolge</div><div class="tile-set sequence" id="sequence" aria-label="Deine Reihenfolge"></div>`;
    case 'search': return `<p>Gesucht sind ${q.set.length} Nomen. Tippe zuerst ihren Anfang und dann ihr Ende an.</p>
      <div class="puzzle-grid" id="grid" aria-label="Buchstabengitter mit 8 Zeilen und 10 Spalten"></div><p class="inline-status" id="search-status" role="status"></p><div class="found-list" id="found" aria-label="Gefundene Wörter"></div>`;
    case 'write': return `<label class="field" for="answer">Deine Antwort</label>${q.long
      ? '<textarea class="answer" id="answer" rows="2" spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off"></textarea>'
      : '<input class="answer" id="answer" spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off">'}`;
  }
}
function solutionText(q){
  if(q.type==='mark')return q.answer.map(i=>q.words[i].replace(/[.,!?]+$/,'')).join(', ');
  if(q.type==='search')return q.set.join(', ');
  return q.answer;
}
function showExercise(unit,number,isQuiz){
  const list=isQuiz?mixed:questions[unit.id];
  const q=list[number-1];
  const theme=unit||unitById(q.unit);
  active={q,number,isQuiz,list,unit,chosen:new Set(),order:[],found:new Set(),start:null,checked:false};
  if(q.type==='search')active.board=puzzleBoard(q.set);
  app.innerHTML=`<div class="route"><a class="crumb" href="#${isQuiz?'quiz':unit.id}">${icon('back')} ${isQuiz?'Zum Quizstart':'Zur Stationsübersicht'}</a>
   <div class="unit-head ${isQuiz?'sand':theme.tone}"><span class="icon-box">${icon(isQuiz?'trophy':theme.icon)}</span><div><p class="kicker">${isQuiz?'Werkstatt-Quiz':'Station '+(units.indexOf(theme)+1)}</p><h1 tabindex="-1">${theme.title}</h1></div></div>
   <section class="panel"><div class="task-top"><span>Aufgabe ${number} von ${list.length}</span>${!isQuiz&&progress.has(q.id)?'<span>✓ Bereits geschafft</span>':''}</div>
   <div class="bar" role="progressbar" aria-label="Aufgabennummer" aria-valuemin="0" aria-valuemax="${list.length}" aria-valuenow="${number}"><span style="width:${100*number/list.length}%"></span></div>
   <h2>${escapeHtml(q.prompt)}</h2>${q.context?`<div class="context">${fmt(q.context)}</div>`:''}
   ${q.listen?`<div class="field-actions"><button class="secondary" type="button" data-speak="normal">${icon('audio')} Ganzer Satz</button><button class="secondary" type="button" data-speak="slow">${icon('audio')} Langsam mit Pausen</button><button class="plain" type="button" id="stop-audio">Stopp</button></div><audio id="dictation-audio" preload="metadata"></audio><p class="inline-status" id="audio-status" role="status"></p><div id="reading-alternative" hidden><button class="plain" id="toggle-reading" type="button" aria-expanded="false">Satz kurz lesen und dann schreiben</button><p class="context" id="reading" hidden>${escapeHtml(q.listen)}</p></div>`:''}
   <form id="answer-form">${answerView(q)}
   <div class="actions"><button class="primary" id="check" type="submit">${isQuiz?'Antwort abgeben':'Prüfen'}</button>
   ${isQuiz?'':`<button class="secondary" id="help" type="button" aria-expanded="false">${icon('bulb')} Tipp</button><button class="plain" id="reveal" type="button">Lösung zeigen</button>`}</div></form>
   ${isQuiz?'':`<div class="tip" id="tip" hidden><p>${escapeHtml(q.hint)}</p></div>`}
   <div id="feedback" role="status" aria-atomic="true"></div>
   <div class="actions" id="after">
   ${!isQuiz&&number>1?`<a class="plain" href="${unitLink(unit.id,number-1)}">${icon('back')} Zurück</a>`:''}
   ${!isQuiz&&number<list.length?`<a class="plain" id="skip-task" href="${unitLink(unit.id,number+1)}">Überspringen</a>`:''}
   <button class="primary" type="button" id="next" hidden>${isQuiz&&number===list.length?'Zum Ergebnis':number===list.length?'Station beenden':'Nächste Aufgabe'} ${icon('arrow')}</button>
   </div></section></div>`;

  document.querySelector('#answer-form').onsubmit=event=>{event.preventDefault();checkAnswer();};
  document.querySelector('#next').onclick=()=>nextQuestion();
  if(!isQuiz){
    document.querySelector('#help').onclick=()=>{
      const tip=document.querySelector('#tip');
      tip.hidden=!tip.hidden;
      document.querySelector('#help').setAttribute('aria-expanded',String(!tip.hidden));
    };
    document.querySelector('#reveal').onclick=()=>showFeedback('Hier ist die Lösung.',false,true);
  }
  app.querySelectorAll('[data-choice]').forEach(button=>button.onclick=()=>{
    if(active.checked)return;
    const index=Number(button.dataset.choice);
    if(q.type==='pick')active.chosen=new Set([index]);
    else if(active.chosen.has(index))active.chosen.delete(index);
    else active.chosen.add(index);
    app.querySelectorAll('[data-choice]').forEach(control=>control.setAttribute('aria-pressed',String(active.chosen.has(Number(control.dataset.choice)))));
  });
  if(q.type==='sort')drawTiles();
  if(q.type==='search')drawPuzzle();
  if(q.listen)setupAudio(q);
}
function drawTiles(focus){
  const {q,order,checked}=active;
  const open=shuffledTiles(q.tiles).filter(tile=>!order.includes(tile));
  const button=(tile,action)=>`<button type="button" class="tile" data-tile="${escapeHtml(tile)}" aria-label="${escapeHtml(tile+' '+action)}" ${checked?'disabled':''}>${escapeHtml(tile)}</button>`;
  document.querySelector('#tiles').innerHTML=open.map(t=>button(t,'hinzufügen')).join('');
  document.querySelector('#sequence').innerHTML=order.length?order.map(t=>button(t,'entfernen')).join(''):'<span class="subtle">Tippe die Karten der Reihe nach an.</span>';
  app.querySelectorAll('[data-tile]').forEach(b=>b.onclick=()=>{
    const tile=b.dataset.tile;
    if(order.includes(tile))order.splice(order.indexOf(tile),1);
    else order.push(tile);
    drawTiles(tile);
  });
  if(focus)Array.from(app.querySelectorAll('[data-tile]')).find(b=>b.dataset.tile===focus)?.focus();
}
function drawPuzzle(){
  const {board}=active;
  document.querySelector('#grid').innerHTML=board.grid.map((letter,index)=>`<button type="button" class="cell" data-cell="${index}" aria-label="${letter}, Zeile ${Math.floor(index/10)+1}, Spalte ${index%10+1}">${letter}</button>`).join('');
  app.querySelectorAll('[data-cell]').forEach(button=>button.onclick=()=>{
    const index=Number(button.dataset.cell);
    const status=document.querySelector('#search-status');
    if(active.start===null){active.start=index;status.textContent='Tippe jetzt auf den letzten Buchstaben.';}
    else {
      const left=Math.min(active.start,index);
      const right=Math.max(active.start,index);
      const match=board.places.find(p=>p.start===left&&p.end===right);
      if(match){
        active.found.add(match.word);
        status.textContent=`${match.word}! ${active.found.size} von ${board.places.length} gefunden.`;
      } else status.textContent='Probiere es noch einmal. Jedes gesuchte Wort steht in einer Zeile.';
      active.start=null;
    }
    updatePuzzle();
  });
  updatePuzzle();
}
function updatePuzzle(){
  const {board,q,found,start}=active;
  const positions=board.places.filter(p=>found.has(p.word));
  app.querySelectorAll('[data-cell]').forEach(button=>{
    const n=Number(button.dataset.cell);
    button.dataset.state=n===start?'start':positions.some(p=>p.start<=n&&n<=p.end)?'found':'';
  });
  document.querySelector('#found').innerHTML=[...found].map(word=>{
    const suffix=endings.find(e=>word.endsWith(e.slice(1))).slice(1);
    return `<span>${word.slice(0,-suffix.length)}<mark>${suffix}</mark></span>`;
  }).join('');
  document.querySelector('#check').disabled=found.size!==q.set.length;
}
function setupAudio(q){
  const status=document.querySelector('#audio-status');
  const audio=document.querySelector('#dictation-audio');
  const tracks=dictationAudio[q.audio];
  let currentMode;
  const fallback=()=>{
    status.textContent='Die Audiodatei lässt sich gerade nicht abspielen.';
    document.querySelector('#reading-alternative').hidden=false;
  };
  audio.onplaying=()=>{status.textContent='Der Satz wird vorgelesen …';};
  audio.onended=()=>{status.textContent='';};
  audio.onerror=fallback;
  document.querySelector('#stop-audio').onclick=()=>{
    audio.pause();
    audio.currentTime=0;
    status.textContent='';
  };
  document.querySelector('#toggle-reading').onclick=event=>{
    const reading=document.querySelector('#reading');
    reading.hidden=!reading.hidden;
    event.currentTarget.textContent=reading.hidden?'Satz kurz lesen und dann schreiben':'Satz wieder verdecken';
    event.currentTarget.setAttribute('aria-expanded',String(!reading.hidden));
  };
  app.querySelectorAll('[data-speak]').forEach(button=>button.onclick=()=>{
    const mode=button.dataset.speak;
    if(mode!==currentMode){
      currentMode=mode;
      audio.src=tracks[mode];
    } else {
      audio.currentTime=0;
    }
    audio.playbackRate=mode==='normal'?.9:1;
    audio.play().catch(error=>{
      if(error.name!=='AbortError'&&active?.q===q)fallback();
    });
  });
}
function checkAnswer(){
  if(!active||active.checked)return;
  const {q,chosen,order,found}=active;
  const field=document.querySelector('#answer');
  let given;
  let correct;
  switch(q.type){
    case 'write':
      given=normalize(field.value);
      correct=[q.answer,...(q.also||[])].includes(given);
      break;
    case 'pick':
      given=q.options[[...chosen][0]]||'';
      correct=given===q.answer;
      break;
    case 'mark':
      given=[...chosen].sort((a,b)=>a-b).map(i=>q.words[i]).join(', ');
      correct=chosen.size===q.answer.length&&q.answer.every(i=>chosen.has(i));
      break;
    case 'sort':
      given=order.join(' → ');
      correct=given===q.answer;
      break;
    case 'search':
      given=[...found].join(', ');
      correct=found.size===q.set.length;
      break;
  }
  const feedback=document.querySelector('#feedback');
  if(!given){
    feedback.className='feedback';
    feedback.textContent='Gib zuerst eine Antwort ein.';
    if(field)field.focus();
    return;
  }
  if(active.isQuiz){
    active.checked=true;
    quiz.push({q,given,correct});
    nextQuestion();
    return;
  }
  if(correct){
    const hadStar=progress.has(q.id);
    progress.add(q.id);
    persist();
    syncStars();
    showFeedback(hadStar?'Richtig gelöst!':'Richtig! Du bekommst einen Stern.',true,true);
  } else {
    const caseOnly=q.type==='write'&&given.toLocaleLowerCase('de-DE')===q.answer.toLocaleLowerCase('de-DE');
    const articleMissing=q.type==='write'&&/^(der|die|das) /.test(q.answer)&&given===q.answer.split(' ').slice(1).join(' ');
    const periodMissing=q.listen&&given+'.'===q.answer;
    const message=caseOnly?'Fast richtig. Prüfe die Groß- und Kleinschreibung.':articleMissing?'Das Nomen stimmt. Ergänze noch den Artikel.':periodMissing?'Fast richtig. Am Ende fehlt der Punkt.':'Versuche es noch einmal. Der Tipp kann dir helfen.';
    showFeedback(message,false,false);
  }
}
function showFeedback(message,correct,withSolution){
  const {q}=active;
  const feedback=document.querySelector('#feedback');
  feedback.className='feedback'+(correct?' good':'');
  feedback.innerHTML=`<strong>${escapeHtml(message)}</strong>${withSolution?`<p><b>${q.also?'Eine richtige Form':'Lösung'}</b> · ${escapeHtml(solutionText(q))}</p><p>${escapeHtml(q.why)}</p>`:''}`;
  if(withSolution){
    const next=document.querySelector('#next');
    next.hidden=false;
    const skip=document.querySelector('#skip-task');
    if(skip)skip.hidden=true;
    if(correct){
      active.checked=true;
      document.querySelectorAll('#answer-form input,#answer-form textarea,#answer-form button').forEach(control=>{control.disabled=true;});
      next.focus();
    }
  }
}
function nextQuestion(){
  const {number,list,isQuiz,unit}=active;
  if(isQuiz){
    move(number<list.length?'#quiz/'+(number+1):'#quiz/ergebnis');
  } else if(number<list.length){
    move(unitLink(unit.id,number+1));
  } else {
    move('#'+unit.id+'/fertig');
  }
}
function showEnd(unit){
  const count=doneFor(unit.id);
  app.innerHTML=`<div class="route">${homeLink()}<section class="panel"><p class="kicker">${icon('star')} ${unit.title}</p><h1 tabindex="-1">Ende der Station</h1>
  <p>Du hast ${count} von ${questions[unit.id].length} Aufgaben dieser Station richtig gelöst.</p>
  <div class="actions"><a class="primary" href="#start">Zur Stationenkarte ${icon('arrow')}</a><a class="secondary" href="#${unit.id}">Station wiederholen</a></div></section></div>`;
}
function showResult(){
  const correct=quiz.filter(result=>result.correct).length;
  best=best===null?correct:Math.max(best,correct);
  persist();
  app.innerHTML=`<div class="route">${homeLink()}
   <div class="unit-head sand"><span class="icon-box">${icon('trophy')}</span><div><p class="kicker">Werkstatt-Quiz</p><h1 tabindex="-1">${correct} von ${mixed.length} Punkten</h1><p>${correct===mixed.length?'Du hast alle Aufgaben richtig gelöst!':'Hier kannst du deine Antworten mit den Lösungen vergleichen.'}</p></div></div>
   <section class="panel"><h2>Deine Antworten und die Lösungen</h2><ol class="review-list">
   ${quiz.map(({q,given,correct:ok})=>`<li><strong>${ok?'✓ Richtig':'Noch üben'} · ${unitById(q.unit).title}</strong><br>${escapeHtml(q.prompt)} ${q.context?fmt(q.context):''}<br>
   Deine Antwort · ${escapeHtml(given)}<br>Lösung · ${escapeHtml(solutionText(q))}<br>${escapeHtml(q.why)}</li>`).join('')}</ol>
   <div class="actions"><a class="primary" href="#quiz">Neue Runde</a><a class="secondary" href="#start">Zur Stationenkarte</a></div></section></div>`;
}
function render(initial=false){
  document.querySelector('#dictation-audio')?.pause();
  active=null;
  syncStars();
  const [page,index]=location.hash.slice(1).split('/');
  const unit=unitById(page);
  const number=Number(index);
  const oldRoute=route;
  route=page||'start';
  if(page==='fortschritt')showProgress();
  else if(page==='quiz'){
    if(index==='ergebnis'&&quiz.length===mixed.length)showResult();
    else if(index&&Number.isInteger(number)&&number===quiz.length+1&&number<=mixed.length)showExercise(null,number,true);
    else showQuiz();
  } else if(unit){
    if(index==='fertig')showEnd(unit);
    else if(Number.isInteger(number)&&number>0&&number<=questions[unit.id].length)showExercise(unit,number,false);
    else showUnit(unit);
  } else {
    if(oldRoute!=='start'&&oldRoute!=='stationen'||!app.querySelector('.hero'))showHome();
    if(page==='stationen'){
      const target=document.querySelector('#stationen');
      target.focus({preventScroll:true});
      target.scrollIntoView({block:'start'});
      return;
    }
  }
  if(!initial){
    window.scrollTo(0,0);
    const heading=app.querySelector('h1');
    heading.setAttribute('tabindex','-1');
    heading.focus({preventScroll:true});
  }
}
document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
document.querySelector('#show-progress').onclick=()=>move('#fortschritt');
window.addEventListener('hashchange',()=>{if(location.hash!=='#inhalt')render();});
render(true);
</script>
