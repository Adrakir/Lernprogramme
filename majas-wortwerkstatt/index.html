<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Majas Wortwerkstatt. Sieben Deutschstationen für die 3. Klasse mit Fuji und Minka.">
<meta name="theme-color" content="#fcfaf3">
<title>Majas Wortwerkstatt · Deutsch Klasse 3</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%23185b4a'/%3E%3Cpath d='M24 34V16m0 1c-5-4-12-5-16-3v18c6-2 11-1 16 3 5-4 10-5 16-3V14c-4-2-11-1-16 3Z' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>:root {
  color-scheme:light;
  --ink:#203741;--muted:#51636a;--forest:#185b4a;--deep:#124637;--line:#deded2;--paper:#fcfaf3;
  --mint:#dbf1e7;--lilac:#eee3f8;--peach:#f9e1d3;--sand:#f8e9bb;--sky:#dcecf8;--rose:#f6e1e9;
  font-family:"Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);line-height:1.55}
[hidden]{display:none!important}
a{color:var(--forest);text-underline-offset:4px}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid #205d9e;outline-offset:4px}
.shell{width:min(1120px,calc(100% - 48px));margin-inline:auto}
.skip{position:fixed;top:-100px;left:12px;background:white;padding:12px;z-index:3}
.skip:focus{top:8px}
.top{border-bottom:1px solid #e5e5d9;background:#fffdf7}
.top-inner{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:inline-flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);line-height:1.25}
.brand strong{font-size:17px;display:block}
.brand small{color:var(--muted);font-size:13px}
.brand-symbol,.icon-box{display:grid;place-items:center;width:45px;height:45px;border-radius:14px;flex:none}
.brand-symbol{background:var(--forest);color:white}
svg.ico{width:22px;height:22px;vertical-align:middle;flex:none}
.star-button{border:1px solid #e9d797;border-radius:100px;background:#fff6d9;color:#5a4618;min-height:44px;padding:6px 13px;display:flex;align-items:center;gap:7px;font-weight:800;white-space:nowrap}
.star-button svg{fill:#ffd274;width:20px}
.hero{margin-top:32px;border:1px solid #c6dfd0;border-radius:30px;background:#eaf5ee;display:grid;grid-template-columns:1fr 1.04fr;align-items:center;min-height:358px;overflow:hidden;padding:31px 26px 31px 42px}
.kicker{font-size:12px;font-weight:850;letter-spacing:.11em;text-transform:uppercase;display:flex;align-items:center;gap:8px;color:var(--forest);margin:0 0 11px}
.kicker svg{width:17px;height:17px}
h1,h2,h3,p{margin-top:0}
h1,h2,h3{line-height:1.12;letter-spacing:-.025em}
.hero h1{font-size:clamp(41px,5.4vw,68px);margin-bottom:14px;line-height:.99;letter-spacing:-.06em}
.hero h1 em{font-style:normal;color:var(--forest)}
.hero p:not(.kicker){font-size:17px;max-width:37ch;margin-bottom:22px}
.hero-art svg{width:100%;height:auto;display:block}
.primary,.secondary,.plain{min-height:46px;padding:10px 16px;border-radius:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;line-height:1.2}
.primary{background:var(--forest);border:1px solid var(--forest);color:white;box-shadow:0 3px 0 #103f32}
.primary:hover{background:var(--deep)}
.secondary{background:#fffef9;color:var(--ink);border:1px solid #cbd4cb}
.secondary:hover,.plain:hover{background:#e8f4ee}
.plain{background:transparent;border:1px solid transparent;color:var(--forest);padding-inline:9px}
.primary:disabled,.secondary:disabled{opacity:.52}
.section-top{margin:35px 0 16px;display:flex;justify-content:space-between;align-items:end;gap:14px}
.section-top h2{font-size:clamp(27px,3vw,36px);margin:0 0 4px}
.section-top p,.subtle{color:var(--muted);margin-bottom:0}
.station-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.station{background:#fffefa;border:1px solid var(--line);border-radius:18px;padding:17px;display:flex;flex-direction:column;text-decoration:none;color:var(--ink);min-height:173px;transition:transform .15s,border-color .15s}
.station:hover{transform:translateY(-3px);border-color:#699c89}
.station-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:13px}
.icon-box{background:var(--tint,var(--mint));color:#284c49}
.mint{--tint:var(--mint)}.lilac{--tint:var(--lilac)}.peach{--tint:var(--peach)}.sand{--tint:var(--sand)}.sky{--tint:var(--sky)}.rose{--tint:var(--rose)}
.number{font-size:12px;font-weight:850;letter-spacing:.07em;color:#50646a}
.station h3{font-size:19px;margin:0 0 5px}
.station p{font-size:14px;color:var(--muted);margin:0 0 12px;line-height:1.3}
.station .card-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;color:var(--forest);font-weight:800;font-size:13px}
.card-foot svg{width:18px;height:18px}
.station.quiz{background:#fff3d5;border-color:#ead6a4}
.footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 16px;border-top:1px solid var(--line);padding:16px 0 22px;margin-top:32px;color:var(--muted);font-size:13px}
.route{width:min(820px,100%);margin-inline:auto;padding-top:22px}
.crumb{display:inline-flex;gap:8px;align-items:center;min-height:44px;font-size:14px;font-weight:850;text-decoration:none;margin-bottom:10px}
.crumb svg{width:17px}
.unit-head{padding:24px 27px;border-radius:22px;background:var(--tint,var(--mint));display:flex;gap:16px;align-items:flex-start;margin-bottom:17px}
.unit-head .icon-box{background:#fffdf5}
.unit-head>div{min-width:0}
.unit-head h1{font-size:clamp(31px,6vw,46px);margin:0 0 8px;hyphens:auto;overflow-wrap:anywhere}
.unit-head p:last-child{margin-bottom:0}
.unit-head .kicker{margin-bottom:7px}
.panel{background:#fffefa;border:1px solid var(--line);border-radius:20px;padding:clamp(17px,4vw,29px);margin-bottom:15px}
.panel h2{font-size:clamp(24px,4.5vw,33px);margin-bottom:13px}
.panel h3{margin-bottom:9px}
.lesson-examples{list-style:none;padding:0;margin:16px 0;display:grid;gap:6px}
.lesson-examples li{background:#edf5ee;border-left:4px solid #5b9d85;padding:7px 10px;border-radius:6px;font-weight:700}
.actions,.field-actions{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:15px}
.task-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:14px;font-weight:800;color:var(--muted)}
.bar{height:8px;background:#e6e9e0;border-radius:20px;overflow:hidden;margin-bottom:22px}
.bar span{background:#42927c;display:block;height:100%;border-radius:20px}
.context{padding:13px 15px;border-radius:12px;background:#edf5ee;font-size:clamp(18px,4vw,23px);font-weight:750;line-height:1.45;margin-bottom:16px}
.context strong{background:#ffe3a0;padding:1px 4px;border-radius:4px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.choice,.word,.tile{min-height:48px;padding:8px 12px;border:1px solid #cbd4cb;background:#fff;color:var(--ink);font-weight:750;border-radius:11px}
.choice:hover,.word:hover,.tile:hover{border-color:var(--forest);background:#eef7f0}
.choice[aria-pressed=true],.word[aria-pressed=true]{background:#d2ebdf;border-color:#236753;box-shadow:inset 0 0 0 1px #236753}
.word.noun[aria-pressed=true]{background:#d8ebff;border-color:#22619b;box-shadow:inset 0 0 0 1px #22619b}
.word.verb[aria-pressed=true]{background:#fbdedb;border-color:#a84e46;box-shadow:inset 0 0 0 1px #a84e46}
.word.adj[aria-pressed=true]{background:#d6ecd3;border-color:#3d7141;box-shadow:inset 0 0 0 1px #3d7141}
.wordset,.tile-set{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.sequence{background:#eff3eb;border-radius:12px;padding:9px;min-height:67px;border:1px dashed #a4b8ab;margin:8px 0 12px;align-items:center}
.sequence .tile{background:#d9eee3;border-color:#92baa8}
.field{display:block;font-weight:800;margin-top:11px}
input.answer,textarea.answer{width:100%;background:white;color:var(--ink);border:1.5px solid #acbdb3;border-radius:11px;padding:10px 12px;margin-top:5px;min-height:51px;font-size:18px;resize:vertical}
.feedback,.tip{padding:12px 15px;margin-top:14px;border-radius:11px;background:#fff3d5;border:1px solid #e1ca88}
.feedback.good{background:#e4f4e9;border-color:#a3cdb3}
.feedback p:last-child,.tip p:last-child{margin-bottom:0}
.feedback strong{display:block;margin-bottom:3px}
.inline-status{min-height:1.5em;margin:6px 0 0;color:var(--muted)}
.puzzle-grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));width:min(100%,480px);gap:3px}
.cell{padding:0;min-width:0;min-height:32px;aspect-ratio:1;border:1px solid #cbd4cb;background:#fff;color:var(--ink);font-size:clamp(13px,3vw,17px);font-weight:800;border-radius:5px}
.cell[data-state=start]{background:#ffdf85;border-color:#9d7524}
.cell[data-state=found]{background:#cfe9d8;border-color:#659e7b}
.found-list{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.found-list span{background:#e8f3e9;padding:3px 8px;border-radius:7px}
mark{background:#ffe5a7;color:#3f351f;border-radius:3px;padding:0 2px}
.review-list{padding-left:23px}
.review-list li{padding:8px 0;border-bottom:1px solid var(--line)}
.progress-list{list-style:none;padding:0;margin:0}
.progress-list li{border-bottom:1px solid var(--line);padding:10px 0;display:flex;justify-content:space-between;gap:12px}
@media(max-width:850px){.station-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{padding-left:28px;min-height:290px}}
@media(max-width:620px){.shell{width:calc(100% - 28px)}.top-inner{min-height:65px}.brand-symbol{width:37px;height:37px;border-radius:10px}.brand{gap:8px}.brand strong{font-size:15px}.hero{grid-template-columns:1fr;margin-top:18px;padding:21px 18px 5px;border-radius:22px}.hero-art{max-width:440px;width:100%;margin-inline:auto}.hero p:not(.kicker){font-size:16px;margin-bottom:15px}.station-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.station{padding:12px;min-height:159px}.station h3{font-size:17px}.station p{font-size:13px}.section-top{margin-top:23px}.unit-head{padding:17px 14px;gap:10px}.unit-head .icon-box{width:38px;height:38px}}
@media(max-width:375px){.options{grid-template-columns:1fr}.brand strong{font-size:14px}.star-button{padding-inline:8px;font-size:14px}.panel{padding:13px}.cell{min-height:27px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
details{margin:0 0 14px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fcfaf3}
summary{cursor:pointer;font-weight:800;color:var(--forest)}
details ol{margin-bottom:0}
@media(max-width:620px){.hero h1{font-size:clamp(32px,10vw,50px)}}
.lesson-demo{margin:18px 0;padding:0;border:1px solid #bfd8cb;border-radius:16px;background:#f4faf5}
.lesson-demo>summary{display:flex;min-height:63px;align-items:center;gap:12px;padding:10px 13px;list-style:none;border-radius:15px}
.lesson-demo>summary::-webkit-details-marker{display:none}
.lesson-demo>summary::after{content:"";width:8px;height:8px;border-right:2px solid;border-bottom:2px solid;transform:rotate(45deg);margin:0 5px 4px auto;flex:none}
.lesson-demo[open]>summary::after{transform:rotate(225deg);margin-bottom:0}
.lesson-demo>summary:hover{background:#eaf5ed}
.lesson-demo>summary strong,.lesson-demo>summary small{display:block}
.lesson-demo>summary small{font-size:13px;line-height:1.35;font-weight:500;color:var(--muted)}
.demo-summary-icon{display:grid;place-items:center;flex:none;width:39px;height:39px;border-radius:13px;background:#dcefe3}
.demo-body{padding:15px;border-top:1px solid #d6e7dc}
.demo-body h3{font-size:clamp(20px,3.6vw,25px);margin-bottom:12px}
.demo-stage{display:flex;align-items:center;gap:13px;flex-wrap:wrap;min-height:96px;padding:13px;border:1px solid #e2dfcf;border-radius:13px;background:#fffdf4}
.demo-art{flex:none;width:58px;height:58px}
.demo-example{min-width:0;flex:1 1 200px}
.demo-label{display:block;font-size:12px;font-weight:850;letter-spacing:.07em;text-transform:uppercase;color:#4d6c64;margin-bottom:5px}
.demo-view{display:flex;flex-wrap:wrap;align-items:center;column-gap:8px;row-gap:5px;font-weight:800;font-size:clamp(17px,3vw,24px);line-height:1.3}
.demo-view mark{padding:0 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.demo-view mark.noun{background:#d8ebff;color:#204875}
.demo-view mark.verb{background:#fbdedb;color:#713a36}
.demo-view mark.adj{background:#d6ecd3;color:#355f38}
.demo-tile{display:inline-flex;flex-direction:column;justify-content:center;min-height:61px;padding:6px 10px;border:1px solid #bad2c5;border-radius:10px;background:#f3f8f4}
.demo-tile.suffix{background:#f0e8f8;border-color:#d0bce2}
.demo-tile.result{background:#e1f3e7;border-color:#a9ceb7}
.demo-tile small{font-size:12px;font-weight:650;letter-spacing:0;color:#465e5c;margin-top:3px}
.demo-sign{color:#537267;font-weight:850}
.demo-note{margin:10px 0 0;min-height:3.1em;font-size:15px}
.demo-controls{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:10px}
.demo-controls button{gap:5px;padding:9px 10px;white-space:nowrap}
.demo-controls svg{width:17px;height:17px}
.demo-progress{font-size:13px;white-space:nowrap;font-weight:800;color:#4d6c64}
.demo-chain{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%;gap:6px}
.demo-chain-card{display:grid;justify-items:center;gap:3px;padding:6px 3px;border:2px dashed #c7ccc2;border-radius:10px;background:#fffefa;font-size:clamp(11px,2.5vw,15px)}
.demo-chain-card.is-current{border-style:solid;border-color:#6eab95;background:#e5f3e9}
.demo-chain-card .demo-art{width:42px;height:42px}
.demo-kites{display:block;width:min(100%,390px);height:auto;margin-inline:auto}
.demo-kites+.demo-example{flex-basis:100%}
.demo-enter{animation:demo-in .24s ease-out both}
.demo-enter .demo-kite-lift{animation:kite-up .5s ease-out both}
@keyframes demo-in{from{opacity:.45;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
@keyframes kite-up{from{transform:translateY(16px)}to{transform:translateY(0)}}
@media(max-width:450px){
  .demo-body{padding:11px}
  .demo-stage{gap:8px;padding:10px}
  .demo-stage>.demo-art{width:40px;height:40px}
  .demo-example{flex-basis:145px}
  .demo-note{min-height:0}
  .demo-controls button{font-size:13px;padding-inline:7px}
}
@media(prefers-reduced-motion:reduce){.demo-enter,.demo-enter .demo-kite-lift{animation:none}}
.hero-actions{margin-top:0}
.games-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.game-card{min-height:218px}
.game-card h2{font-size:21px;margin:4px 0 7px;overflow-wrap:anywhere}
.game-illustration{display:grid;place-items:center;width:70px;height:70px;margin-bottom:10px;border-radius:18px;background:var(--tint)}
.game-illustration .demo-art{width:51px;height:51px}
.game-counter{color:var(--forest);font-size:14px;font-weight:850;margin-bottom:8px}
.game-word-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.game-catch-card{min-height:63px;background:#fffdf3;border-color:#d9d8c6;font-size:clamp(15px,3vw,20px);overflow-wrap:anywhere}
.game-catch-card[aria-pressed=true]::after{content:" ✓";color:var(--deep)}
.game-message{padding:10px 12px;border-left:4px solid #64a18c;border-radius:6px;background:#edf5ee;color:#25493f;margin:14px 0;min-height:44px}
.memory-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.memory-card{width:100%;min-width:0;min-height:80px;padding:5px 3px;border:1px solid #b8cab9;border-radius:12px;background:#e5f2e9;color:#24584d;font-weight:850;font-size:clamp(13px,2.6vw,17px);line-height:1.18;overflow-wrap:anywhere}
.memory-card>span{display:grid;justify-items:center;gap:3px}
.memory-card small{font-size:11px}
.memory-card .ico{width:24px;height:24px}
.memory-card:not(:disabled):hover{border-color:#518e7c;box-shadow:inset 0 0 0 1px #518e7c}
.memory-card.is-open{background:#fff9df;border-color:#e0c477;color:#513e1d}
.memory-card.is-matched{background:#eae3f6;border-color:#c1a9dd;color:#523969}
.game-finish>.ico{width:43px;height:43px;padding:8px;border-radius:13px;background:#f8e9bb;color:#69521d;margin-bottom:10px}
.game-panel .field{margin-bottom:5px}
.game-panel .sequence{margin-top:0}
.game-panel .tile:disabled{opacity:1}
@media(max-width:620px){.games-grid{grid-template-columns:1fr}.game-card{min-height:0}}
@media(max-width:440px){.game-word-grid,.memory-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.memory-card{min-height:69px}.game-catch-card{padding-inline:4px}}
.anna-hero{display:grid;grid-template-columns:1.3fr 1fr;align-items:center;gap:14px;padding:clamp(16px,4vw,29px);margin-bottom:17px;border:1px solid #d6dbc5;border-radius:23px;background:#f0f3df}
.anna-hero h1{font-size:clamp(30px,5.5vw,47px);margin-bottom:10px;hyphens:auto;overflow-wrap:anywhere}
.anna-hero p:last-child{margin:0;max-width:48ch}
.anna-art svg{display:block;width:100%;height:auto;max-height:250px}
.anna-today{background:#fff8e2;border-color:#ead9a3}
.anna-today h2{margin-bottom:9px}
.anna-today p:not(.kicker){max-width:58ch}
.anna-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 13px;padding-left:24px;margin:0}
.anna-list li::marker{color:var(--muted);font-size:13px;font-weight:800}
.anna-list a{min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:8px;background:#f1f6ed;color:var(--forest);text-decoration:none;font-weight:800;line-height:1.28}
.anna-list a:hover{background:#e4f0e5}
.anna-list svg{width:16px;height:16px}
.anna-route{width:min(740px,100%)}
.anna-story h1{font-size:clamp(31px,6vw,47px);margin:8px 0 19px;hyphens:auto;overflow-wrap:anywhere}
.anna-text{max-width:65ch;font-size:clamp(17px,3vw,20px);line-height:1.72}
.anna-text p{margin-bottom:1em}
.anna-question{margin-top:23px;padding:13px 15px;border:1px solid #d1e4d5;border-radius:13px;background:#f1f7ee}
.anna-question h2{font-size:21px;margin-bottom:6px}
.anna-question p{margin-bottom:10px}
.anna-question details{margin:0}
.anna-question details p{margin:8px 0 0}
@media(max-width:570px){
 .anna-hero{grid-template-columns:1fr}
 .anna-art{max-width:245px;width:100%;margin-inline:auto}
 .anna-list{grid-template-columns:1fr}
}
.anna-scene{display:block;width:100%;height:auto}
.anna-today{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:center}
.anna-today>*{min-width:0}
.anna-today-picture,.anna-story-picture{overflow:hidden;border:1px solid #dedac5;border-radius:14px;background:#f4ebd5}
.anna-story-picture{margin:0 0 18px}
.anna-moment{margin:18px 0 22px}
.anna-moment figcaption{padding:10px 14px;background:#fff8e9;color:#354f48;font-size:clamp(14px,2.6vw,17px);line-height:1.45}
.anna-thumb{display:block;width:54px;flex:none;overflow:hidden;border-radius:7px}
.anna-list-title{flex:1;overflow-wrap:anywhere}
.anna-list .anna-thumb .anna-scene{width:100%;height:auto}
@media(max-width:620px){
 .anna-today{grid-template-columns:1fr;gap:14px}
 .anna-today-picture{grid-row:1}
}
.anna-extra-grid,.anna-image-choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.anna-extra-grid .station{min-height:0}
.anna-extra-grid h3{margin-top:10px}
.anna-listen,.anna-retell{padding:13px 15px;margin:0 0 18px;border:1px solid #cadfce;border-radius:13px;background:#f0f7ee}
.anna-listen h2,.anna-retell h2{font-size:22px;margin:0 0 7px}
.anna-listen p,.anna-retell p{margin:0 0 9px}

<script>const units = [
  {id:'wortarten', title:'Wortarten', icon:'book', tone:'mint', place:'Fuji sortiert Tierwörter', story:'Fuji schnuppert an drei Kisten. Auf jeder steht eine andere Wortart. Kannst du ihm beim Sortieren helfen?', rule:'Nomen (Namenwörter) schreibt man groß. Oft passen ein Artikel und eine Mehrzahl dazu. Verben (Tunwörter) kannst du verändern. Adjektive (Wiewörter) beschreiben, wie etwas ist.', examples:['der Hund → die Hunde','spielen → ich spiele, du spielst','Minka ist weich. → Wie ist Minka?']},
  {id:'endungen', title:'Nomen-Endungen', icon:'puzzle', tone:'lilac', place:'Minka baut neue Wörter', story:'Minka schiebt Wortkarten über den Tisch. Mit den passenden Endungen werden daraus Nomen.', rule:'Mit den Nachsilben -heit, -keit, -ung, -nis und -schaft kannst du Nomen erkennen. In diesen Übungen entstehen Nomen mit -heit und -keit aus Adjektiven und Nomen mit -ung aus Verben. Bei -nis kann ein Adjektiv oder ein Verb dazugehören. -schaft kann zum Beispiel aus einem Nomen ein neues Nomen bilden. Prüfe den Artikel und schreibe das Nomen groß.', examples:['wahr → die Wahrheit','freundlich → die Freundlichkeit','retten → die Rettung','geheim → das Geheimnis','der Freund → die Freundschaft']},
  {id:'vorsilben', title:'Vorsilben', icon:'flag', tone:'peach', place:'Maja setzt Bausteine davor', story:'Maja hat Karten mit ver-, be- und er- gefunden. Probiere aus, wie sich Wörter dadurch verändern.', rule:'Eine Vorsilbe steht vor dem Wortstamm. Sie kann die Bedeutung ändern. Bei ver-, be- und er- bleibt der Baustein auch im Satz am Verb.', examples:['ver- + laufen → verlaufen','be- + zahlen → bezahlen','er- + zählen → erzählen']},
  {id:'wortketten', title:'Zusammengesetzte Nomen', icon:'link', tone:'sand', place:'Fuji folgt der Wörterkette', story:'Eine Spur führt vom Garten bis zum Schlüssel. Das mittlere Wort verbindet zwei neue Nomen.', rule:'Zwei Nomen können ein neues Wort bilden. Du schreibst es zusammen und am Anfang groß. Das letzte Nomen bestimmt den Artikel. In einer Wortkette ist der mittlere Baustein einmal hinten und einmal vorne.', examples:['der Garten + die Tür → die Gartentür','die Tür + der Schlüssel → der Türschlüssel','die Katze + das Futter → das Katzenfutter']},
  {id:'verben', title:'Verben verändern', icon:'paw', tone:'sky', place:'Fuji wechselt die Person', story:'Fuji bellt. Maja sagt: „Ich spiele mit dir.“ Je nachdem, wer etwas tut, verändert sich das Verb.', rule:'Die Grundform heißt zum Beispiel spielen. Im Präsens (Gegenwart) passt du das Verb an die Person an. Bei manchen Verben ändert sich auch ein Buchstabe im Wortstamm.', examples:['ich spiele · du spielst · er/sie/es spielt','wir spielen · ihr spielt · sie spielen','ich falle → du fällst → er fällt']},
  {id:'steigern', title:'Adjektive steigern', icon:'mountain', tone:'rose', place:'Minka vergleicht drei Drachen', story:'Fuji lässt einen Drachen steigen. Majas Drachen fliegt höher, und Minkas Drachen fliegt am höchsten!', rule:'Die drei Vergleichsstufen heißen Grundstufe, 1. Vergleichsstufe und 2. Vergleichsstufe. Oft brauchst du -er und am …-sten oder am …-esten. Manchmal ändern sich Buchstaben oder sogar das ganze Wort.', examples:['schnell → schneller → am schnellsten','kalt → kälter → am kältesten','gut → besser → am besten']},
  {id:'herbst', title:'Herbstdiktat', icon:'leaf', tone:'peach', place:'Maja hört den Herbst', story:'Im Herbstpark übt Maja mit Fuji und Minka für das Diktat. Erst entdeckt ihr Großbuchstaben, dann hört ihr genau hin.', rule:'Am Satzanfang schreibst du groß. Auch Nomen und Namen beginnen groß. Achte am Ende auf das Satzzeichen. Höre zuerst den ganzen Satz. Zum Mitschreiben kannst du ihn danach langsam mit einer Pause in der Mitte abspielen.', examples:['Im Park raschelt das Laub.','die Kastanie · der Drachen · das Laub']}
];

  write('Schreibe die Mehrzahl mit dem Artikel.','der Vogel','die Vögel','In der Mehrzahl verändert sich das o.','Ein Vogel, viele Vögel. Der Artikel in der Mehrzahl lautet die.')

const families = [
 ['wahr','die Wahrheit'],['klug','die Klugheit'],['frei','die Freiheit'],['gesund','die Gesundheit'],['schön','die Schönheit'],['faul','die Faulheit'],['dunkel','die Dunkelheit'],['dumm','die Dummheit'],
 ['freundlich','die Freundlichkeit'],['flüssig','die Flüssigkeit'],['ehrlich','die Ehrlichkeit'],['tapfer','die Tapferkeit'],['fröhlich','die Fröhlichkeit'],['einsam','die Einsamkeit'],['heiter','die Heiterkeit'],['traurig','die Traurigkeit'],['gültig','die Gültigkeit'],['sauber','die Sauberkeit'],
 ['heizen','die Heizung'],['impfen','die Impfung'],['erklären','die Erklärung'],['erzählen','die Erzählung'],['zeichnen','die Zeichnung'],['retten','die Rettung'],['senden','die Sendung'],['spannen','die Spannung'],['drehen','die Drehung'],['tarnen','die Tarnung'],['wohnen','die Wohnung'],['kreuzen','die Kreuzung'],['üben','die Übung'],['rechnen','die Rechnung'],['erwarten','die Erwartung'],['beobachten','die Beobachtung'],

];
const endings = ['-heit','-keit','-ung','-nis'];

  pick('Welche Nachsilbe steckt in diesem Nomen?','die Freiheit',endings,'-heit','Lies die letzten Buchstaben.','Frei + heit ergibt Freiheit. Das Wort wird großgeschrieben.'),

  mark('Markiere die beiden Nomen mit -ung.','Maja liest eine Erzählung und malt eine Zeichnung.',[3,7],'Suche am Wortende nach -ung.','Erzählung gehört zu erzählen. Zeichnung gehört zu zeichnen.'),
  mark('Markiere die Nomen mit -heit, -keit, -ung oder -nis.','Die Rettung ist ein Erlebnis und Fuji zeigt Tapferkeit.',[1,4,8],'Prüfe die Endung jedes Wortes.','Rettung endet auf -ung, Erlebnis auf -nis und Tapferkeit auf -keit.'),
  pick('Aus welcher Wortart entsteht „die Rettung“?','retten → die Rettung',types,'Verb','Ich rette, du rettest. Welche Wortart lässt sich so verändern?','retten ist ein Verb. Aus rett- und -ung wird die Rettung.'),
  search(searchSets[0]),

  ...families.map(([base,noun],i) => {
    const suffix = endings.find(end=>noun.endsWith(end.slice(1)));
    const word = noun.split(' ')[1];
    const root = word.slice(0,-suffix.length+1);
    const kind = suffix === '-ung' || (suffix === '-nis' && !['geheim','wild'].includes(base)) ? 'Verb' : 'Adjektiv';
    const why = `„${base}“ ist ein ${kind}. In „${noun}“ steckt ${root} + ${suffix.slice(1)}. Das Nomen ${word} beginnt groß.`;
    if (i%3===0) return write('Bilde das Nomen. Schreibe auch den Artikel.',base,noun,`Das Wort endet auf ${suffix}. Denk an den Artikel.`,why);
    if (i%3===1) return write(`Schreibe das verwandte ${kind}.`,noun,base,kind==='Verb'?'Schreibe die Grundform des Verbs.':'Schreibe das Wiewort klein.',why);
    return pick('Welche Nachsilbe steckt in diesem Nomen?',noun,endings,suffix,'Tippe den passenden Baustein am Ende an.',why);
  })
];

const compound = [

function setupLessonDemo(unit){
  const demo=lessonDemos[unit.id];
  const panel=document.querySelector('#lesson-demo');
  const title=panel.querySelector('#demo-title');
  const frame=panel.querySelector('#demo-frame');
  const previous=panel.querySelector('#demo-prev');
  const next=panel.querySelector('#demo-next');
  const counter=panel.querySelector('#demo-progress');
  let index=0;
  title.textContent=demo.title;

  function draw(animate=false){
    const step=demo.steps[index];
    const artName=step.art||demo.art;
    let picture=artName?demoPictogram(artName):'';
    if(unit.id==='steigern')picture=demoKites(index);
    if(step.pair){
      picture=`<div class="demo-chain">${[['Garten','tree'],['Tür','door'],['Schlüssel','key']].map(([word,art],i)=>
        `<span class="demo-chain-card ${step.pair.includes(i)?'is-current':''}">${demoPictogram(art)}<b>${word}</b></span>`).join('')}</div>`;
    }
    frame.innerHTML=`<div class="demo-stage ${animate?'demo-enter':''}">
      ${picture}
      <div class="demo-example"><span class="demo-label">${step.label}</span><div class="demo-view">${step.view}</div></div>
      </div><p class="demo-note">${step.note}</p>`;
    counter.textContent=`${index+1} von ${demo.steps.length}`;
    previous.disabled=index===0;
    next.innerHTML=`${index===demo.steps.length-1?'Von vorn':'Weiter'} ${icon('arrow')}`;
  }

  previous.onclick=()=>{
    index-=1;
    draw(true);
    if(previous.disabled)next.focus();
  };
  next.onclick=()=>{
    index=(index+1)%demo.steps.length;
    draw(true);
  };
  draw();
}

 const size=i<3?4:5,open=new Set(path.map(p=>p.join(','))),solution={},inventory={straight:0,bend:0};
 path.slice(1,-1).forEach((p,j)=>{const tile=witchTileFor(path[j],p,path[j+2]);solution[p.join(',')]=tile;inventory[tile.kind]++;});
 if(i>=3){inventory.straight++;inventory.bend++;let extra=0;for(let r=0;r<size&&extra<2;r++)for(let c=0;c<size&&extra<2;c++)if(!open.has([r,c].join(','))&&path.some(p=>Math.abs(p[0]-r)+Math.abs(p[1]-c)===1)){open.add([r,c].join(','));extra++;}}
 return {title:witchNames[i],size,path,open:[...open],solution,inventory,start:path[0],goal:path.at(-1),startMask:1<<witchDirection(path[0],path[1]),goalMask:1<<witchDirection(path.at(-1),path.at(-2))};

 const mask=key=>key===start?level.startMask:key===goal?level.goalMask:placed[key]?witchMask(placed[key]):0;
 for(let i=0;i<q.length;i++){const route=q[i],key=route.at(-1);if(key===goal)return route;const [r,c]=key.split(',').map(Number),ports=mask(key);
  cloudDirs.forEach(([dr,dc],d)=>{const next=[r+dr,c+dc].join(',');if((ports&(1<<d))&&(mask(next)&(1<<((d+2)%4)))&&!seen.has(next)){seen.add(next);q.push([...route,next]);}});

function gameShuffle(items){
  const result=[...items];
  for(let i=result.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [result[i],result[j]]=[result[j],result[i]];
  }
  return result;
}

function playWordCatch(board){
  const rounds=gameShuffle(catchRounds).slice(0,[4,6,8][Number(board.dataset.level||1)-1]);
  let round=0;

  function draw(focus=false){
    const [answerType,cards]=rounds[round];
    const goal={Nomen:'Nomen',Verb:'Verben',Adjektiv:'Adjektive'}[answerType];
    const words=gameShuffle(cards);
    let found=0;
    board.innerHTML=`<p class="game-counter">Runde ${round+1} von ${rounds.length} · <span id="catch-count">0 von 3 gefangen</span></p>
      <h2 tabindex="-1">Fang die ${goal}!</h2>
      <div class="game-word-grid">${words.map(([word])=>`<button class="choice game-catch-card" type="button" aria-pressed="false">${word}</button>`).join('')}</div>
      <p class="game-message" id="game-message" role="status">Tippe auf die drei passenden Wörter.</p>
      <button type="button" id="catch-next" class="primary" hidden>${round===rounds.length-1?'Zum Ergebnis':'Nächste Runde'} ${icon('arrow')}</button>`;
    const message=board.querySelector('#game-message');
    const next=board.querySelector('#catch-next');
    board.querySelectorAll('.game-catch-card').forEach((button,i)=>{
      const [word,type]=words[i];
      button.onclick=()=>{
        if(found===3||button.getAttribute('aria-pressed')==='true')return;
        if(type!==answerType){
          message.textContent=`„${word}“ ist ein ${type}. Suche weiter nach ${goal}.`;
          return;
        }
        found+=1;
        button.setAttribute('aria-pressed','true');
        button.setAttribute('aria-label',`${word}, gefangen`);
        board.querySelector('#catch-count').textContent=`${found} von 3 gefangen`;
        message.textContent=found===3?`Geschafft! Du hast alle drei ${goal} gefunden.`:`Gefangen! „${word}“ passt.`;
        if(found===3){
          next.hidden=false;
          next.focus();
        }
      };
    });
    next.onclick=()=>{
      round+=1;
      if(round===rounds.length)finishGame(board,'Fuji hat alle Wortschätze!',`Du hast ${rounds.length*3} passende Wörter gefangen.`,playWordCatch);
      else draw(true);
    };
    if(focus)board.querySelector('h2').focus();
  }
  draw();
}

const memoryPairs = [
  ['retten','die Rettung'],['zeichnen','die Zeichnung'],['üben','die Übung'],
  ['klug','die Klugheit'],['frei','die Freiheit'],['ehrlich','die Ehrlichkeit'],
  ['tapfer','die Tapferkeit'],['geheim','das Geheimnis'],['erleben','das Erlebnis'],
  ['sauber','die Sauberkeit'],['rechnen','die Rechnung'],['schön','die Schönheit']
];

function playWordMemory(board){
  const pairs=gameShuffle(memoryPairs).slice(0,[6,8,10][Number(board.dataset.level||1)-1]);
  const cards=gameShuffle(pairs.flatMap((words,pair)=>words.map(word=>({word,pair}))));
  const matched=new Set();
  let open=[];
  let turns=0;
  board.innerHTML=`<p class="game-counter" id="memory-count">0 von ${pairs.length} Paaren · 0 Versuche</p>
    <h2 tabindex="-1">Welche zwei Wörter gehören zusammen?</h2>
    <div class="memory-grid" id="memory-grid"></div>
    <p class="game-message" id="game-message" role="status">Decke zwei Karten auf.</p>
    <button class="primary" type="button" id="memory-next" hidden></button>`;
  const grid=board.querySelector('#memory-grid');
  const message=board.querySelector('#game-message');
  const next=board.querySelector('#memory-next');

  function draw(focusIndex){
    grid.innerHTML=cards.map(({word,pair},i)=>{
      const done=matched.has(pair);
      const visible=done||open.includes(i);
      return `<button type="button" class="memory-card${visible?' is-open':''}${done?' is-matched':''}" data-card="${i}" aria-label="Karte ${i+1}${visible?', '+word:''}${done?', Paar gefunden':''}" ${done?'disabled':''}>
        ${visible?word:`<span aria-hidden="true">${icon('paw')}<small>${i+1}</small></span>`}</button>`;
    }).join('');
    if(focusIndex!==undefined){
      const current=grid.querySelector(`[data-card="${focusIndex}"]:not([disabled])`);
      (current||grid.querySelector('button:not([disabled])'))?.focus();
    }
  }

  grid.onclick=event=>{
    const button=event.target.closest('button[data-card]');
    if(!button||button.disabled||open.length===2)return;
    const i=Number(button.dataset.card);
    if(open.includes(i))return;
    open.push(i);
    if(open.length===1){
      draw(i);
      message.textContent=`„${cards[i].word}“ ist aufgedeckt. Suche die passende Karte.`;
      return;
    }
    turns+=1;
    const [first,second]=open.map(index=>cards[index]);
    const found=first.pair===second.pair;
    if(found){
      matched.add(first.pair);
      open=[];
      message.textContent=`Paar gefunden! „${first.word}“ und „${second.word}“ gehören zusammen.`;
    } else {
      message.textContent='Die Wörter gehören zu verschiedenen Paaren. Dreh beide Karten wieder um.';
    }
    board.querySelector('#memory-count').textContent=`${matched.size} von ${pairs.length} Paaren · ${turns} ${turns===1?'Versuch':'Versuche'}`;
    draw(i);
    if(!found||matched.size===pairs.length){
      next.textContent=found?'Zum Ergebnis':'Karten umdrehen';
      next.hidden=false;
      next.focus();
    }
  };
  next.onclick=()=>{
    if(matched.size===pairs.length){
      finishGame(board,'Minka hat alle Paare gefunden!',`Du hast ${pairs.length} Wortpaare in ${turns} Versuchen gefunden.`,playWordMemory);
    } else {
      const [first]=open;
      open=[];
      draw(first);
      next.hidden=true;
      message.textContent='Decke wieder zwei Karten auf.';
    }
  };
  draw();
}

const puzzleHints = [
  'Maja zieht sich warm an.', 'Fuji rennt einem Blatt hinterher.',
  'Viele Kastanien liegen unter einem Baum.', 'Minka lauscht den Blättern.',
  'Am Himmel ziehen Wolken vorbei.', 'Der Flugdrachen wird nicht nass.'
];

function playSentencePuzzle(board){
  const rounds=gameShuffle(autumn.map((_,i)=>i)).slice(0,[4,5,6][Number(board.dataset.level||1)-1]);
  let round=0;

  function draw(focus=false){
    board.querySelector('audio')?.pause();
    const lineIndex=rounds[round];
    const [sentence]=autumn[lineIndex];
    const words=sentence.split(' ');
    const tiles=gameShuffle(words.map((_,i)=>i));
    if(tiles.every((tile,i)=>tile===i))tiles.push(tiles.shift());
    let placed=[];
    let correct=false;
    board.innerHTML=`<p class="game-counter">Satz ${round+1} von ${rounds.length}</p>
      <h2 tabindex="-1">Welchen Satz hörst du?</h2><p class="subtle">${puzzleHints[lineIndex]}</p>
      <div class="field-actions"><button type="button" class="secondary" id="game-hear">${icon('audio')} Satz hören</button>
      <button type="button" class="plain" id="game-pause" hidden>Stopp</button><audio id="dictation-audio" preload="none"></audio></div>
      <p class="field">Wortkarten</p><div class="tile-set" id="puzzle-tiles" aria-label="Wortkarten"></div>
      <p class="field">Dein Satz</p><div class="tile-set sequence" id="puzzle-placed" aria-label="Dein Satz"></div>
      <p class="game-message" role="status">Tippe die Wörter in der gehörten Reihenfolge an. Ein Tipp auf ein Wort im Satz nimmt es zurück.</p>
      <div class="actions"><button type="button" class="primary" id="puzzle-check" disabled>Satz prüfen</button>
      <button type="button" class="primary" id="puzzle-next" hidden>${round===rounds.length-1?'Zum Ergebnis':'Nächster Satz'}</button></div>`;
    const pool=board.querySelector('#puzzle-tiles');
    const row=board.querySelector('#puzzle-placed');
    const check=board.querySelector('#puzzle-check');
    const next=board.querySelector('#puzzle-next');
    const message=board.querySelector('.game-message');
    const audio=board.querySelector('audio');
    const stop=board.querySelector('#game-pause');
    const hear=board.querySelector('#game-hear');

    function drawTiles(focusTile){
      const tileButton=(i,verb)=>`<button type="button" class="tile" data-tile="${i}" aria-label="${words[i]} ${verb}" ${correct?'disabled':''}>${words[i]}</button>`;
      pool.innerHTML=tiles.filter(i=>!placed.includes(i)).map(i=>tileButton(i,'hinzufügen')).join('');
      row.innerHTML=placed.length?placed.map(i=>tileButton(i,'zurücklegen')).join(''):'<span class="subtle">Hier entsteht dein Satz.</span>';
      check.disabled=correct||placed.length!==words.length;
      if(focusTile!==undefined)board.querySelector(`[data-tile="${focusTile}"]`)?.focus();
    }

    pool.onclick=row.onclick=event=>{
      const tile=event.target.closest('button[data-tile]');
      if(!tile||correct)return;
      const i=Number(tile.dataset.tile);
      if(placed.includes(i))placed=placed.filter(value=>value!==i);
      else placed.push(i);
      drawTiles(i);
    };
    hear.onclick=()=>{
      if(!audio.getAttribute('src'))audio.src=dictationAudio[lineIndex].normal;
      audio.currentTime=0;
      audio.playbackRate=.9;
      audio.play().catch(error=>{
        if(error.name==='AbortError'||!audio.isConnected)return;
        message.textContent=`Der Ton spielt gerade nicht. Beginne so: „${words.slice(0,2).join(' ')} …“`;
      });
    };
    audio.onplaying=()=>{stop.hidden=false;};
    audio.onended=()=>{if(document.activeElement===stop)hear.focus();stop.hidden=true;};
    stop.onclick=()=>{
      audio.pause();
      audio.currentTime=0;
      hear.focus();
      stop.hidden=true;
    };
    check.onclick=()=>{
      correct=placed.map(i=>words[i]).join(' ')===sentence;
      if(!correct){
        message.textContent=`Höre noch einmal hin. Der Satz beginnt mit „${words[0]}“. Du kannst Karten zurücklegen und neu sortieren.`;
        return;
      }
      drawTiles();
      message.textContent='Genau so lautet der Satz!';
      next.hidden=false;
      next.focus();
    };
    next.onclick=()=>{
      round+=1;
      if(round===rounds.length){
        audio.pause();
        finishGame(board,'Maja hat alle Sätze zusammengesetzt!',`Du hast ${rounds.length} Sätze richtig gelegt.`,playSentencePuzzle);
      } else draw(true);
    };
    drawTiles();
    if(focus)board.querySelector('h2').focus();
  }
  draw();
}
</script>

const annaDayFormatter=new Intl.DateTimeFormat('de-DE',{
  timeZone:'Europe/Berlin',year:'numeric',month:'numeric',day:'numeric'
});

function annaStoryIndex(date=new Date()){
  const parts=Object.fromEntries(annaDayFormatter.formatToParts(date).map(({type,value})=>[type,Number(value)]));
  const day=Date.UTC(parts.year,parts.month-1,parts.day);
  const start=Date.UTC(2026,10,5);
  const elapsed=(day-start)/86400000;
  return ((elapsed%annaStories.length)+annaStories.length)%annaStories.length;
}

const annaArt=()=>document.querySelector('#anna-source').innerHTML;

function annaDetective(story){
  const [indices,distractors]=annaClues[story.id];
  const choices=gameShuffle([story.answer,...distractors]);
  return `<details class="anna-detective">
    <summary>Lesedetektiv starten</summary>
    <p><b>1. Was ist die richtige Antwort?</b></p><p>${story.question}</p>
    <div class="anna-detective-answers">${choices.map(choice=>`<button type="button" class="choice" data-answer="${choice===story.answer}">${choice}</button>`).join('')}</div>
    <div class="anna-evidence" hidden>
      <p><b>2. Wo im Text steht der Hinweis?</b></p>
      <div class="anna-detective-answers">${story.paragraphs.map((paragraph,i)=>`<button type="button" class="choice" data-evidence="${indices.includes(i)}"><b>Absatz ${i+1}</b> ${paragraph}</button>`).join('')}</div>
    </div>
    <p class="game-message anna-clue-message" role="status" hidden></p>
  </details>`;
}

function setupAnnaDetective(){
  const panel=document.querySelector('.anna-detective');
  const evidence=panel.querySelector('.anna-evidence');
  const message=panel.querySelector('.anna-clue-message');
  panel.onclick=event=>{
    const button=event.target.closest('button[data-answer],button[data-evidence]');
    if(!button||button.disabled)return;
    message.hidden=false;
    if(button.hasAttribute('data-answer')){
      if(button.dataset.answer==='false'){
        message.textContent='Lies noch einmal nach. Welche Antwort passt wirklich zur Geschichte?';
        return;
      }
      panel.querySelectorAll('[data-answer]').forEach(answer=>{answer.disabled=true;});
      button.classList.add('anna-clue-found');
      evidence.hidden=false;
      message.textContent='Richtig! Wähle jetzt den Absatz, der deine Antwort belegt.';
      evidence.querySelector('button').focus();
      return;
    }
    if(button.dataset.evidence==='false'){
      message.textContent='Dieser Absatz liefert den gesuchten Hinweis noch nicht. Probiere einen anderen.';
      return;
    }
    evidence.querySelectorAll('button').forEach(answer=>{answer.disabled=true;});
    button.classList.add('anna-clue-found');
    message.textContent='Textspur gefunden! In diesem Absatz steht der Hinweis für deine Antwort.';
    message.tabIndex=-1;
    message.focus();
  };
}

function setupAnnaListen(story){
  const audio=document.querySelector('#anna-audio-player');
  const pause=document.querySelector('#anna-pause');
  const speed=document.querySelector('#anna-speed');
  const status=document.querySelector('.anna-audio-status');
  const paragraphs=[...document.querySelectorAll('[data-story-paragraph]')];
  const buttons=[...document.querySelectorAll('[data-listen-paragraph]')];
  const cues=annaAudioCues[story.id];
  let limit=null;
  let resumeAt=null;
  let playingParagraph=-1;

  function mark(index){
    if(index===playingParagraph)return;
    playingParagraph=index;
    paragraphs.forEach((paragraph,i)=>paragraph.classList.toggle('anna-reading',i===index));
    buttons.forEach((button,i)=>button.setAttribute('aria-current',i===index?'true':'false'));
  }

  function fail(){
    status.textContent='Die Aufnahme konnte gerade nicht abgespielt werden. Versuche es noch einmal.';
    pause.disabled=true;
    mark(-1);
  }

  function play(){
    audio.playbackRate=Number(speed.value);
    audio.play().catch(error=>{if(error.name!=='AbortError'&&audio.isConnected)fail();});
  }

  function start(index){
    audio.pause();
    limit=index===null?null:cues[index][1];
    resumeAt=null;
    audio.currentTime=index===null?0:cues[index][0];
    mark(index??-1);
    play();
  }

  document.querySelector('#anna-play').onclick=()=>start(null);
  buttons.forEach((button,i)=>button.onclick=()=>start(i));
  speed.onchange=()=>{audio.playbackRate=Number(speed.value);};
  pause.onclick=()=>{
    if(audio.paused){
      if(resumeAt!==null)audio.currentTime=resumeAt;
      play();
    }else{
      resumeAt=audio.currentTime;
      audio.pause();
    }
  };
  audio.onplaying=()=>{
    pause.disabled=false;
    pause.textContent='Pause';
    status.textContent='Die Geschichte wird vorgelesen.';
  };
  audio.onpause=()=>{pause.textContent='Weiterhören';};
  audio.ontimeupdate=()=>{
    const current=audio.currentTime;
    if(limit!==null&&current>=limit){
      audio.pause();
      limit=null;
      pause.disabled=true;
      status.textContent='Dieser Absatz ist zu Ende.';
      return;
    }
    if(audio.paused)return;
    const index=cues.findIndex(([start,end])=>start<=current&&current<end);
    if(index>=0)mark(index);
  };
  audio.onended=()=>{
    pause.disabled=true;
    mark(-1);
    status.textContent='Die Geschichte ist zu Ende.';
  };
  audio.onerror=fail;
}

function showAnnaImageGame(part){
  const game=imageRounds.find(item=>item.id===part);
  if(!game){
    annaExtraPage('Bilderspiel','Drei Bilder, eine Geschichte',`
      <p>Wähle eine Geschichte und bringe ihre Bilder in die Reihenfolge Anfang, Mitte, Ende.</p>
      <ol class="anna-list">${imageRounds.map(({id})=>`<li><a href="#anna/bilder/${id}"><span>${annaStories.find(story=>story.id===id).title}</span> ${icon('arrow')}</a></li>`).join('')}</ol>`);
    return;
  }
  const story=annaStories.find(item=>item.id===part);
  const pictures=[game.start||annaScene(story),annaMoment(story).image,game.end];
  let shuffled=gameShuffle([0,1,2]);
  if(shuffled.join()==='0,1,2')shuffled=[1,2,0];
  let picks=[];
  annaExtraPage('Bilderspiel',story.title,`
    <p>Tippe auf die Bilder in der Reihenfolge der Geschichte. Du kannst deine Auswahl danach prüfen.</p>
    <div class="anna-image-choices"></div>
    <p class="game-message" role="status">Welches Bild zeigt den Anfang?</p>
    <div class="actions"><button class="primary" type="button" id="anna-picture-check" disabled>Reihenfolge prüfen</button>
    <button class="secondary" type="button" id="anna-picture-reset">Auswahl löschen</button>
    <a class="secondary" href="#anna/bilder">Andere Bildergeschichte</a></div>
    <div class="anna-retell" hidden><h2>Jetzt erzählst du</h2><p>Erzähle zu jedem Bild einen Satz. Du kannst mit „Zuerst“, „Dann“ und „Am Ende“ beginnen.</p>
    <a href="${annaLink(story)}">Die ganze Geschichte lesen</a></div>`);
  const board=document.querySelector('.anna-image-choices');
  const message=document.querySelector('.game-message');
  const check=document.querySelector('#anna-picture-check');
  const retell=document.querySelector('.anna-retell');
  let done=false;
  function draw(focus){
    board.innerHTML=(done?[0,1,2]:shuffled).map(i=>{
      const position=picks.indexOf(i);
      return `<button class="anna-image-card" type="button" data-image="${i}" aria-pressed="${position>=0}" ${done?'disabled':''}>
        ${pictures[i]}<span><strong>${position>=0?position+1+'. ':''}</strong>${game.captions[i]}</span></button>`;
    }).join('');
    check.disabled=done||picks.length!==3;
    if(focus!==undefined)board.querySelector(`[data-image="${focus}"]`).focus();
  }
  board.onclick=event=>{
    const button=event.target.closest('[data-image]');
    if(!button||done)return;
    const i=Number(button.dataset.image);
    picks=picks.includes(i)?picks.filter(value=>value!==i):[...picks,i];
    message.textContent=['Welches Bild zeigt den Anfang?','Welches Bild gehört in die Mitte?','Welches Bild zeigt das Ende?','Alle drei Bilder sind ausgewählt.'][picks.length];
    draw(i);
  };
  check.onclick=()=>{
    if(picks.join()!=='0,1,2'){
      message.textContent='Die Reihenfolge passt noch nicht. Tippe ausgewählte Bilder erneut an oder lösche die Auswahl.';
      return;
    }
    done=true;
    message.textContent='Richtig! So beginnt die Geschichte, so geht sie weiter und so endet sie.';
    retell.hidden=false;
    draw();
    retell.querySelector('a').focus();
  };
  document.querySelector('#anna-picture-reset').onclick=()=>{
    picks=[];
    done=false;
    retell.hidden=true;
    message.textContent='Welches Bild zeigt den Anfang?';
    draw(shuffled[0]);
  };
  draw();
}

function annaWordParagraph(story,paragraph,index){
  const dictionary=annaWords[story.id];
  const words=Object.keys(dictionary);
  const pattern=new RegExp('('+words.join('|')+')','gu');
  const parts=paragraph.split(pattern);
  const helpId='anna-word-help-'+index;
  const text=parts.map((part,i)=>i%2
    ? `<button type="button" class="anna-word" data-anna-word="${escapeHtml(part)}" aria-expanded="false" aria-controls="${helpId}">${escapeHtml(part)}</button>`
    : escapeHtml(part)).join('');
  return `<div class="anna-word-line"><p data-story-paragraph>${text}</p><div class="anna-word-definition" id="${helpId}" role="status" hidden></div></div>`;
}

function setupAnnaWords(story){
  const reader=document.querySelector('.anna-text');
  let open=null;
  function close(){
    if(!open)return;
    open.setAttribute('aria-expanded','false');
    document.getElementById(open.getAttribute('aria-controls')).hidden=true;
    open=null;
  }
  reader.addEventListener('click',event=>{

    button.setAttribute('aria-expanded','true');
    open=button;

function showAnnaWriting(part){
  if(!Object.hasOwn(annaWritingIdeas,part)){
    annaExtraPage('Eigene Geschichten','Annas Schreibwerkstatt',`

  let draft={};
  try{
    const saved=JSON.parse(localStorage.getItem(storageKey)||'{}');
    if(saved&&typeof saved==='object')draft=saved;

  const stages=['Anfang','Mitte','Ende'];
  annaExtraPage('Annas Schreibwerkstatt',idea.label,`

      </label>`).join('')}</div>
      <details><summary>Beispiel für einen ersten Satz</summary><p>${idea.opening}</p></details>

      <label><strong>Dein Abenteuer</strong><textarea data-draft="story" rows="9" maxlength="5000"></textarea></label>
      <p class="anna-save-note" role="status">Dein Entwurf wird beim Schreiben in diesem Browser gespeichert.</p>
      <details><summary>3. Lies deinen Text noch einmal</summary>
        <ul><li>Erfährt man am Anfang, wer dabei ist und wo es losgeht?</li>
        <li>Passiert in der Mitte etwas, das neugierig macht?</li>
        <li>Erfährt man am Ende, wie das Abenteuer ausgeht?</li></ul>
      </details>
    </div>
    <div class="actions"><a class="secondary" href="#anna/schreiben">Andere Schreibidee</a>
      <a href="#anna/${idea.story}">Annas Geschichte noch einmal lesen</a></div>`);

  const editor=document.querySelector('.anna-write');
  const fields=[...editor.querySelectorAll('[data-draft]')];
  const status=editor.querySelector('.anna-save-note');
  for(const field of fields){
    const value=draft[field.dataset.draft];
    if(typeof value==='string')field.value=value.slice(0,field.maxLength);
  }
  if(fields.some(field=>field.value))status.textContent='Dein gespeicherter Entwurf ist wieder da.';
  editor.addEventListener('input',event=>{
    if(!event.target.matches('[data-draft]'))return;
    try{
      localStorage.setItem(storageKey,JSON.stringify(Object.fromEntries(fields.map(field=>[field.dataset.draft,field.value]))));
      status.textContent='Entwurf in diesem Browser gespeichert.';
    }catch{
      status.textContent='Speichern ist hier gerade nicht möglich. Kopiere deinen Text vor dem Schließen.';
    }
  });
}

function puzzleBoard(set){
  const alphabet='ABCDEFGHIKLMNOPRSTUVWZ';
  let seed=set.join('').length;
  const rand = limit=>{seed=(seed*1664525+1013904223)>>>0;return seed%limit;};
  const grid=Array.from({length:80},()=>alphabet[rand(alphabet.length)]);
  const places=set.map((word,i)=>{
    const row=[3,0,6,2,7,4][i];
    const start=row*10+rand(11-word.length);
    [...word.toUpperCase()].forEach((letter,n)=>{grid[start+n]=letter;});
    return {word,start,end:start+word.length-1};
  });
  return {grid,places};
}

}

function drawTiles(focus){
  const {q,order,checked}=active;
  const open=shuffledTiles(q.tiles).filter(tile=>!order.includes(tile));
  const button=(tile,action)=>`<button type="button" class="tile" data-tile="${escapeHtml(tile)}" aria-label="${escapeHtml(tile+' '+action)}" ${checked?'disabled':''}>${escapeHtml(tile)}</button>`;
  document.querySelector('#tiles').innerHTML=open.map(t=>button(t,'hinzufügen')).join('');
  document.querySelector('#sequence').innerHTML=order.length?order.map(t=>button(t,'entfernen')).join(''):'<span class="subtle">Tippe die Karten der Reihe nach an.</span>';
  app.querySelectorAll('[data-tile]').forEach(b=>b.onclick=()=>{
    const tile=b.dataset.tile;
    if(order.includes(tile))order.splice(order.indexOf(tile),1);
    else order.push(tile);
    drawTiles(tile);
  });
  if(focus)Array.from(app.querySelectorAll('[data-tile]')).find(b=>b.dataset.tile===focus)?.focus();
}
function drawPuzzle(){
  const {board}=active;
  document.querySelector('#grid').innerHTML=board.grid.map((letter,index)=>`<button type="button" class="cell" data-cell="${index}" aria-label="${letter}, Zeile ${Math.floor(index/10)+1}, Spalte ${index%10+1}">${letter}</button>`).join('');
  app.querySelectorAll('[data-cell]').forEach(button=>button.onclick=()=>{
    const index=Number(button.dataset.cell);
    const status=document.querySelector('#search-status');
    if(active.start===null){active.start=index;status.textContent='Tippe jetzt auf den letzten Buchstaben.';}
    else {
      const left=Math.min(active.start,index);
      const right=Math.max(active.start,index);
      const match=board.places.find(p=>p.start===left&&p.end===right);
      if(match){
        active.found.add(match.word);
        status.textContent=`${match.word}! ${active.found.size} von ${board.places.length} gefunden.`;
      } else status.textContent='Probiere es noch einmal. Jedes gesuchte Wort steht in einer Zeile.';
      active.start=null;
    }
    updatePuzzle();
  });
  updatePuzzle();
}
function updatePuzzle(){
  const {board,q,found,start}=active;
  const positions=board.places.filter(p=>found.has(p.word));
  app.querySelectorAll('[data-cell]').forEach(button=>{
    const n=Number(button.dataset.cell);
    button.dataset.state=n===start?'start':positions.some(p=>p.start<=n&&n<=p.end)?'found':'';
  });
  document.querySelector('#found').innerHTML=[...found].map(word=>{
    const suffix=endings.find(e=>word.endsWith(e.slice(1))).slice(1);
    return `<span>${word.slice(0,-suffix.length)}<mark>${suffix}</mark></span>`;
  }).join('');
  document.querySelector('#check').disabled=found.size!==q.set.length;
}
function setupAudio(q){
  const status=document.querySelector('#audio-status');
  const audio=document.querySelector('#dictation-audio');
  const tracks=dictationAudio[q.audio];
  let currentMode;
  const fallback=()=>{
    status.textContent='Die Audiodatei lässt sich gerade nicht abspielen.';
    document.querySelector('#reading-alternative').hidden=false;
  };
  audio.onplaying=()=>{status.textContent='Der Satz wird vorgelesen …';};
  audio.onended=()=>{status.textContent='';};
  audio.onerror=fallback;
  document.querySelector('#stop-audio').onclick=()=>{
    audio.pause();
    audio.currentTime=0;
    status.textContent='';
  };
  document.querySelector('#toggle-reading').onclick=event=>{
    const reading=document.querySelector('#reading');
    reading.hidden=!reading.hidden;
    event.currentTarget.textContent=reading.hidden?'Satz kurz lesen und dann schreiben':'Satz wieder verdecken';
    event.currentTarget.setAttribute('aria-expanded',String(!reading.hidden));
  };
  app.querySelectorAll('[data-speak]').forEach(button=>button.onclick=()=>{
    const mode=button.dataset.speak;
    if(mode!==currentMode){
      currentMode=mode;
      audio.src=tracks[mode];
    } else {
      audio.currentTime=0;
    }
    audio.playbackRate=mode==='normal'?.9:1;
    audio.play().catch(error=>{
      if(error.name!=='AbortError'&&active?.q===q)fallback();
    });
  });
}
function checkAnswer(){
  if(!active||active.checked)return;
  const {q,chosen,order,found}=active;
  const field=document.querySelector('#answer');
  let given;
  let correct;
  switch(q.type){
    case 'write':
      given=normalize(field.value);
      correct=[q.answer,...(q.also||[])].includes(given);
      break;
    case 'pick':
      given=q.options[[...chosen][0]]||'';
      correct=given===q.answer;
      break;
    case 'mark':
      given=[...chosen].sort((a,b)=>a-b).map(i=>q.words[i]).join(', ');
      correct=chosen.size===q.answer.length&&q.answer.every(i=>chosen.has(i));
      break;
    case 'sort':
      given=order.join(' → ');
      correct=given===q.answer;
      break;
    case 'search':
      given=[...found].join(', ');
      correct=found.size===q.set.length;
      break;
  }
  const feedback=document.querySelector('#feedback');
  if(!given){
    feedback.className='feedback';
    feedback.textContent='Gib zuerst eine Antwort ein.';
    if(field)field.focus();
    return;
  }
  learningRecord(q,correct);
  if(active.isQuiz){
    active.checked=true;
    quiz.push({q,given,correct});
    nextQuestion();
    return;
  }
  if(correct){
    const hadStar=progress.has(q.id);
    progress.add(q.id);
    persist();
    syncStars();
    showFeedback(hadStar?'Richtig gelöst!':'Richtig! Du bekommst einen Stern.',true,true);
    if(!hadStar)feedback.insertAdjacentHTML('beforeend',`<p>Im Sternenbeutel: <strong>${starBalance()} Sterne</strong>. <a href="#baerli/schrank">Für Bärli einkaufen</a> oder <a href="#spiele">ein Spiellevel freischalten</a>.</p>`);
  } else {
    const caseOnly=q.type==='write'&&given.toLocaleLowerCase('de-DE')===q.answer.toLocaleLowerCase('de-DE');
    const articleMissing=q.type==='write'&&/^(der|die|das) /.test(q.answer)&&given===q.answer.split(' ').slice(1).join(' ');
    const periodMissing=q.listen&&given+'.'===q.answer;
    const punctuationOnly=q.type==='write'&&given.replace(/[.,!?„“"]/g,'').replace(/\s+/g,' ').trim()===q.answer.replace(/[.,!?„“"]/g,'').replace(/\s+/g,' ').trim();
    const message=punctuationOnly&&!caseOnly?'Die Wörter stimmen. Prüfe Komma, Punkt und Redezeichen.':caseOnly?'Fast richtig. Prüfe die Groß- und Kleinschreibung.':articleMissing?'Das Nomen stimmt. Ergänze noch den Artikel.':periodMissing?'Fast richtig. Am Ende fehlt der Punkt.':'Versuche es noch einmal. Der Tipp kann dir helfen.';
    showFeedback(message,false,false);
  }
}
function showFeedback(message,correct,withSolution){
  const {q}=active;
  const feedback=document.querySelector('#feedback');
  feedback.className='feedback'+(correct?' good':'');
  feedback.innerHTML=`<strong>${escapeHtml(message)}</strong>${withSolution?`<p><b>${q.also?'Eine richtige Form':'Lösung'}</b> · ${escapeHtml(solutionText(q))}</p><p>${escapeHtml(q.why)}</p>`:''}`;
  if(withSolution){
    const next=document.querySelector('#next');
    next.hidden=false;
    const skip=document.querySelector('#skip-task');
    if(skip)skip.hidden=true;
    if(correct){
      active.checked=true;
      document.querySelectorAll('#answer-form input,#answer-form textarea,#answer-form button').forEach(control=>{control.disabled=true;});
      next.focus();
    }
  }
}
function nextQuestion(){
  const {number,list,isQuiz,unit,part}=active;
  if(isQuiz){
    const path=part?'#kombitest/'+part:'#quiz';
    move(path+'/'+(number<list.length?number+1:'ergebnis'));
  } else if(number<list.length){
    move(unitLink(unit.id,number+1));

}

// Persistent star wallet: learning achievements are never spent or deleted.
const starWalletKey='majas-wortwerkstatt-sternenbeutel-v1';
function starCount(n){return n+(n===1?' Stern':' Sterne');}
function starBlank(){return {version:1,rewards:{},purchases:{},migrated:true};}
function starClean(value){
 if(!value||value.version!==1||typeof value!=='object')return null;
 const clean=starBlank();
 for(const [key,v]of Object.entries(value.rewards||{}))if(v&&Number.isInteger(v.amount)&&v.amount>=0&&v.amount<=2&&typeof v.day==='string')clean.rewards[key]={amount:v.amount,day:v.day};
 for(const [key,v]of Object.entries(value.purchases||{}))if(v&&Number.isInteger(v.cost)&&v.cost>=0&&v.cost<=100&&typeof v.label==='string')clean.purchases[key]={cost:v.cost,label:v.label,day:typeof v.day==='string'?v.day:''};
 return clean;
}
function starDay(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Berlin'}).format(new Date());}
function starRead(){try{return starClean(JSON.parse(localStorage.getItem(starWalletKey)||'null'));}catch{return null;}}
function starTotals(state,learned=progress.size){const bonus=Object.values(state.rewards).reduce((sum,v)=>sum+v.amount,0),spent=Object.values(state.purchases).reduce((sum,v)=>sum+v.cost,0);return {earned:learned+bonus,spent,balance:Math.max(0,learned+bonus-spent)};}
function starMigrate(){
 const value=starRead();if(value)return value;
 const next=starBlank();
 // Keep all rewards from the previous threshold-based wardrobe.
 for(const item of bearItems)if(progress.size>=item.stars||Object.values(bearOutfit).includes(item.id))next.purchases['item:'+item.id]={cost:0,label:item.title+' (übernommen)',day:starDay()};
 try{const old=JSON.parse(localStorage.getItem('majas-wortwerkstatt-wolkenwege-v1')||'{}');
  for(const [i,done]of Object.entries(old.completed||{}))if(done&&/^\d+$/.test(i)&&+i<12){const n=+i+1;next.rewards['first:wolkenwege:'+n]={amount:2,day:starDay()};next.rewards['daily:wolkenwege:'+n+':'+starDay()]={amount:0,day:starDay()};}
  for(const i of new Set([...Object.keys(old.sessions||{}),...Object.keys(old.completed||{})]))if(/^\d+$/.test(i)&&+i<12)next.purchases['level:wolkenwege:'+(+i+1)]={cost:0,label:'Wolkenwege · Level '+(+i+1)+' (übernommen)',day:starDay()};
 }catch{}
 try{localStorage.setItem(starWalletKey,JSON.stringify(next));}catch{}
 return next;
}
let starWallet=starMigrate();
function starRefresh(){const latest=starRead();if(latest)starWallet=latest;return starWallet;}
function starBalance(){return starTotals(starRefresh()).balance;}
function starOwned(id){return Object.hasOwn(starRefresh().purchases,id);}
function starCommit(next){try{localStorage.setItem(starWalletKey,JSON.stringify(next));starWallet=next;syncStars();return true;}catch{return false;}}
function starLevelCount(id){return ['wolkenwege','hexenpfad'].includes(id)?12:3;}
function starLevelCost(id,n){if(['wolkenwege','hexenpfad'].includes(id))return n<=3?0:n<=6?2:n<=9?3:4;return n===1?0:n===2?3:5;}
function starLevelOpen(id,n){return Object.hasOwn(miniGames,id)&&Number.isInteger(n)&&n>=1&&n<=starLevelCount(id)&&(starLevelCost(id,n)===0||starOwned('level:'+id+':'+n));}
function starOffer(id){
 if(id.startsWith('item:')){const item=bearItems.find(x=>'item:'+x.id===id);return item?{cost:item.stars,label:item.title}:null;}
 const m=id.match(/^level:([a-z]+):(\d+)$/);if(!m)return null;const game=m[1],n=+m[2];
 if(!Object.hasOwn(miniGames,game)||n<1||n>starLevelCount(game))return null;
 return {cost:starLevelCost(game,n),label:miniGames[game].title+' · Level '+n};
}
function starPurchase(id){
 const offer=starOffer(id);if(!offer)return {ok:false,message:'Diesen Schatz gibt es hier nicht.'};
 const current=starRefresh();if(Object.hasOwn(current.purchases,id))return {ok:true,already:true,message:'Das gehört dir bereits. Es werden keine weiteren Sterne abgezogen.'};
 const balance=starTotals(current).balance;if(balance<offer.cost)return {ok:false,message:`Dir ${offer.cost-balance===1?'fehlt':'fehlen'} noch ${starCount(offer.cost-balance)}. Übe eine Station oder spiele ein kostenloses Level.`};
 const next=structuredClone(current);next.purchases[id]={cost:offer.cost,label:offer.label,day:starDay()};
 if(!starCommit(next))return {ok:false,message:'Der Kauf konnte nicht gespeichert werden. Es wurden keine Sterne abgezogen. Versuche es noch einmal.'};
 return {ok:true,message:`Gekauft! ${offer.cost} ${offer.cost===1?'Stern wurde':'Sterne wurden'} abgezogen. Du hast noch ${starCount(starTotals(next).balance)}.`};
}
function starGameReward(game,n){
 if(!starLevelOpen(game,n))return {amount:0,message:'Dieses Level ist noch nicht freigeschaltet.'};
 const current=starRefresh(),first='first:'+game+':'+n,daily='daily:'+game+':'+n+':'+starDay();
 if(Object.hasOwn(current.rewards,daily))return {amount:0,message:'Heute hast du die Sterne für dieses Level schon gesammelt. Deine bisherigen Sterne bleiben im Beutel.'};
 const amount=Object.hasOwn(current.rewards,first)?1:2,next=structuredClone(current);
 if(!Object.hasOwn(next.rewards,first))next.rewards[first]={amount,day:starDay()};
 next.rewards[daily]={amount:Object.hasOwn(current.rewards,first)?1:0,day:starDay()};
 if(!starCommit(next))return {amount:0,message:'Geschafft! Die Belohnung konnte gerade nicht gespeichert werden. Öffne das Level später noch einmal und versuche es erneut.'};
 return {amount,message:`+${amount} ${amount===1?'Stern':'Sterne'} für dein ${amount===2?'erstes Lösen':'heutiges Wiederholen'}! Jetzt im Beutel: ${starCount(starTotals(next).balance)}.`};
}

 <section class="panel"><h2>Deine Käufe</h2>${purchases.length?`<ul class="progress-list">${purchases.slice().reverse().map(v=>`<li><span>${escapeHtml(v.label)}</span><strong>${v.cost===0?'Übernommen':v.cost+' ★'}</strong></li>`).join('')}</ul>`:'<p>Hier stehen später deine gekauften Gegenstände und Spiellevel.</p>'}<p class="subtle">Bisher freigeschaltete Sachen und bereits begonnene Wolkenwege wurden kostenlos übernommen. Der Sternenbeutel bleibt in diesem Browser gespeichert.</p></section></div>`;
}
function starGameLevelName(id,n){
 if(id==='wolkenwege')return cloudWorlds[n-1].title;
 if(id==='hexenpfad')return witchLevels[n-1].title;
 if(id==='memory')return [6,8,10][n-1]+' Wortpaare';
 if(id==='satzpuzzle')return [4,5,6][n-1]+' Hörsätze';
 return [4,6,8][n-1]+' Wörterfang-Runden';
}

 const game=miniGames[id];
 app.innerHTML=`<div class="route"><a class="crumb" href="#spiele">${icon('back')} Zur Spielwiese</a><div class="unit-head ${game.tone}"><span class="icon-box">${icon('game')}</span><div><h1 tabindex="-1">${game.title}</h1><p>${game.intro}</p></div></div>${starButtons()}
 <p id="game-shop-message" class="inline-status" tabindex="-1" role="status">${escapeHtml(message)}</p><section class="panel"><h2>Wähle dein Level</h2><p>${['wolkenwege','hexenpfad'].includes(id)?'Die ersten drei Level sind kostenlos.':'Das erste Level ist kostenlos.'} Weitere Level kannst du mit Sternen dauerhaft kaufen.</p>
 <div class="star-levels">${Array.from({length:starLevelCount(id)},(_,i)=>{const n=i+1,open=starLevelOpen(id,n),cost=starLevelCost(id,n);return `<div class="star-level-card"><h3>${n}. ${escapeHtml(starGameLevelName(id,n))}</h3><p>${open?(cost===0?'Kostenlos':'Gehört dir'):cost+' Sterne'}</p>${open?`<a class="primary" href="#spiele/${id}/${n}">Spielen ${icon('arrow')}</a>`:`<button type="button" class="secondary" data-buy-level="${n}" ${starBalance()<cost?'disabled':''}>Für ${cost} Sterne kaufen</button>${starBalance()<cost?`<p class="subtle">Noch ${starCount(cost-starBalance())} sammeln</p>`:''}`}</div>`;}).join('')}</div></section></div>`;
 app.querySelectorAll('[data-buy-level]').forEach(b=>b.onclick=()=>{const n=+b.dataset.buyLevel,result=starPurchase('level:'+id+':'+n);showGameLevels(id,result.message);document.querySelector('#game-shop-message').focus({preventScroll:true});});
}


function bearPicture(scene,eager=false){
  return `<img class="bear-picture" src="./baerli/${scene}.webp" alt="${bearScenes[scene]}" width="623" height="623" ${eager?'fetchpriority="high"':'loading="lazy"'}>`;
}
function bearToday(date=new Date(),count=bearStories.length){
  const parts=Object.fromEntries(new Intl.DateTimeFormat('de-DE',{
    timeZone:'Europe/Berlin',year:'numeric',month:'numeric',day:'numeric'
  }).formatToParts(date).map(({type,value})=>[type,Number(value)]));
  const day=Date.UTC(parts.year,parts.month-1,parts.day)/86400000;
  const start=Date.UTC(2026,10,6)/86400000;
  return ((day-start)%count+count)%count;
}

const schoolComicAsset='./baerli/comics/';
const schoolComicPageSize=2;
function comicToday(date=new Date()){
  return bearToday(date,schoolComics.length);
}
function comicArt(comic,i){
  const x=i%2*100;
  const y=Math.floor(i/2)*100/3;
  return `<div class="comic-art" role="img" aria-label="${escapeHtml(comic.panels[i][1])}" style="background-image:url('${schoolComicAsset}${comic.id}.webp');background-position:${x}% ${y}%"></div>`;
}
function showSchoolComic(id,part){
  const today=schoolComics[comicToday()];
  const comic=schoolComics.find(c=>c.id===id)||today;
  const pageCount=Math.ceil(comic.panels.length/schoolComicPageSize);
  const page=Math.min(pageCount,Math.max(1,Number.isInteger(+part)?+part:1));
  const first=(page-1)*schoolComicPageSize;
  const link=(c= comic,n=1)=>`#schulgeschichten/${c.id}/${n}`;
  app.innerHTML=`<div class="route">${homeLink()}
    <div class="unit-head lilac"><span class="icon-box">${icon('book')}</span><div>
    <p class="kicker">${comic===today?'Tagesgeschichte · '+annaDayFormatter.format(new Date()):'Maja und Bärli in der Schule'}</p>
    <h1 tabindex="-1">${escapeHtml(comic.title)}</h1><p>${escapeHtml(comic.summary)}</p></div></div>
    <nav class="panel comic-archive" aria-label="Schulgeschichten auswählen"><h2>Alle drei Tagesgeschichten</h2><p>Die Tagesgeschichte wechselt täglich. Du kannst jede Geschichte jederzeit lesen.</p>
    <div class="actions">${schoolComics.map(c=>`<a class="secondary" href="${link(c)}"${c===comic?' aria-current="true"':''}>${escapeHtml(c.title)}</a>`).join('')}</div></nav>
    <section class="panel" aria-labelledby="comic-page"><div class="task-top"><h2 id="comic-page">Seite ${page} von ${pageCount}</h2><span>Geschichte mit ${comic.panels.length} Bildern</span></div>
    <div class="comic-panels">${comic.panels.slice(first,first+schoolComicPageSize).map(([caption,,...dialogue],i)=>`<figure class="comic-panel">
      ${comicArt(comic,first+i)}<figcaption><p class="comic-caption"><b>Bild ${first+i+1}.</b> ${escapeHtml(caption)}</p>
      ${dialogue.filter((_,i)=>i%2===0).map((speaker,i)=>`<p class="comic-dialogue ${speaker==='Bärli'?'bear-line':''}"><b>${escapeHtml(speaker)}</b> ${escapeHtml(dialogue[i*2+1])}</p>`).join('')}</figcaption></figure>`).join('')}</div>
    ${page===pageCount?`<details class="comic-task"><summary>Bärlis Aufgabe nach dem Lesen</summary><p>${escapeHtml(comic.task)}</p><details><summary>Musterlösung ansehen</summary><p>${escapeHtml(comic.answer)}</p></details><div class="actions"><a class="secondary" href="#${comic.unit}">${unitById(comic.unit).title} üben</a></div></details>`:''}
    <nav class="actions" aria-label="Tagesgeschichte umblättern">
      ${page>1?`<a class="secondary" href="${link(comic,page-1)}">${icon('back')} Vorherige Seite</a>`:''}
      ${page<pageCount?`<a class="primary" href="${link(comic,page+1)}">Nächste Seite ${icon('arrow')}</a>`:'<a class="primary" href="#schulgeschichten">Zur Tagesgeschichte</a>'}
    </nav></section><div class="actions"><a class="secondary" href="#baerli">Bärlis Kurzgeschichten</a><a class="secondary" href="#baerli/schrank">Bärlis Schrank</a></div>
  </div>`;
}

function detectiveToday(date=new Date()){

function detectiveArt(episode,index){
  const singlePanel=episode.panelArt?.[index];
  if(singlePanel){
    return `style="background-image:url('${detectiveAsset}${singlePanel}');background-size:100% 100%;background-position:center"`;
  }
  // A small inset removes the seams between neighboring drawings.
  // The last two rows of the window sheet meet 30 pixels above the grid.
  const row=Math.floor(index/4);
  const windowSheet=episode.id==='lesefenster';
  const left=index%4*256+5;
  const top=(windowSheet&&row===5?1250:row*256)+5;
  const bottom=(windowSheet&&row===4?1250:(row+1)*256)-5;
  const width=246;
  const height=bottom-top;
  const x=left*100/(1024-width);
  const y=top*100/(1536-height);
  return `style="background-image:url('${detectiveAsset}${episode.id}.webp');background-size:${102400/width}% ${153600/height}%;background-position:${x}% ${y}%"`;
}

const learningKey='majas-wortwerkstatt-lernweg-v1';
let learning={};
try {
 const value=JSON.parse(localStorage.getItem(learningKey)||'{}');
 if(value&&typeof value==='object'&&!Array.isArray(value))learning=value;
} catch {}
for(const key of ['tasks','reading','writing','speaking','daily','notes']){
 if(!learning[key]||typeof learning[key]!=='object'||Array.isArray(learning[key]))learning[key]={};
}
let learningStorageOk=true;
function saveLearning(){
 try {localStorage.setItem(learningKey,JSON.stringify(learning));learningStorageOk=true;}
 catch {learningStorageOk=false;}
 const status=document.querySelector('#learning-save-status');
 if(status)status.textContent=learningStorageOk?'Auf diesem Gerät gespeichert.':'Speichern ist gerade nicht möglich. Kopiere deinen Text vor dem Verlassen der Seite.';
}
const learningDate=(date=new Date())=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Berlin'}).format(date);
const learningAllTasks=()=>Object.values(questions).flat();
function learningRecord(q,correct){
 const previous=learning.tasks[q.id]||{};
 const attempts=(Number(previous.attempts)||0)+1;
 if(!correct)active.mistakes=(active.mistakes||0)+1;
 learning.tasks[q.id]={
  unit:q.unit,correct,independent:correct&&!active.assisted&&!active.mistakes,
  attempts,assisted:!!active.assisted,day:learningDate(),at:new Date().toISOString()
 };
 saveLearning();
}
function learningTaskStatus(id){
 const result=learning.tasks[id];
 return result?(result.correct?(result.independent?'Selbstständig gelöst':'Mit Hilfe oder nach Korrektur gelöst'):'Noch einmal üben'):progress.has(id)?'Bereits früher gelöst':'Noch offen';
}
function learningSummary(){
 const rows=Object.fromEntries(Object.keys(skillLabels).map(id=>[id,{independent:0,supported:0,retry:0,legacy:0}]));
 for(const q of learningAllTasks()){
  const row=rows[skillByUnit[q.unit]||'sprache'];
  const result=learning.tasks[q.id];
  if(!result){if(progress.has(q.id))row.legacy++;continue;}
  if(!result.correct)row.retry++;
  else if(result.independent)row.independent++;
  else row.supported++;
 }
 return rows;
}

 <div class="actions"><button class="primary">Sprechübung festhalten</button><a class="secondary" href="#lernweg">Zum Tagesplan</a></div></form>${learningSaveStatus()}</section></div>`;

 const save=()=>{learning.speaking[id]={...learning.speaking[id],...capture()};saveLearning();};
 form.oninput=notes.oninput=save;
 form.onsubmit=e=>{e.preventDefault();learning.speaking[id]={...capture(),checked:true,at:learningDate()};saveLearning();};
 const start=document.querySelector('#record-start'),stop=document.querySelector('#record-stop'),status=document.querySelector('#record-status');
 start.onclick=async()=>{
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){status.textContent='Aufnehmen ist in diesem Browser nicht verfügbar. Übe mit einer Zuhörperson.';return;}
  start.disabled=true;
  const current=route;
  try{
   const stream=await navigator.mediaDevices.getUserMedia({audio:true});
   if(route!==current||!document.contains(start)){stream.getTracks().forEach(track=>track.stop());return;}
   learningStream=stream;
   const chunks=[];
   const recorder=new MediaRecorder(stream);
   learningRecorder=recorder;
   recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
   recorder.onstop=()=>{
    stream.getTracks().forEach(track=>track.stop());
    learningStream=null;learningRecorder=null;
    if(!document.contains(start))return;
    if(learningRecordingUrl)URL.revokeObjectURL(learningRecordingUrl);
    learningRecordingUrl=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType||'audio/webm'}));
    const audio=document.querySelector('#speaking-playback');
    audio.src=learningRecordingUrl;audio.hidden=false;
    start.disabled=false;stop.disabled=true;status.textContent='Aufnahme bereit. Höre sie dir an.';
   };
   recorder.onerror=()=>{cleanupLearningMedia();start.disabled=false;stop.disabled=true;status.textContent='Die Aufnahme konnte nicht abgeschlossen werden. Du kannst ohne Aufnahme weiterüben.';};
   recorder.start();stop.disabled=false;status.textContent='Aufnahme läuft. Beende sie mit Aufnahme stoppen.';
  }catch{
   learningStream?.getTracks().forEach(track=>track.stop());learningStream=null;
   if(document.contains(start)){start.disabled=false;status.textContent='Das Mikrofon konnte nicht geöffnet werden. Du kannst mit einer Zuhörperson weiterüben.';}
  }
 };
 stop.onclick=()=>{if(learningRecorder?.state==='recording')learningRecorder.stop();};
}

function setupSpokenTask(index){
 const status=document.querySelector('#task-speech-status');
 document.querySelector('#task-speech').onclick=()=>{
  if(!window.speechSynthesis?.speak||!window.SpeechSynthesisUtterance){status.textContent='Die Gerätestimme ist nicht verfügbar. Nutze die Vorlesevorlage mit einer anderen Person.';return;}
  window.speechSynthesis.cancel();
  const speech=new SpeechSynthesisUtterance(listeningTasks[index].text);
  speech.lang='de-DE';speech.rate=Number(document.querySelector('#task-speech-speed').value);
  const voice=window.speechSynthesis.getVoices().find(v=>v.lang.replace('_','-').startsWith('de-'));
  if(voice)speech.voice=voice;
  speech.onend=()=>{if(document.contains(status))status.textContent='Du kannst die Angaben jetzt prüfen.';};
  speech.onerror=()=>{if(document.contains(status))status.textContent='Die Gerätestimme konnte nicht starten. Nutze die Vorlesevorlage.';};
  learningSpeech=speech;window.speechSynthesis.speak(speech);status.textContent='Der Hörtext wird abgespielt.';
 };
 document.querySelector('#task-speech-stop').onclick=()=>{window.speechSynthesis?.cancel();status.textContent='Gestoppt.';};
}

function learningDaily(){
 const day=learningDate();
 if(!Array.isArray(learning.daily[day])){
  const eligible=learningAllTasks().filter(q=>['rechtschreiben','saetze','textsorten','hoerauftraege'].includes(q.unit));
  const retry=eligible.find(q=>learning.tasks[q.id]&&!learning.tasks[q.id].correct);
  const next=retry||eligible.find(q=>!progress.has(q.id))||eligible.slice().sort((a,b)=>(learning.tasks[a.id]?.at||'').localeCompare(learning.tasks[b.id]?.at||''))[0];
  const writing=writingTasks.find(task=>!learning.writing[task.id]?.reviewed)||writingTasks[bearToday(new Date(),writingTasks.length)];
  const story=annaStories[bearToday(new Date(),6)];
  learning.daily[day]=[
   {kind:'reading',id:story.id,label:'Eine Geschichte laut lesen',href:'#lesetraining/'+story.id},
   {kind:'task',id:next.id,label:retry?'Eine unsichere Aufgabe wiederholen':'Eine Aufgabe mit Bärli lösen',href:'#'+next.unit+'/'+(questions[next.unit].indexOf(next)+1)},
   {kind:'writing',id:writing.id,label:'Ideen sammeln und einen Text schreiben',href:'#schreibwerkstatt/'+writing.id}
  ];
  saveLearning();
 }
 return learning.daily[day];
}
function dailyComplete(item){

 if(item.kind==='reading')return learning.reading[item.id]?.at===learningDate()&&learning.reading[item.id]?.checked;
 return learning.writing[item.id]?.at===learningDate()&&learning.writing[item.id]?.reviewed;
}

function render(initial=false){
  cleanupLearningMedia();
  document.querySelector('#dictation-audio')?.pause();
  document.querySelector('#hearing-audio')?.pause();
  document.querySelector('#anna-audio-player')?.pause();
  active=null;
  syncStars();
  const [page,index,part]=location.hash.slice(1).split('/');
  const unit=unitById(page);
  const number=Number(index);
  const oldRoute=route;
  route=page||'start';
  if(page==='lernweg')showLearningPlan();
  else if(page==='lesetraining')readingTraining(index);
  else if(page==='schreibwerkstatt')writingWorkshop(index);
  else if(page==='sprechwerkstatt')speakingWorkshop(index);
  else if(page==='lernuebersicht'||page==='erwachsene')showLearningOverview(page==='erwachsene');
  else if(page==='fortschritt')showProgress();
  else if(page==='sterne')showStarWallet();
  else if(page==='spiele')showGames(index);
  else if(page==='anna')showAnna(index,part);
  else if(page==='baerli')showBear(index);
  else if(page==='schulgeschichten'||page==='tagescomic'&&schoolComics.some(story=>story.id===index))showSchoolComic(index,part);
  else if(page==='tagescomic')showDetective(index,part);
  else if(page==='kombitest'){
    const test=index===testPart?testParts[index]:null;
    const step=Number(part);
    if(test&&part==='ergebnis'&&quiz.length===test.items.length)showResult(index);
    else if(test&&Number.isInteger(step)&&step===quiz.length+1&&step<=test.items.length)showExercise(null,step,true,index);
    else showCombinationTest();
  }
  else if(page==='quiz'){
    if(testPart){testPart=null;quiz=[];}
    if(index==='ergebnis'&&quiz.length===mixed.length)showResult();
    else if(index&&Number.isInteger(number)&&number===quiz.length+1&&number<=mixed.length)showExercise(null,number,true);
    else showQuiz();
  } else if(unit){
    if(index==='fertig')showEnd(unit);
    else if(Number.isInteger(number)&&number>0&&number<=questions[unit.id].length)showExercise(unit,number,false);
    else showUnit(unit);
  } else {
    if(oldRoute!=='start'&&oldRoute!=='stationen'||!app.querySelector('.hero'))showHome();
    if(page==='stationen'){
      const target=document.querySelector('#stationen');
      target.focus({preventScroll:true});
      target.scrollIntoView({block:'start'});
      return;
    }
  }
  if(!initial){
    window.scrollTo(0,0);
    const heading=app.querySelector('h1');
    heading.setAttribute('tabindex','-1');
    heading.focus({preventScroll:true});
  }
}
document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
document.querySelector('#show-progress').onclick=()=>move('#sterne');
window.addEventListener('hashchange',()=>{if(location.hash!=='#inhalt')render();});
render(true);
</script>
</body>
</html>
