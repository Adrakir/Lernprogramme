<script>

'use strict';
const modules=[
{id:'spine',icon:'🦴',title:'Wirbelsäule',short:'Abschnitte, Wirbel, Bandscheiben und Rückenmark',sub:'Warum ist dein Rücken beweglich und gleichzeitig stabil?',color:'#d5eee6',duration:15,goals:['Die fünf Bereiche der Wirbelsäule benennen','Wirbel, Bandscheiben und Rückenmark unterscheiden','Die doppelte S-Form und ihre Bedeutung erklären'],terms:[['Halswirbelsäule','7 Halswirbel ermöglichen Kopfbewegungen.'],['Brustwirbelsäule','12 Brustwirbel verbinden sich mit den Rippen.'],['Lendenwirbelsäule','5 kräftige Lendenwirbel tragen viel Gewicht.'],['Kreuzbein','Meist 5 miteinander verwachsene Wirbel.'],['Steißbein','Meist 3–5 verwachsene Wirbel.'],['Bandscheibe','Elastischer Puffer zwischen benachbarten beweglichen Wirbeln.'],['Wirbelkanal','Öffnungskanal, in dem das Rückenmark geschützt verläuft.']],facts:[['Der Aufbau','Die Wirbelsäule besteht aus 7 Hals-, 12 Brust- und 5 Lendenwirbeln sowie Kreuzbein und Steißbein. Insgesamt sind es meist 33–34 Wirbel, je nach Anzahl der Steißwirbel.'],['Stoßdämpfer','Zwischen den beweglichen Wirbeln liegen Bandscheiben. Sie verteilen den Druck und federn Stöße ab. Zwischen Schädel und erstem Halswirbel sowie zwischen erstem und zweitem Halswirbel liegen keine Bandscheiben.'],['Warum S-förmig?','Von der Seite bildet die Wirbelsäule eine doppelte S-Form. Zusammen mit Bandscheiben, Bändern und Muskulatur federt sie Erschütterungen ab.'],['Schutz für Nerven','Die Wirbel bilden einen Kanal für das Rückenmark. Zwischen den Wirbeln treten Spinalnerven aus.']],memory:'7 – 12 – 5: Hals, Brust, Lende. Darunter liegen Kreuz- und Steißbein.',mistake:'Die Bandscheibe ist kein Knochen; sie ist ein elastisches Polster zwischen Wirbeln.'},
{id:'bone',icon:'🧩',title:'Knochen',short:'Knochenhaut, Knochenmark und Aufbau des Röhrenknochens',sub:'Ein Knochen lebt: Er wird versorgt, umgebaut und kann heilen.',color:'#f4ebd9',duration:14,goals:['Die Schichten eines Röhrenknochens erkennen','Rotes und gelbes Knochenmark unterscheiden','Die Aufgaben der Knochen erklären'],terms:[['Knochenhaut (Periost)','Hülle mit Blutgefäßen und Nerven; wichtig für Ernährung und Heilung.'],['Kompakta','Dichte, feste Knochenschicht an der Außenseite.'],['Spongiosa','Schwammartig angeordnete Knochenbälkchen; leicht und stabil.'],['Markhöhle','Hohlraum im Schaft eines Röhrenknochens, häufig mit gelbem Knochenmark.'],['Rotes Knochenmark','Bildet Blutzellen; bei Kindern in mehr Knochenbereichen als bei Erwachsenen.'],['Gelenkknorpel','Glatte Schicht über den Gelenkflächen; verringert Reibung.']],facts:[['Fest und trotzdem leicht','Außen ist der Knochen meist kompakt. Innen liegt eine Struktur aus Knochenbälkchen (Spongiosa), die bei wenig Gewicht stabil ist.'],['Versorgung und Wachstum','Blutgefäße versorgen das Knochengewebe. Knochenzellen bauen laufend Knochensubstanz auf und ab.'],['Knochenmark','Rotes Knochenmark bildet Blutzellen. Gelbes Knochenmark enthält besonders viele Fettzellen und befindet sich beim Erwachsenen vor allem in den Markhöhlen langer Röhrenknochen.'],['Aufgaben der Knochen','Knochen geben dem Körper Form, schützen Organe, bilden zusammen mit Muskeln und Gelenken den Bewegungsapparat und speichern Mineralstoffe wie Calcium.']],memory:'Außen fest, innen clever gebaut: Kompakta schützt, Spongiosa spart Gewicht.',mistake:'Blutzellen entstehen im roten Knochenmark – nicht in der Knochenhaut.'},
{id:'joints',icon:'⚙️',title:'Gelenke',short:'Gelenkkopf, Pfanne, Knorpel, Bänder und Gelenktypen',sub:'So werden aus Knochen bewegliche Verbindungen.',color:'#e8e7fa',duration:15,goals:['Ein echtes Gelenk beschriften','Warum Knorpel, Schmiere und Bänder wichtig sind erklären','Vier Gelenktypen passenden Bewegungen zuordnen'],terms:[['Gelenkkopf','Ein meist gewölbtes Knochenende in einem Gelenk.'],['Gelenkpfanne','Passendes Gegenstück, in dem der Gelenkkopf liegt.'],['Gelenkknorpel','Glatte Schicht, die Gelenkflächen schützt.'],['Gelenkspalt','Schmaler Raum zwischen Gelenkflächen, enthält Gelenkschmiere.'],['Gelenkkapsel','Umschließt den Gelenkraum und hält ihn geschlossen.'],['Gelenkbänder','Stabilisieren ein Gelenk und begrenzen Bewegungen.'],['Gelenkschmiere','Flüssigkeit, die Reibung verringert und Knorpel ernährt.']],facts:[['Bauteile','An Gelenkflächen liegt Knorpel. Ein schmaler Gelenkspalt enthält Gelenkschmiere. Gelenkkapsel und Bänder umgeben bzw. stabilisieren das Gelenk.'],['Scharniergelenk','Beispiel: Fingergelenk. Vor allem Beugen und Strecken.'],['Kugelgelenk','Beispiele: Schulter und Hüfte. Bewegungen in viele Richtungen möglich.'],['Sattel- und Drehgelenk','Daumensattelgelenk: Bewegungen in zwei Hauptrichtungen. Drehgelenke ermöglichen Drehbewegungen, z. B. zwischen Atlas und Axis oder im Unterarm.']],memory:'Knorpel schützt, Schmiere verringert Reibung, Bänder stabilisieren.',mistake:'Bänder verbinden Knochen mit Knochen; Sehnen verbinden Muskeln mit Knochen.'},
{id:'muscles',icon:'💪',title:'Muskeln und Hebel',short:'Muskelfasern, Gegenspieler und Kräfte am Hebel',sub:'Wie kann ein Muskel einen Knochen bewegen?',color:'#fce8e4',duration:17,goals:['Die Ebenen eines Skelettmuskels zuordnen','Bizeps und Trizeps als Gegenspieler verstehen','Das Hebelgesetz mit einem Beispiel erkunden'],terms:[['Muskel','Kann sich aktiv zusammenziehen, aber nicht aktiv verlängern.'],['Sehne','Überträgt die Muskelkraft auf den Knochen.'],['Muskelfaserbündel','Gruppe vieler Muskelfasern.'],['Muskelfaser','Lange Muskelzelle, aus deren Zusammenarbeit Muskelkraft entsteht.'],['Beuger','Muskel, der ein Gelenk beugt (z. B. Bizeps beim Ellenbogen).'],['Strecker','Muskel, der ein Gelenk streckt (z. B. Trizeps beim Ellenbogen).'],['Drehachse','Punkt bzw. Linie, um den/die sich ein Hebel dreht.']],facts:[['Vom Großen zum Kleinen','Ein Skelettmuskel setzt sich aus Muskelfaserbündeln zusammen. Jedes Bündel enthält Muskelfasern; darin liegen feinere Myofibrillen mit kontraktilen Filamenten.'],['Gegenspielerprinzip','Beim Beugen des Ellenbogens verkürzt sich vor allem der Bizeps, während der Trizeps nachgibt. Beim Strecken arbeitet vor allem der Trizeps.'],['Hebelwirkung','Ein Hebel dreht sich um eine Drehachse. Bei gleicher Last brauchst du einen kleineren Kraftaufwand, wenn der Kraftarm länger ist: Kraft × Kraftarm = Last × Lastarm (im Gleichgewicht).'],['Gelenke und Hebel','Knochen wirken als Hebel. Der Ansatzpunkt der Muskelsehne liegt oft nahe am Gelenk, daher müssen Muskeln erhebliche Kräfte aufbringen.']],memory:'Ein Muskel kann ziehen, nicht schieben. Beuger und Strecker arbeiten als Team.',mistake:'Ein kurzer Kraftarm spart keine Kraft – ein längerer Kraftarm tut das.'},
];
const questions=[];
function mc(topic,ask,opts,correct,why,hints){questions.push({id:'q'+(questions.length+1),topic,type:'mc',ask,opts,correct,why,hints:hints||[]})}
function multi(topic,ask,opts,correct,why,hints){questions.push({id:'q'+(questions.length+1),topic,type:'multi',ask,opts,correct,why,hints:hints||[]})}
function order(topic,ask,opts,correct,why,hints){questions.push({id:'q'+(questions.length+1),topic,type:'order',ask,opts,correct,why,hints:hints||[]})}
function write(topic,ask,correct,why,hints){questions.push({id:'q'+(questions.length+1),topic,type:'write',ask,correct,why,hints:hints||[]})}
// Wirbelsäule
mc('spine','Wie viele Halswirbel hat der Mensch normalerweise?',['5','7','12','24'],1,'Die Halswirbelsäule besteht aus sieben Halswirbeln.',['Denk an die Zahlenfolge 7–12–5.','Sie hat weniger Wirbel als die Brustwirbelsäule.','Die richtige Zahl ist 7.']);
mc('spine','Was liegt zwischen den meisten beweglichen Wirbeln?',['Gelenkknorpel der Hüfte','Bandscheiben','Knochenmark','Muskelfaserbündel'],1,'Bandscheiben polstern und verteilen den Druck zwischen benachbarten Wirbeln.',['Gesucht ist ein elastischer Stoßdämpfer.','Die Struktur sitzt zwischen den Wirbelkörpern.','Sie heißt Bandscheibe.']);
mc('spine','Welcher Bereich besteht normalerweise aus 12 Wirbeln?',['Halswirbelsäule','Lendenwirbelsäule','Brustwirbelsäule','Steißbein'],2,'Die Brustwirbelsäule hat 12 Brustwirbel.',['Überlege, wo die Rippen ansetzen.','Das ist der mittlere Bereich des Rückens.','Der Name beginnt mit „Brust“.']);
mc('spine','Warum hat die Wirbelsäule eine doppelte S-Form?',['Sie hilft Erschütterungen abzufedern.','Sie macht alle Wirbel unbeweglich.','Sie speichert Luft.','Sie bildet Blutzellen.'],0,'Die Form unterstützt zusammen mit Bandscheiben und Muskeln die Federung des Körpers.',['Denk an Gehen, Rennen oder Springen.','Die Form federt Belastungen ab.','Wähle die Antwort mit Erschütterungen.']);
mc('spine','Was schützt das Rückenmark direkt?',['Ein Kanal aus Wirbeln','Die Knochenhaut eines Röhrenknochens','Die Kniescheibe','Der Bizeps'],0,'Das Rückenmark verläuft geschützt im Wirbelkanal.',['Es liegt im Inneren der Wirbelsäule.','Die Öffnungen der Wirbel bilden einen Kanal.','Gesucht ist der Wirbelkanal.']);
mc('spine','Welche Wirbel sind im Kreuzbein größtenteils miteinander verwachsen?',['Die Halswirbel','Meist fünf Kreuzbeinwirbel','Die zwölf Brustwirbel','Alle Wirbel des Rückens'],1,'Das Kreuzbein entsteht aus meist fünf verwachsenen Kreuzbeinwirbeln.',['Sie sitzen unter den Lendenwirbeln.','Sie sind zum stabilen Knochen verbunden.','Es sind meist fünf Kreuzbeinwirbel.']);
mc('spine','Welche Reihenfolge stimmt von oben nach unten?',['Hals – Brust – Lende – Kreuz – Steiß','Brust – Hals – Steiß – Kreuz – Lende','Lende – Brust – Hals – Steiß – Kreuz','Hals – Kreuz – Brust – Lende – Steiß'],0,'Oben liegt die Halswirbelsäule, unten das Steißbein.',['Beginne am Kopf.','Nach Hals und Brust folgt die Lende.','Zuletzt kommen Kreuzbein und Steißbein.']);
multi('spine','Welche Aussagen sind richtig? Wähle alle richtigen aus.',['Bandscheiben federn Stöße ab.','Alle 33–34 Wirbel sind frei beweglich.','Zwischen Wirbeln treten Nerven aus.','Das Rückenmark liegt im Wirbelkanal.'],[0,2,3],'Verwachsene Wirbel sind nicht einzeln frei beweglich. Bandscheiben, Nerven und Wirbelkanal sind wichtig.',['Eine Aussage über alle Wirbel ist zu allgemein.','Kreuzbein und Steißbein bestehen aus verwachsenen Wirbeln.','Richtig sind Aussagen 1, 3 und 4.']);
write('spine','Wie heißt der elastische Puffer zwischen benachbarten Wirbeln?',['bandscheibe','bandscheiben'],'Die Bandscheibe nimmt Druck auf und hilft bei der Federung.',['Sie ist kein Knochen.','Sie besteht aus Knorpelgewebe und einem weichen Kern.','Das Wort beginnt mit „Band“.']);
mc('spine','Welcher Teil ist mit fünf kräftigen Wirbeln besonders an der Lastaufnahme beteiligt?',['Halswirbelsäule','Brustwirbelsäule','Lendenwirbelsäule','Steißbein'],2,'Die fünf kräftigen Lendenwirbel tragen einen großen Teil des Oberkörpergewichts.',['Suche den unteren Bereich des beweglichen Rückens.','Er liegt oberhalb des Kreuzbeins.','Gesucht ist die Lendenwirbelsäule.']);
// Knochen
mc('bone','Was bildet hauptsächlich Blutzellen?',['Gelbes Knochenmark','Rotes Knochenmark','Gelenkknorpel','Knochenhaut'],1,'Im roten Knochenmark werden Blutzellen gebildet.',['Der Ort liegt im Inneren einiger Knochen.','Die Farbe ist wichtig.','Rot = Blutbildung.']);
mc('bone','Wie heißt die feste äußere Knochenschicht?',['Spongiosa','Kompakta','Bandscheibe','Gelenkschmiere'],1,'Die Kompakta bildet die dichte, feste Außenschicht.',['Denke an eine stabile Hülle.','Im Gegensatz zur schwammartigen Spongiosa ist sie dicht.','Das Fachwort lautet Kompakta.']);
mc('bone','Woraus besteht die Spongiosa?',['Dicht gepackter Haut','Knochenbälkchen','Nur Knorpel','Nur Fett'],1,'Die Spongiosa ist ein Netz aus Knochenbälkchen.',['Sie ist schwammartig gebaut.','Die kleinen Streben heißen ...','Knochenbälkchen.']);
mc('bone','Welche Aufgabe hat die Knochenhaut?',['Sie enthält Blutgefäße und Nerven.','Sie bildet die Gelenkschmiere.','Sie ersetzt das Rückenmark.','Sie zieht sich wie ein Muskel zusammen.'],0,'Die Knochenhaut versorgt und schützt den Knochen und ist an der Heilung beteiligt.',['Sie umgibt den Knochen außen.','Sie ist schmerzempfindlich und gut durchblutet.','Blutgefäße und Nerven sind enthalten.']);
mc('bone','Welche Struktur schützt die Knochenenden im Gelenk vor zu starker Reibung?',['Knochenmark','Gelenkknorpel','Sehne','Wirbelkanal'],1,'Gelenkknorpel überzieht die Gelenkflächen und verringert Reibung.',['Denke an eine glatte Schutzschicht.','Sie liegt dort, wo Knochen im Gelenk aufeinandertreffen.','Gelenkknorpel ist richtig.']);
multi('bone','Welche Aufgaben haben Knochen?',['Organe schützen','Als Mineralstoffspeicher dienen','Direkt Luft in die Lunge pumpen','Dem Körper Halt geben'],[0,1,3],'Knochen geben Halt, schützen Organe und speichern Mineralstoffe. Sie sind keine Atemmuskeln.',['Denk an Schädel, Brustkorb und Skelett.','Calcium steckt im Knochen.','Richtig sind 1, 2 und 4.']);
mc('bone','Warum ist Knochen trotz seiner Festigkeit oft relativ leicht?',['Weil er im Inneren Hohlräume und Knochenbälkchen besitzt.','Weil er nur aus Wasser besteht.','Weil er keine Mineralstoffe enthält.','Weil er vollständig hohl und ohne Gewebe ist.'],0,'Spongiosa und Markhöhlen machen Knochen leichter, ohne seine Tragfähigkeit stark zu verringern.',['Betrachte das Innere eines Röhrenknochens.','Dort gibt es eine besondere Balkenstruktur.','Die Antwort erwähnt Hohlräume und Knochenbälkchen.']);
mc('bone','Was ist in der Markhöhle eines langen Röhrenknochens beim Erwachsenen oft enthalten?',['Luft','Gelbes Knochenmark','Rückenmark','Gelenkschmiere'],1,'In der Markhöhle findet man häufig gelbes, fettreiches Knochenmark.',['Gesucht ist keine Luft.','Das Gewebe enthält viele Fettzellen.','Es heißt gelbes Knochenmark.']);
write('bone','Wie heißt die schwammartige Struktur im Inneren des Knochens?',['spongiosa'],'Spongiosa ist die schwammartige Knochenstruktur aus Knochenbälkchen.',['Sie liegt unter der dichten Knochenschicht.','Ihr Name stammt vom lateinischen Wort für Schwamm.','Das Wort beginnt mit „Spon“.']);
mc('bone','Was geschieht im Knochengewebe ständig?',['Es bleibt lebenslang vollkommen unverändert.','Es wird auf- und abgebaut.','Es verwandelt sich vollständig in Sehnen.','Es wird nie durchblutet.'],1,'Knochen sind lebendes Gewebe und werden regelmäßig umgebaut.',['Denk an Wachstum und Heilung.','Knochenzellen verändern das Gewebe.','Aufbau und Abbau finden beide statt.']);
// Gelenke
mc('joints','Was verbindet ein Band im Bewegungsapparat in der Regel?',['Muskel mit Haut','Knochen mit Knochen','Knochen mit Luft','Zwei Muskelfasern'],1,'Bänder verbinden Knochen und stabilisieren Gelenke.',['Verwechsle Band nicht mit Sehne.','Sehnen verbinden Muskel mit Knochen.','Bänder verbinden Knochen mit Knochen.']);
mc('joints','Wozu dient Gelenkschmiere?',['Sie bildet Knochenmark.','Sie verringert Reibung im Gelenk.','Sie ist eine Art Muskel.','Sie ersetzt alle Bänder.'],1,'Gelenkschmiere unterstützt die reibungsarme Bewegung und versorgt den Gelenkknorpel.',['Sie befindet sich im Gelenkspalt.','Ähnlich wie Schmiermittel macht sie Bewegung leichter.','Sie verringert Reibung.']);
mc('joints','Welches Gelenk ist ein typisches Kugelgelenk?',['Schulter','Fingermittelgelenk','Schädelnaht','Zahnwurzel'],0,'Das Schultergelenk ist ein Kugelgelenk und erlaubt viele Bewegungsrichtungen.',['Kannst du den Arm kreisen?','Bei dieser Verbindung sind viele Richtungen möglich.','Die Schulter ist richtig.']);
mc('joints','Welches Gelenk erlaubt vor allem Beugen und Strecken?',['Sattelgelenk','Scharniergelenk','Kugelgelenk','Starre Knochennaht'],1,'Das Scharniergelenk führt Bewegungen ähnlich wie ein Türscharnier aus.',['Stell dir eine Tür vor.','Eine Tür bewegt sich nur um eine Achse.','Es heißt Scharniergelenk.']);
mc('joints','Welches Gelenk ist ein Beispiel für ein Sattelgelenk?',['Daumensattelgelenk','Kniegelenk','Schultergelenk','Schädelnaht'],0,'Am Daumen ermöglicht das Sattelgelenk Bewegungen in zwei Hauptrichtungen.',['Du brauchst es zum Greifen.','Gesucht ist ein Gelenk an der Hand.','Es sitzt an der Daumenwurzel.']);
mc('joints','Welche Struktur umschließt den Gelenkraum?',['Gelenkkapsel','Knochenmark','Rückenmark','Muskelfaser'],0,'Die Gelenkkapsel umhüllt den Gelenkraum.',['Sie klingt wie eine Hülle.','Im Namen steckt „Kapsel“.','Gelenkkapsel ist die Lösung.']);
multi('joints','Was trifft auf ein echtes Gelenk zu?',['Die Gelenkflächen sind mit Knorpel bedeckt.','Im Gelenkspalt liegt Gelenkschmiere.','Bänder können das Gelenk stabilisieren.','Das Gelenk besteht nur aus Muskelfasern.'],[0,1,2],'Knorpel, Schmierflüssigkeit und stabilisierende Bänder spielen wichtige Rollen.',['Denke an glatte Flächen und Halt.','Muskelfasern sind keine Gelenkflächen.','Richtig sind 1, 2, 3.']);
mc('joints','Welcher Gelenktyp ermöglicht Drehbewegungen um eine Achse?',['Drehgelenk','Scharniergelenk','Sattelgelenk','Kein Gelenk'],0,'Drehgelenke ermöglichen Rotationsbewegungen, etwa zwischen bestimmten Halswirbeln.',['Im Namen steckt die Bewegung.','Gesucht ist die Rotation.','Drehgelenk ist richtig.']);
write('joints','Wie heißt die glatte Schutzschicht auf den Gelenkflächen?',['gelenkknorpel','knorpel'],'Der Gelenkknorpel vermindert Reibung und verteilt Belastungen.',['Sie liegt direkt an den Knochenenden.','Sie ist kein Band.','Gelenk + Knorpel.']);
mc('joints','Warum dürfen Gelenkbänder nicht beliebig weit gedehnt werden?',['Sie verhindern jede Bewegung.','Sie begrenzen und sichern die Gelenkbewegung.','Sie bilden Knochenzellen.','Sie erzeugen Gelenkschmiere.'],1,'Bänder stabilisieren Gelenke und schützen vor übermäßigen Bewegungen.',['Denke an einen Sicherheitsgurt.','Bänder sollen zu starke Bewegungen verhindern.','Sie begrenzen und sichern Bewegungen.']);
// Muskeln / Hebel
mc('muscles','Woraus besteht ein Muskel unter anderem?',['Nur aus einem festen Knochen','Aus Muskelfaserbündeln','Nur aus Knochenmark','Aus Wirbeln'],1,'Skelettmuskeln bestehen aus vielen Muskelfaserbündeln.',['Kleine Muskelstrukturen sind zu Gruppen zusammengefasst.','Das Wort enthält „Faser“.','Es sind Muskelfaserbündel.']);
mc('muscles','Was verbindet eine Sehne?',['Muskel und Knochen','Zwei Wirbelkanäle','Haut und Haare','Zwei Knochen als Band'],0,'Sehnen übertragen Muskelkräfte auf Knochen.',['Sehnen sind keine Bänder.','Sie leiten die Zugkraft des Muskels weiter.','Muskel und Knochen.']);
mc('muscles','Welcher der genannten Muskeln beugt den Ellenbogen?',['Bizeps','Trizeps','Wadenmuskel','Zwerchfell'],0,'Der Bizeps ist ein wichtiger Ellenbogenbeuger. Auch der Oberarmmuskel (Brachialis) beteiligt sich an der Beugung.',['Denk an das Anspannen des Oberarms.','Der Muskel sitzt vorne am Oberarm.','Der Bizeps.']);
mc('muscles','Wie arbeiten Beuger und Strecker zusammen?',['Beide ziehen immer gleichzeitig gleich stark.','Sie sind Gegenspieler mit unterschiedlichen Aufgaben.','Beide können nur schieben.','Nur Knochen arbeiten.'],1,'Muskeln können aktiv ziehen. Deshalb bewegen Gegenspieler ein Gelenk in entgegengesetzte Richtungen.',['Ein Muskel zieht – er schiebt nicht.','Zum Rückweg braucht es einen anderen Muskel.','Sie arbeiten als Gegenspieler.']);
mc('muscles','Was erleichtert es, eine Last mit einem Hebel zu heben?',['Ein kürzerer Kraftarm','Ein längerer Kraftarm','Ein schwererer Hebel ohne Änderung','Das Entfernen der Drehachse'],1,'Bei gleicher Last sinkt die erforderliche Kraft, wenn der Kraftarm länger wird.',['Denk an einen langen Schraubenschlüssel.','Mehr Abstand zur Drehachse verbessert die Hebelwirkung.','Der längere Kraftarm spart Kraft.']);
mc('muscles','Was ist die Drehachse bei einem Hebel?',['Die Richtung der Luft','Die Stelle, um die sich der Hebel dreht','Das Knochenmark','Die stärkste Sehne'],1,'Ein Hebel dreht sich um einen Drehpunkt bzw. eine Drehachse.',['Denk an die Mitte einer Wippe.','Sie ist der feste Punkt für die Drehbewegung.','Die Stelle, um die sich der Hebel dreht.']);
multi('muscles','Welche Aussagen über Muskeln sind richtig?',['Muskeln können sich aktiv verkürzen.','Sehnen übertragen Kräfte auf Knochen.','Muskeln schieben Knochen direkt weg.','Ein Muskel besteht aus zahlreichen Muskelfasern.'],[0,1,3],'Muskeln erzeugen Zugkräfte und bestehen aus vielen Fasern.',['Ein Muskel kann ziehen, aber nicht aktiv schieben.','Sehnen gehören zum Kraftweg.','Richtig sind 1, 2 und 4.']);

 {id:'life',icon:'🌱',title:'Kennzeichen der Lebewesen',short:'Stoffwechsel, Wachstum, Reize, Bewegung und Fortpflanzung',sub:'Warum lebt eine Bohnenpflanze – und ein Roboter nicht?',color:'#dff1d9',duration:19,

 facts:[['Lebendig oder nicht?','Lebewesen bestehen aus Zellen. Sie betreiben Stoffwechsel, wachsen und entwickeln sich, reagieren auf Reize, können sich bewegen und als Art fortpflanzen. Diese Merkmale werden zusammen betrachtet.'],['Auch Pflanzen bewegen sich','Eine Bohnenpflanze kann zum Licht hin wachsen; Blätter können sich ausrichten. Pflanzen bewegen sich oft so langsam, dass man es erst nach Stunden oder Tagen bemerkt.'],['Ein Kennzeichen reicht nicht aus','Auch eine Flamme vergrößert sich und ein Auto fährt. Trotzdem bestehen sie nicht aus lebenden Zellen und zeigen keinen eigenen biologischen Stoffwechsel.'],['Was ist mit Samen?','Ein ruhender Samen ist lebendig, auch wenn man gerade kein Wachstum sieht. Unter passenden Bedingungen kann er keimen.'],['Was ist mit Robotern?','Roboter können fahren und auf Sensoren reagieren. Sie bestehen aber nicht aus Zellen und besitzen keinen biologischen Stoffwechsel.']],

function lifeLab(){return `<div class="two-col"><section class="panel"><h2>🌞 Das Pflanzen-Labor</h2><p>Verändere die Entwicklungsstufe und den Lichteinfall. Beobachte, wie das Modell der Bohnenpflanze reagiert.</p><div class="illust-frame">${lifeSvg()}</div><div class="inputGroup"><label for="plantStage">Entwicklung: <strong id="plantStageValue"></strong></label><input id="plantStage" type="range" min="0" max="8" step="1" value="${ui.plantStage}" data-input="plantStage" aria-label="Entwicklungsstufe der Pflanze 0 bis 8"></div><div class="button-row"><button class="btn secondary small" data-action="lightSide" data-id="left">☀ Licht von links</button><button class="btn secondary small" data-action="lightSide" data-id="right">☀ Licht von rechts</button></div><div class="keynote" id="plantInfo" role="status"></div></section><section class="panel"><h2>🔍 Beobachte und begründe</h2><div class="concept"><b>Was wächst zuerst?</b><p>Ein trockener Samen nimmt Wasser auf. Anschließend entstehen Wurzel und Spross. Später bilden sich Blätter.</p></div><div class="concept"><b>Warum richtet sich die Pflanze zum Licht?</b><p>Wachstumsprozesse können dafür sorgen, dass sich der Spross über längere Zeit zum Licht hin krümmt. Das ist eine Reaktion auf einen Reiz.</p></div><div class="concept"><b>Grenze des Modells</b><p>Die Darstellung beschleunigt die Entwicklung stark. Pflanzen ändern ihre Richtung nicht augenblicklich, wenn man eine Lichtquelle verschiebt.</p></div><div class="misconception"><b>Denkfrage:</b> Ein Roboter kann sich bewegen. Welche biologischen Merkmale unterscheiden ihn trotzdem von einer Pflanze?</div><button class="btn" data-go="practice/life">Pflanzenwissen prüfen →</button></section></div>`}

function modelLab(){return `<div class="two-col"><section class="panel"><h2>🧱 Belastbarkeit untersuchen</h2><p>Vollstab und Hohlrohr besitzen im <b>vereinfachten Gedankenmodell</b> dieselbe Materialmenge, dasselbe Material und dieselbe Länge. Sie unterscheiden sich in der Materialverteilung.</p><div class="illust-frame">${modelSvg()}</div><div class="inputGroup"><label for="modelLoad">Gleiche Last für beide Modelle: <strong id="modelLoadValue"></strong></label><input id="modelLoad" type="range" data-input="modelLoad" min="0" max="100" step="5" value="${ui.modelLoad}"></div><div class="keynote" id="modelInfo" role="status"></div></section><section class="panel"><h2>🧪 Versuche wie Forschende</h2><div class="concept"><b>1. Frage</b><p>Welchen Einfluss hat die Verteilung des Materials auf die Biegesteifigkeit?</p></div><div class="concept"><b>2. Vermutung</b><p>Ein weiter außen liegender Materialmantel könnte sich bei gleicher Materialmenge weniger durchbiegen.</p></div><div class="concept"><b>3. Fair vergleichen</b><p>Halte Material, Materialmenge, Länge, Auflager und Belastung gleich. Ändere gezielt die Querschnittsform.</p></div><div class="concept"><b>4. Ergebnis deuten</b><p>Das Modell beschreibt nur die Biegung eines vereinfachten Balkens. Bei einem echten Knochen wirken Gewebeaufbau, Knochenbälkchen und viele weitere Bedingungen mit.</p></div><div class="misconception"><b>Achtung:</b> Das Modell liefert keine echten Messwerte. Dünne Rohre können beispielsweise einknicken. „Hohl ist immer stärker“ wäre eine falsche Schlussfolgerung.</div><button class="btn" data-go="practice/models">Modellfragen üben →</button></section></div>`}

function seededShuffle(a,seed){const arr=[...a];let x=seed>>>0;for(let i=arr.length-1;i>0;i--){x=(1664525*x+1013904223)>>>0;const j=x%(i+1);[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function randomShuffle(a){const out=[...a];for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}

function leverView(){return `<div class="two-col equal"><div class="panel"><h2>⚖️ Das Hebel-Labor</h2><p>Bewege den Kraftarm und beobachte, wie sich die benötigte Kraft verändert. Wir nehmen einen idealen Hebel ohne Reibung an.</p><svg viewBox="0 0 430 195" role="img" aria-label="Interaktive Wippe mit Drehachse, Krafteinwirkung links und Last rechts" class="illustration" style="min-height:150px"><line x1="40" y1="101" x2="392" y2="101" stroke="#618eac" stroke-width="12" stroke-linecap="round"/><path d="M207 110 L188 170 L226 170 Z" fill="#e1ad68" stroke="#ac875f" stroke-width="3"/><rect x="40" y="77" width="36" height="17" rx="3" fill="#e58d79"/><path d="M57 19 L57 72" stroke="#cb5a4d" stroke-width="7"/><path d="M43 57 L57 75 L71 57" fill="none" stroke="#cb5a4d" stroke-width="7" stroke-linecap="round"/><rect x="344" y="62" width="37" height="34" rx="5" fill="#9bbd85"/><path d="M363 26 L363 62" stroke="#6f9358" stroke-width="7"/><path d="M349 48 L363 63 L377 48" fill="none" stroke="#6f9358" stroke-width="6"/><text x="50" y="185" font-size="12" fill="#69807f">Kraftarm</text><text x="298" y="185" font-size="12" fill="#69807f">Lastarm</text><text x="206" y="186" font-size="12" text-anchor="middle" fill="#69807f">Drehachse</text></svg><div class="inputGroup"><label for="forceArm">Kraftarm: <strong id="forceArmValue">${ui.forceArm} cm</strong></label><input id="forceArm" data-input="forceArm" type="range" class="range" min="10" max="100" step="5" value="${ui.forceArm}"></div><div class="inputGroup"><label for="loadArm">Lastarm: <strong id="loadArmValue">${ui.loadArm} cm</strong></label><input id="loadArm" data-input="loadArm" type="range" class="range" min="5" max="50" step="5" value="${ui.loadArm}"></div><div class="inputGroup"><label for="loadForce">Last: <strong id="loadForceValue">${ui.loadForce} N</strong></label><input id="loadForce" data-input="loadForce" type="range" class="range" min="5" max="100" step="5" value="${ui.loadForce}"></div><div class="keynote" id="leverResult"></div></div><div class="panel"><h2>So wird gerechnet</h2><div class="concept"><b>Hebelgesetz im Gleichgewicht</b><p>Kraft × Kraftarm = Last × Lastarm</p></div><p>Die Kraft wird kleiner, wenn du weiter von der Drehachse entfernt angreifst – bei gleichbleibender Last und gleichbleibendem Lastarm.</p><div class="misconception"><b>Genau hinschauen:</b> Eine längere Strecke für deine Hand ist der Preis für die Kraftersparnis. Die Last selbst wird nicht leichter.</div><div style="margin-top:18px" class="button-row"><button class="btn" data-action="tab" data-id="practice">Fragen dazu üben →</button></div></div></div>`}
function recalcLever(){const res=document.getElementById('leverResult');if(!res)return;for(const [id,value,suffix] of [['forceArm',ui.forceArm,' cm'],['loadArm',ui.loadArm,' cm'],['loadForce',ui.loadForce,' N']]){const span=document.getElementById(id+'Value');if(span)span.textContent=value+suffix}const force=ui.loadForce*ui.loadArm/ui.forceArm;res.innerHTML=`<b>Benötigte Kraft: ${fmt(force)} N</b><br>${fmt(ui.loadForce)} N × ${ui.loadArm} cm ÷ ${ui.forceArm} cm = <b>${fmt(force)} N</b>. ${ui.forceArm>=ui.loadArm?'Dein Kraftarm ist mindestens so lang wie der Lastarm.':'Dein Kraftarm ist kürzer: Du brauchst mehr Kraft als die Last groß ist.'}`}
function startQuiz(mode,topic,navigate=true){let selected=[];if(mode==='topic')selected=questions.filter(q=>q.topic===topic);else if(mode==='assess')selected=modules.flatMap(m=>seededShuffle(questions.filter(q=>q.topic===m.id),seededNum('assess'+m.id)).slice(0,2));else if(mode==='daily')selected=seededShuffle(questions,seededNum(dateKey())).slice(0,4);else if(mode==='weak'){const weak=questions.filter(q=>state.attempts[q.id]&&state.attempts[q.id].lastCorrect===false);selected=weak.length?randomShuffle(weak).slice(0,12):randomShuffle(questions.filter(q=>!state.mastered[q.id])).slice(0,12);if(!selected.length)selected=randomShuffle(questions).slice(0,12)}else selected=randomShuffle(questions).slice(0,12);ui.quiz={route:mode==='topic'?'practice/'+topic:mode,mode,topic,questions:selected,index:0,answers:[],current:{selected:[],order:[],text:'',checked:false,hint:0},finished:false};if(navigate)route(ui.quiz.route)}
function quizLabel(mode){return ({topic:'Thementraining',assess:'Lernstandserhebung',daily:'Tages-Challenge',weak:'Gezieltes Wiederholen',mix:'Gemischte Übung'})[mode]||'Training'}
function quizPage(){const q=ui.quiz;if(!q)return home();if(q.finished)return resultsView();const item=q.questions[q.index],c=q.current;const progress=Math.round(q.index/q.questions.length*100);let input='';if(item.type==='mc'||item.type==='multi'){input=`<div class="answers" role="group" aria-label="Antwortmöglichkeiten">${item.opts.map((s,i)=>{const correctAnswer=item.type==='mc'?i===item.correct:item.correct.includes(i);return `<button type="button" class="answer ${c.selected.includes(i)?'selected':''} ${c.checked&&correctAnswer?'correct':''} ${c.checked&&c.selected.includes(i)&&!correctAnswer?'incorrect':''}" data-action="answer" data-index="${i}" ${c.checked?'disabled':''}><span class="answer-letter">${item.type==='multi'?'☐':'○'}</span>${esc(s)}</button>`}).join('')}</div>${item.type==='multi'?'<span class="smallnote">Mehrere Antworten können richtig sein.</span>':''}`;}

if(item.type==='order'){input=`<div class="keynote"><b>Deine Reihenfolge:</b> ${c.order.length?c.order.map(i=>esc(item.opts[i])).join(' → '):'Noch nichts ausgewählt'}</div><div class="tokenRow">${item.opts.map((s,i)=>`<button type="button" class="token ${c.order.includes(i)?'active':''}" data-action="orderToken" data-index="${i}" ${c.order.includes(i)||c.checked?'disabled':''}>${esc(s)}</button>`).join('')}</div>${!c.checked?'<button class="btn small plain" data-action="undoOrder">↶ Letzten Schritt zurück</button>':''}`}
if(item.type==='write')input=`<label for="quiztext" class="smallnote">Deine Antwort (Fachwort):</label><div style="margin-top:8px"><input id="quiztext" class="textinput" type="text" autocomplete="off" spellcheck="false" placeholder="Fachwort eingeben …" value="${esc(c.text)}" ${c.checked?'disabled':''}></div><span class="smallnote">Groß- und Kleinschreibung ist egal.</span>`;
const feedback=c.checked?`<div class="feedback ${c.isCorrect?'':'bad'}" role="status"><b>${c.isCorrect?'✓ Richtig erkannt!':'↗ Gute Gelegenheit zum Lernen!'}</b><p>${esc(item.why)}</p>${!c.isCorrect?`<p><b>Musterlösung:</b> ${esc(answerText(item))}</p>`:''}</div>`:'';
return `<div class="quizframe"><div class="quizhead"><div><span class="kicker">${esc(quizLabel(q.mode))}</span><h1 style="font-size:1.6rem;margin:0">${q.mode==='topic'?esc(topicById(q.topic).title):esc(quizLabel(q.mode))}</h1></div><button class="btn small secondary" data-action="leaveQuiz">Beenden ✕</button></div><div class="progressbar" aria-label="${progress} Prozent abgeschlossen" style="margin:0 0 9px"><span style="width:${progress}%"></span></div><div class="smallnote" style="margin-bottom:13px">Aufgabe ${q.index+1} von ${q.questions.length} · Thema: ${esc(topicById(item.topic).title)}</div><div class="questionCard"><div class="quizhead"><span class="pill">${{mc:'Eine Antwort',multi:'Mehrere Antworten',order:'Richtig ordnen',write:'Fachwort schreiben'}[item.type]}</span><button class="btn small plain" data-action="speak" data-text="${esc(item.ask+' '+(item.opts||[]).join('. '))}">🔊</button></div><div class="question">${esc(item.ask)}</div>${input}${c.hint>0?`<div class="helpbox"><b>💡 Hilfe ${c.hint} von 3:</b> ${esc(item.hints[c.hint-1]||item.why)}</div>`:''}${feedback}<div class="quizfooter"><div class="actions">${!c.checked?`<button class="btn secondary small" data-action="hint">💡 Hilfe ${c.hint}/3</button><button class="btn warn small" data-action="solution">👁 Musterlösung</button>`:''}</div><div class="actions">${!c.checked?`<button class="btn" data-action="checkAnswer">Antwort prüfen →</button>`:`<button class="btn" data-action="nextQuestion">${q.index+1===q.questions.length?'Ergebnis anzeigen':'Nächste Aufgabe'} →</button>`}</div></div></div></div>`}
function norm(t){return String(t).toLocaleLowerCase('de-DE').replace(/[.,!?;:]/g,'').replace(/\s+/g,' ').trim()}
function answerText(q){return q.type==='mc'?q.opts[q.correct]:q.type==='multi'?q.correct.map(i=>q.opts[i]).join('; '):q.type==='order'?q.correct.map(i=>q.opts[i]).join(' → '):q.correct[0]}
function checkAnswer(giveSolution=false){
 const quiz=ui.quiz;if(!quiz||quiz.finished)return;
 const q=quiz.questions[quiz.index],c=quiz.current;if(c.checked)return;
 let ok=false;
 if(q.type==='mc')ok=c.selected[0]===q.correct;
 else if(q.type==='multi')ok=q.correct.length===c.selected.length&&q.correct.every(v=>c.selected.includes(v));
 else if(q.type==='order')ok=q.correct.join(',')===c.order.join(',');
 else ok=q.correct.some(t=>norm(t)===norm(c.text));
 if(!giveSolution){const empty=q.type==='write'?!c.text.trim():q.type==='order'?c.order.length!==q.opts.length:c.selected.length===0;
  if(empty){toast(q.type==='order'?'Bitte alle Begriffe in die richtige Reihenfolge bringen.':'Bitte zuerst eine Antwort auswählen.');return}
 }else ok=false;
 c.checked=true;c.isCorrect=ok;
 const assisted=ok&&c.hint>0;
 const a=state.attempts[q.id]||{total:0,correct:0,wrong:0};
 a.total++;if(ok)a.correct++;else a.wrong++;
 // Nur eine selbstständig richtige Antwort weist sichere Beherrschung nach.
 a.lastCorrect=ok&&!assisted;
 a.lastAssisted=assisted;
 if(ok&&!assisted){
   if(!state.mastered[q.id]){
     state.mastered[q.id]=true;
     if(!state.starredQuestions.includes(q.id)){state.starredQuestions.push(q.id);addStars(2);toast('⭐ +2 Sterne! Ohne Hilfe sicher gelöst.')}
     else toast('Sehr gut! Jetzt ohne Hilfe richtig gelöst.')
   }else toast('Richtig! Ohne Hilfe wiederholt.');
 }else if(assisted){delete state.mastered[q.id];toast('Richtig mit Hilfe. Bald üben wir die Frage noch einmal.');}
 else{delete state.mastered[q.id];toast('Mit der Erklärung kannst du den nächsten Versuch schaffen.');}
 state.attempts[q.id]=a;
 quiz.answers.push({id:q.id,topic:q.topic,correct:ok,assisted,hints:c.hint,gaveUp:giveSolution}); window.LernCockpit?.record({id:q.id,topic:q.topic,correct:ok,assisted:assisted||giveSolution,mode:quiz.mode,skill:q.type==='write'?'erklären':quiz.mode==='assess'?'anwenden':'wissen'});
 persist();render();
}
function nextQuestion(){if(!ui.quiz?.current.checked)return;ui.quiz.index++;if(ui.quiz.index>=ui.quiz.questions.length){ui.quiz.finished=true;const x=ui.quiz;const score=x.answers.filter(a=>a.correct).length;state.results.push({date:new Date().toISOString(),mode:x.mode,topic:x.topic,score,total:x.questions.length,answers:x.answers});if(state.results.length>60)state.results=state.results.slice(-60);if(x.mode==='daily'&&!state.dailyDates.includes(dateKey())){state.dailyDates.push(dateKey());addStars(score===4?5:2)}if(score===x.questions.length&&score>=4){const rewardKey=x.mode+':'+(x.topic||'alle')+':'+dateKey();state.perfectAwards=Array.isArray(state.perfectAwards)?state.perfectAwards:[];if(!state.perfectAwards.includes(rewardKey)){state.perfectAwards.push(rewardKey);addStars(3)}}persist();giveBadges()}else ui.quiz.current={selected:[],order:[],text:'',checked:false,hint:0};render()}
function giveBadges(){const gifts=[['erste-schritte',allAttempts()>=1,'🌱'],['forscher',masteredCount()>=15,'🔎'],['wissensprofi',masteredCount()>=35,'🧠'],['bioheld',masteredCount()>=80,'🦴'],['ausdauer',state.results.length>=3,'🏅'],['challenges',state.dailyDates.length>=3,'☀️']];for(const [id,earned,icon] of gifts)if(earned&&!state.badges.includes(id)){state.badges.push(id);toast(icon+' Neues Abzeichen freigeschaltet!')}persist()}
function resultsView(){const q=ui.quiz;const right=q.answers.filter(a=>a.correct).length;const pct=Math.round(right/q.questions.length*100);const by=modules.map(m=>{const arr=q.answers.filter(a=>a.topic===m.id);return {id:m.id,count:arr.length,right:arr.filter(a=>a.correct).length}}).filter(x=>x.count);const needs=by.filter(x=>x.right<x.count);return `<div class="quizframe"><div class="results"><span class="kicker">Dein Ergebnis · ${esc(quizLabel(q.mode))}</span><div class="resultscore">${right} / ${q.questions.length}</div><h1>${pct>=85?'Starke Leistung!':pct>=60?'Du bist auf einem guten Weg!':'Hier kannst du noch sicherer werden.'}</h1><p>${pct>=85?'Du kennst viele Begriffe und Zusammenhänge bereits.':'Schau dir die Themen mit Fehlern erneut an. Das ist der schnellste Weg zu mehr Sicherheit.'}</p><div class="progressbar"><span style="width:${pct}%"></span></div><h2 style="margin-top:24px">Rückmeldung zu deinen Themen</h2>${by.map(x=>`<div class="scoreline"><span><b>${topicById(x.id).icon} ${esc(topicById(x.id).title)}</b><br>${x.right} von ${x.count} richtig</span><button class="btn small secondary" data-go="learn/${x.id}">${x.right===x.count?'Vertiefen':'Wiederholen'} →</button></div>`).join('')}<div class="button-row" style="margin-top:20px"><button class="btn" data-go="${needs.length?'weak':'mix'}">${needs.length?'Schwierige Themen üben':'Neue Mischung üben'} →</button><button class="btn secondary" data-go="progress">Meine Entwicklung</button><button class="btn plain" data-go="home">Übersicht</button></div></div></div>`}
function getAward(){const all=[['erste-schritte','🌱','Erster Schritt',allAttempts()>=1],['forscher','🔎','Neugieriger Forscher',masteredCount()>=15],['wissensprofi','🧠','Wissensprofi',masteredCount()>=35],['bioheld','🦴','Bewegungsexperte',masteredCount()>=80],['ausdauer','🏅','Drangeblieben',state.results.length>=3],['challenges','☀️','Drei Challenge-Tage',state.dailyDates.length>=3],['skelettexperte','🩻','Knochen-Detektiv',state.badges.includes('skelettexperte')]];return all}
function progress(){const latest=state.results.filter(r=>(!r.topic||!!topicById(r.topic))&&r.answers?.every(a=>!!topicById(a.topic))).reverse().slice(0,8);return `<div class="learninghead"><div><span class="kicker">Dein persönlicher Lernweg</span><h1>🏅 Fortschritt und Urkunden</h1><p>Hier siehst du, was du schon kannst und was du als Nächstes üben solltest.</p></div><button class="btn small secondary" data-go="home">← Zur Übersicht</button></div><div class="statrow"><div class="stat"><small>STERNE</small><b>${state.stars} ⭐</b></div><div class="stat"><small>AUFGABEN</small><b>${masteredCount()}/${questions.length}</b></div><div class="stat"><small>TESTS</small><b>${state.results.length}</b></div></div><div class="sectiontop"><h2>Deine Fähigkeiten</h2></div><section class="panel">${modules.map(m=>`<div style="margin-bottom:17px"><div style="display:flex;justify-content:space-between"><b>${m.icon} ${esc(m.title)}</b><small>${moduleProgress(m.id)} %</small></div><div class="progressbar" style="margin-top:5px"><span style="width:${moduleProgress(m.id)}%"></span></div></div>`).join('')}<div class="button-row"><button class="btn" data-go="weak">Unsichere Fragen trainieren →</button><button class="btn secondary" data-go="assess">Lernstandstest neu starten</button></div></section><div class="sectiontop"><h2>Abzeichen</h2></div><div class="grid">${getAward().map(([id,icon,name,earn])=>`<div class="badgecard ${earn?'':'locked'}"><div class="emoji">${icon}</div><div><b>${name}</b><div class="smallnote">${earn?'✓ Verdient':'Noch nicht erreicht'}</div></div></div>`).join('')}</div><div class="sectiontop"><h2>Deine letzten Tests</h2></div><div class="panel">${latest.length?latest.map(x=>`<div class="scoreline"><span>${new Date(x.date).toLocaleDateString('de-DE')} · ${esc(quizLabel(x.mode))}${x.topic?' · '+esc(topicById(x.topic).title):''}</span><strong>${x.score} / ${x.total}</strong></div>`).join(''):'<p>Du hast noch keinen Test abgeschlossen. Starte eine Lernstandserhebung oder function games(){return `<div class="learninghead"><div><span class="kicker">Spielen und dabei lernen</span><h1>🎮 Bio-Detektive</h1><p>Erkunde Knochen, ordne Gelenktypen zu und meistere die Wirbelsäulen-Challenge.</p></div><button class="btn small secondary" data-go="home">← Zur Übersicht</button></div><div class="tabs" role="tablist"><button class="tab ${ui.gameTab==='skeleton'?'active':''}" data-action="gameTab" data-id="skeleton">🩻 Knochen-Detektiv</button><button class="tab ${ui.gameTab==='joints'?'active':''}" data-action="gameTab" data-id="joints">⚙️ Gelenk-Quiz</button><button class="tab ${ui.gameTab==='spine'?'active':''}" data-action="gameTab" data-id="spine">🦴 Wirbelsäulen-Quiz</button></div>${ui.gameTab==='skeleton'?skeletonGame():bioMatchGame()}`}
function bioMatchGame(){const list=bioMatchRounds[ui.gameTab]||bioMatchRounds.joints;let n=ui.bioGameIndex||0;const score=ui.bioGameScore||0;if(n>=list.length)return `<section class="panel"><span class="kicker">Fertig!</span><h2>🏅 ${score} von ${list.length} richtig</h2><p>${score===list.length?'Alle Aufgaben richtig gelöst!':'Du kannst die Themen erneut üben. Mit jeder Runde wirst du sicherer.'}</p><button class="btn" data-action="bioGameReset">Noch einmal spielen →</button><button class="btn secondary" data-go="learn/${ui.gameTab}">Wissen wiederholen</button></section>`;const q=list[n],answered=ui.bioGameChoice!==null&&ui.bioGameChoice!==undefined;return `<div class="two-col"><section class="panel"><span class="kicker">Runde ${n+1} von ${list.length}</span><h2>${esc(q[0])}</h2><div class="answers">${q[1].map((t,i)=>`<button class="answer ${answered&&(i===q[2]?'correct':i===ui.bioGameChoice?'incorrect':'')}" data-action="bioGamePick" data-index="${i}" ${answered?'disabled':''}>${esc(t)}</button>`).join('')}</div>${answered?`<div class="feedback ${ui.bioGameChoice===q[2]?'':'bad'}" role="status"><b>${ui.bioGameChoice===q[2]?'✓ Richtig!':'Das ist die richtige Zuordnung:'}</b><p>${esc(q[3])}</p></div><button class="btn" data-action="bioGameNext">Nächste Aufgabe →</button>`:'<p class="smallnote">Wähle die passende Antwort. Danach erscheint eine Erklärung.</p>'}</section><section class="panel"><h2>${ui.gameTab==='joints'?'Vier Gelenktypen':'Die Wirbelsäule'}</h2><div class="illust-frame">${ui.gameTab==='joints'?jointTypesSvg('hinge',20):spineSvg()}</div><div class="keynote">${ui.gameTab==='joints'?'Gelenke verbinden Knochen beweglich. Ihre Formen bestimmen die möglichen Bewegungen.':'Merke: 7 Hals-, 12 Brust- und 5 Lendenwirbel sowie Kreuzbein und Steißbein.'}</div></section></div>`}
function printTests(){const used=new Set();return Array.from({length:3},(_,t)=>{const grouped=modules.flatMap(m=>{const pool=seededShuffle(questions.filter(q=>q.topic===m.id&&q.type!=='order'),seededNum('bio-v4-print-'+t+'-'+m.id));const fresh=pool.filter(q=>!used.has(q.id));const chosen=[...fresh,...pool.filter(q=>used.has(q.id))].slice(0,2);chosen.forEach(q=>used.add(q.id));return chosen});return {label:'Übungsklassenarbeit '+(t+1),qs:grouped}})}

case'lightSide':ui.lightSide=btn.dataset.id;updatePlant();break;case'jointKind':ui.jointKind=btn.dataset.id;render();break;case'skeletonPick':{if(ui.skeletonChoice!==null)break;const index=Number(btn.dataset.index);ui.skeletonChoice=index;if(skeletonGameRound[ui.skeletonRound]?.answer===index)ui.skeletonScore++;render();break}case'skeletonNext':ui.skeletonRound++;ui.skeletonChoice=null;if(ui.skeletonRound===skeletonGameRound.length && ui.skeletonScore===8 && !state.badges.includes('skelettexperte')){state.badges.push('skelettexperte');addStars(5)}render();break;case'skeletonReset':ui.skeletonRound=0;ui.skeletonScore=0;ui.skeletonChoice=null;render();break;case'doPrint':window.print();break;case'toggleSolutions':ui.printSolutions=!ui.printSolutions;render();break;case'certificate':showCertificate();break;case'export':exportProgress();break;
case'resetProgress':if(confirm('Alle gespeicherten Aufgaben, Sterne und Ergebnisse auf diesem Gerät zurücksetzen?')){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}break;

function v6ShuffleQuestion(q,seed){

    if(options.length)chosen.push(options[0]);
   }

<script>(function(){
'use strict';
const APP="bio"; const TITLE="BioLabor 5 \u00b7 Biologie Version 9.1"; const SUBJECT=APP==='bio'?'Biologie':'Chemie';
const HUBKEY='lerncockpit-'+APP+'-2026';
const NATIVE=["biolabor-kl5-v1", "biolabor8-study-v1"];
const TOPICS={"spine": "Wirbelsäule", "skeleton": "Skelett", "bones": "Knochen", "joints": "Gelenke", "muscles": "Muskeln", "life": "Lebewesen und Pflanzen", "models": "Modelle und Hebel"};
const defaultSettings=()=>({theme:'system',font:'normal',focus:false,motion:'system',voice:'',rate:1,level:2,count:10,timer:false,help:true,review:'adaptive',rewards:true});
const emptyProfile=()=>({settings:defaultSettings(),events:[],rewardKeys:[],badges:[],completedRuns:[],native:{},created:new Date().toISOString(),migration:0});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const storageAvailable=(()=>{try{const k='__cockpit_probe_'+APP;localStorage.setItem(k,'1');localStorage.removeItem(k);return true}catch{return false}})();
const get=(k)=>{try{return localStorage.getItem(k)}catch{return null}};
const put=(k,v)=>{try{localStorage.setItem(k,v);return true}catch{return false}};
const rawNative=()=>{const o={};NATIVE.forEach(k=>{const v=get(k);if(v!==null)o[k]=v});return o};
const loadNative=(o)=>NATIVE.forEach(k=>{try{if(Object.prototype.hasOwnProperty.call(o||{},k))localStorage.setItem(k,o[k]);else localStorage.removeItem(k)}catch{}});
let store;try{store=JSON.parse(get(HUBKEY)||'null')}catch{};
if(!store||store.subject!==APP||!store.profiles||!store.active||!store.profiles[store.active])store={schema:2,subject:APP,active:'Standard',profiles:{Standard:emptyProfile()}};
const profile=()=>store.profiles[store.active];
profile().settings={...defaultSettings(),...(profile().settings||{})};
const save=()=>{profile().native=rawNative();return put(HUBKEY,JSON.stringify(store))};
const notify=(m)=>{const x=document.getElementById('lcNotice');if(x){x.textContent=m;x.hidden=false;}else alert(m)};
// Bisherige Ergebnisse nur mit tatsächlich vorhandenem Zeitstempel übernehmen.
function migrate(){const p=profile();if(p.migration>=1)return;
 const dedupe=new Set((p.events||[]).map(e=>e.source+':'+e.id+':'+e.at));
 let imported=0;
 try{
 if(APP==='bio'){
  const old=JSON.parse(get('biolabor-kl5-v1')||'null');
  (old?.results||[]).forEach((run,runIndex)=>{if(!run.date||!Array.isArray(run.answers))return;run.answers.forEach((a,i)=>{if(!a.id||typeof a.correct!=='boolean')return;const key='bio-legacy:'+a.id+':'+run.date+':'+runIndex+':'+i;if(dedupe.has(key))return;p.events.push({id:a.id,topic:a.topic||'spine',correct:a.correct,assisted:!!(a.assisted||a.hints||a.gaveUp),mode:run.mode||'legacy',skill:'wissen',at:run.date,source:'bio-legacy',key});imported++})});
 } else {
  const c6=JSON.parse(get('chemie6-study-v1')||'null');
  (c6?.answers||[]).forEach((a,i)=>{if(!a.date||typeof a.right!=='boolean')return;const key='c6-legacy:'+i+':'+a.date;if(dedupe.has(key))return;p.events.push({id:'chem-case-'+a.case,topic:({0:'solubility',1:'heating',2:'heating',3:'matter',4:'burner'})[a.case]||'method',correct:a.right,assisted:!!a.hint,skill:'anwenden',mode:'legacy',at:a.date,source:'c6-legacy',key});imported++});
 }
 }catch{};
 p.events=p.events.slice(-3000);p.migration=1;save();
}
migrate();
function record(x){if(!x||typeof x.correct!=='boolean')return;
 const p=profile(),ev={id:String(x.id||'unbekannt'),topic:String(x.topic||'allgemein'),correct:x.correct,assisted:!!x.assisted,mode:String(x.mode||'übung'),skill:String(x.skill||'wissen'),at:new Date().toISOString(),source:'live',sessionId:String(x.sessionId||'')};
 p.events.push(ev);if(p.events.length>3000)p.events.splice(0,p.events.length-3000);
 const key='r:'+ev.id+':'+today();if(ev.correct&&!ev.assisted&&!p.rewardKeys.includes(key)){p.rewardKeys.push(key)};
 updateBadges();save(); if(document.getElementById('lcModal')?.hidden===false)draw();
}
window.LernCockpit={record,open:()=>open('lernstand'),settings:()=>profile().settings,debug:()=>({store,metrics:metrics()})};
const days=(ev)=>new Set(ev.map(e=>e.at?.slice(0,10))).size;
const evidence=()=>profile().events.filter(e=>e&&typeof e.correct==='boolean'&&typeof e.id==='string');
function byTask(id){return evidence().filter(e=>e.id===id).sort((a,b)=>Date.parse(a.at||'')-Date.parse(b.at||''))}
function taskStatus(id){const e=byTask(id);if(!e.length)return 'neu';const last=e[e.length-1];const clean=e.filter(a=>a.correct&&!a.assisted),different=days(clean);const transfer=evidence().some(a=>a.topic===last.topic&&a.correct&&!a.assisted&&(['anwenden','erklären'].includes(a.skill)||['assess','transfer'].includes(a.mode)));
 if(!last.correct||last.assisted)return 'üben';if(different>=2&&transfer){const dueDays=(profile().settings.review==='daily'?1:profile().settings.review==='3days'?3:7),d=(Date.now()-Date.parse(last.at))/(86400e3);return d>=dueDays?'wiederholen':'sicher'};
 return clean.length>=2?'festigen':'aufbau';}
function metrics(){const e=evidence(),clean=e.filter(x=>x.correct&&!x.assisted);const ids=[...new Set(e.map(x=>x.id))];const by=Object.entries(TOPICS).map(([id,title])=>{const list=e.filter(x=>x.topic===id),ls=[...new Set(list.map(x=>x.id))];const count=ls.length,secure=ls.filter(x=>taskStatus(x)==='sicher').length;const correct=list.filter(x=>x.correct&&!x.assisted).length,helped=list.filter(x=>x.correct&&x.assisted).length,wrong=list.filter(x=>!x.correct).length;return {id,title,count,secure,correct,helped,wrong,total:list.length,low:count<3||list.length<5};});
 const priorErrors=new Set(e.filter(x=>!x.correct).map(x=>x.id));const improved=[...priorErrors].filter(id=>{const q=byTask(id),bad=q.findIndex(x=>!x.correct);return q.slice(bad+1).some(x=>x.correct&&!x.assisted)});
 const completed=new Set(profile().completedRuns||[]);
 const sessions=Object.values(e.filter(x=>x.mode==='cockpit'&&x.sessionId&&completed.has(x.sessionId)).reduce((a,x)=>{(a[x.sessionId]??=[]).push(x);return a},{}));
 const strongSessions=sessions.filter(a=>a.length>=5&&a.filter(x=>x.correct&&!x.assisted).length/a.length>=.85).length;
 const skillCounts={wissen:0,verstehen:0,anwenden:0,erklären:0};clean.forEach(x=>{const k=skillCounts[x.skill]!==undefined?x.skill:'wissen';skillCounts[k]++});
 return {events:e.length,clean:clean.length,assisted:e.filter(x=>x.correct&&x.assisted).length,wrong:e.filter(x=>!x.correct).length,distinct:ids.length,dates:days(e),improved:improved.length,cases:clean.filter(x=>/case|fall/i.test(x.mode+' '+x.id)).length,strongSessions,by,skillCounts,recent:e.slice(-10).reverse()};}
const BADGES=[
 {id:'start',icon:'🌱',name:'Erster Forschungsschritt',desc:'Eine Aufgabe beantwortet',test:m=>m.events>=1},
 {id:'practice',icon:'🧠',name:'Wissensprofi',desc:'15 verschiedene Aufgaben selbstständig richtig',test:m=>new Set(evidence().filter(x=>x.correct&&!x.assisted).map(x=>x.id)).size>=15},
 {id:'regular',icon:'🗓️',name:'Drangeblieben',desc:'An drei unterschiedlichen Tagen gelernt',test:m=>m.dates>=3},
 {id:'improved',icon:'📈',name:'Aufsteiger',desc:'Eine zuvor falsche Aufgabe später ohne Hilfe richtig gelöst',test:m=>m.improved>=1},
 {id:'detective',icon:'🔍',name:'Fehlerdetektiv',desc:'Fünf frühere Fehler selbstständig verbessert',test:m=>m.improved>=5},
 {id:'research',icon:'🔬',name:'Forscherprofi',desc:'Drei Fälle/Anwendungen selbstständig gelöst',test:m=>m.cases>=3},
 {id:'exam',icon:'🏅',name:'Prüfungsexperte',desc:'Zwei abgeschlossene Cockpit-Trainings mit jeweils mindestens fünf Aufgaben und 85 % ohne Hilfe richtig',test:m=>m.strongSessions>=2}
];
function updateBadges(){const p=profile(),m=metrics();const before=new Set(p.badges||[]);p.badges=BADGES.filter(b=>b.test(m)).map(b=>b.id);if(profile().settings.rewards&&p.badges.some(i=>!before.has(i))){const a=p.badges.filter(i=>!before.has(i)).map(id=>BADGES.find(x=>x.id===id).name);if(document.getElementById('lcModal')?.hidden===false)notify('Neues Abzeichen: '+a.join(', '));}}
updateBadges();save();
function toggleVoice(){const el=document.getElementById('lcVoice');if(!el||!window.speechSynthesis)return;const chosen=profile().settings.voice;el.innerHTML='<option value="">Gerätestimme (Deutsch)</option>'+speechSynthesis.getVoices().filter(v=>v.lang?.toLowerCase().startsWith('de')).map(v=>`<option value="${esc(v.voiceURI)}">${esc(v.name)} (${esc(v.lang)})</option>`).join('');el.value=chosen||''}
function speaking(text){if(!('speechSynthesis'in window)){notify('Dieser Browser bietet keine Sprachausgabe.');return}speechSynthesis.cancel();const a=new SpeechSynthesisUtterance(text);a.lang='de-DE';a.rate=Number(profile().settings.rate)||1;const v=speechSynthesis.getVoices().find(x=>x.voiceURI===profile().settings.voice);if(v)a.voice=v;speechSynthesis.speak(a)}
const links=APP==='bio'?{'spine':'learn/spine','bones':'learn/bones','joints':'learn/joints','muscles':'learn/muscles','skeleton':'learn/skeleton','life':'learn/life','models':'learn/models'}:{};
const dest=APP==='bio'?{'spine':'spine','bones':'bones','joints':'joints','muscles':'muscles','skeleton':'skeleton','life':'life','models':'models'}:{matter:'matter',devices:'devices',safety:'safety',solubility:'solubility',heating:'heating',burner:'burner',method:'method',missions:'missions'};
let tab='lernstand',session=null;const modal=document.createElement('section');modal.id='lcModal';modal.hidden=true;modal.setAttribute('role','dialog');modal.setAttribute('aria-modal','true');modal.setAttribute('aria-label','Lerncockpit');modal.innerHTML='<div class="lc-shell"><div class="lc-top"><div><small>'+SUBJECT+' · Lerncockpit</small><h2>Mein Lernweg</h2></div><button id="lcClose" class="lc-close" aria-label="Lerncockpit schließen">✕</button></div><div class="lc-tabs" id="lcTabs"></div><div id="lcBody"></div><div id="lcNotice" hidden role="status"></div></div>';
const openBtn=document.createElement('button');openBtn.id='lcOpen';openBtn.type='button';openBtn.textContent='🎓 Lerncockpit';openBtn.setAttribute('aria-label','Lerncockpit mit Einstellungen, Abzeichen und Lernstand öffnen');
document.body.append(openBtn,modal);
const tabs=[['lernstand','📊 Lernstand'],['lehrkraft','👩‍🏫 Lehrkraft'],['abzeichen','🏅 Abzeichen'],['training','🎯 Üben'],['einstellungen','⚙️ Einstellungen'],['profile','💾 Sicherung']];
function open(t='lernstand'){tab=t;modal.hidden=false;draw();document.getElementById('lcClose').focus();}
function close(){modal.hidden=true;if('speechSynthesis'in window)speechSynthesis.cancel();openBtn.focus()}
openBtn.onclick=()=>open();document.getElementById('lcClose').onclick=close;modal.addEventListener('click',e=>{if(e.target===modal)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)close()});
const bar=(n,max)=>`<div class="lc-meter"><span style="width:${Math.max(0,Math.min(100,max?n/max*100:0))}%"></span></div>`;
const nextTopic=()=>metrics().by.filter(t=>t.total>0).sort((a,b)=>(b.wrong+b.helped)/(b.total||1)-(a.wrong+a.helped)/(a.total||1))[0]||metrics().by[0];
function summary(){const m=metrics(),t=nextTopic();return `${storageAvailable?'':'<p class="lc-storage-warning" role="alert">Achtung: Dieser Browser erlaubt hier keine dauerhafte Speicherung. Bitte eine HTML-Datei in einem unterstützten Browser oder die veröffentlichte Website verwenden und Ergebnisse als Sicherungsdatei exportieren.</p>'}<p class="lc-muted">Profil: <b>${esc(store.active)}</b> · Daten nur auf diesem Gerät</p><div class="lc-kpis"><div><b>${m.clean}</b><span>ohne Hilfe richtig</span></div><div><b>${m.assisted}</b><span>mit Hilfe richtig</span></div><div><b>${m.improved}</b><span>Fehler verbessert</span></div><div><b>${profile().rewardKeys.length}</b><span>Cockpit-Sterne</span></div></div><h3>Meine Lernbereiche</h3><p class="lc-muted">Die Balken zeigen die Zahl selbstständig sicherer Aufgaben, keine Schulnote. Bei weniger als drei verschiedenen Fragen oder fünf Antworten wird keine Themen-Prozentzahl berechnet.</p>${m.by.map(t=>`<div class="lc-topic"><div class="lc-between"><b>${esc(t.title)}</b><span>${t.total===0?'Noch nicht begonnen':t.low?'Noch zu wenig Ergebnisse':t.secure+' von '+t.count+' wiederholt sicher'}</span></div>${bar(t.secure,Math.max(t.count,3))}<small>${t.total?`${t.correct} ohne Hilfe · ${t.helped} mit Hilfe · ${t.wrong} noch falsch · ${t.count} verschiedene Aufgaben`:'Beginne mit einer kurzen Übung.'}</small></div>`).join('')}<div class="lc-reco"><b>Mein nächster Lernschritt</b><p>${t.total===0?`Starte im Thema „${esc(t.title)}“ mit fünf Grundfragen.`:`Wiederhole „${esc(t.title)}“ und erkläre danach eine neue Anwendung ohne Hilfe.`}</p><button data-lc="trainTopic" data-id="${esc(t.id)}">Passende Übung starten →</button></div><h3>Fähigkeiten – nach bisherigem Aufgabentyp</h3><div class="lc-skills">${Object.entries(m.skillCounts).map(([k,n])=>`<span>${esc(k)}: <b>${n}</b></span>`).join('')}</div><p class="lc-muted">Nur erfasste Antworten werden gezählt. Ältere Ergebnisse ohne prüfbaren Zeitstempel gelten nicht als mehrtägiger Nachweis. Freitexte bleiben zur Selbstkontrolle.</p>`}
function teacherPage(){const m=metrics();const needs=m.by.filter(t=>t.helped+t.wrong>0).sort((a,b)=>(b.helped+b.wrong)-(a.helped+a.wrong));return `<h3>Lehrkraftansicht – Lernstandsdiagnostik</h3><p class="lc-muted">Diese Ansicht ist eine lokal abrufbare Übersicht, kein geschützter Lehrkraftzugang. Sie enthält nur gespeicherte Antworten und ist keine automatische Benotung.</p><div class="lc-kpis"><div><b>${m.events}</b><span>erfasste Antworten</span></div><div><b>${m.dates}</b><span>Lerntage</span></div><div><b>${m.assisted}</b><span>mit Hinweis</span></div><div><b>${m.wrong}</b><span>Fehlversuche</span></div></div><h3>Kompetenzbereiche</h3>${Object.entries(m.skillCounts).map(([k,v])=>`<div class="lc-topic"><div class="lc-between"><b>${esc(k)}</b><span>${v} ohne Hilfe richtig</span></div>${bar(v,Math.max(m.clean,1))}</div>`).join('')}<h3>Förderschwerpunkte nach vorhandenen Daten</h3>${needs.length?needs.map(t=>`<div class="lc-line"><b>${esc(t.title)}</b><p>${t.wrong} Fehlversuche, ${t.helped} mit Hilfe richtig. ${t.low?'Noch keine belastbare Themenbeurteilung.':'Gezielte Transferaufgaben empfehlen.'}</p></div>`).join(''):'<p>Bislang keine Fehlversuche oder Hilfen erfasst. Für eine aussagekräftige Einschätzung weitere Übungen durchführen.</p>'}<h3>Letzte beantwortete Aufgaben</h3><div class="lc-history">${m.recent.length?m.recent.map(e=>`<div class="lc-line">${esc((e.at||'').slice(0,10))} · ${esc(TOPICS[e.topic]||e.topic)} · ${e.correct?(e.assisted?'mit Hilfe richtig':'selbstständig richtig'):'falsch'} · ${esc(e.skill)}</div>`).join(''):'Noch keine erfassten Antworten.'}</div><div class="lc-actions"><button data-lc="csv">Auswertung als CSV</button><button data-lc="print">Bericht drucken</button></div><p class="lc-muted">Unterschiedliche Aufgabenschwierigkeiten, Lernzeiten, Unterrichtsbeteiligung und offene Erklärungen benötigen zusätzliche pädagogische Beurteilung.</p>`}
function badgePage(){const p=profile(),m=metrics();return `<h3>Meine Abzeichen</h3><p class="lc-muted">Abzeichen für belegte Leistung und Lernfortschritt – nicht für Geschwindigkeit. Bereits erreichte Auszeichnungen gehen durch einen ausgelassenen Lerntag nicht verloren.</p><div class="lc-badges">${BADGES.map(b=>`<div class="lc-badge ${p.badges.includes(b.id)?'earned':''}"><span aria-hidden="true">${b.icon}</span><div><b>${b.name}</b><small>${b.desc}</small><strong>${p.badges.includes(b.id)?'Erreicht':'Noch offen'}</strong></div></div>`).join('')}</div><h3>Fachabzeichen</h3>${m.by.map(t=>`<div class="lc-between lc-line"><b>${esc(t.title)}-Profi</b><span>${t.count>=3&&t.secure>=3?'Erreicht (3 sicher)':'3 Aufgaben an verschiedenen Tagen und im Transfer festigen'}</span></div>`).join('')}<p class="lc-muted">Cockpit-Sterne gibt es höchstens einmal pro Aufgabe und Tag bei einer richtigen Antwort ohne Hilfe. Ursprüngliche App-Sterne werden nicht dazuaddiert.</p><button data-lc="printCert">Urkunde der erreichten Abzeichen drucken</button>`}
function levelFromQuestion(q){const s=String(q.ask||q.q||'').toLowerCase();if(/begründe|warum|weshalb|erkläre|wie verändert|was passiert|welche folge|würde|wenn |stelle dir|versuch|vergleiche/.test(s))return /wenn |welche folge|versuch|würde|vergleiche/.test(s)?3:2;return 1}
function allQuestions(){try{if(APP==='bio'&&typeof questions!=='undefined')return questions.filter(q=>q.type==='mc').map(q=>({id:q.id,topic:q.topic,ask:q.ask,opts:q.opts,correct:q.correct,why:q.why||'',hints:q.hints||[],level:levelFromQuestion(q)}));if(APP==='chem'&&Array.isArray(window.LernCockpitBankChem))return window.LernCockpitBankChem.map((q,i)=>({id:'chem-bank-'+i,topic:q[0]==='dissolve'?'solubility':q[0]==='boil'?'heating':q[0]==='burner'?'burner':q[0],ask:q[1],opts:q[2],correct:q[3],why:q[4],hints:[],level:levelFromQuestion({ask:q[1]})}));}catch(e){console.warn('Trainingspool konnte nicht geladen werden',e)}return []}
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function startSession(topic){const s=profile().settings;const source=allQuestions().filter(q=>!topic||q.topic===topic);const preferred=shuffle(source.filter(q=>q.level===Number(s.level)));const others=shuffle(source.filter(q=>q.level!==Number(s.level)));const picked=[...preferred,...others].slice(0,Math.min(Number(s.count)||10,source.length));if(!picked.length){notify('Für dieses Thema sind noch keine geeigneten Fragen hinterlegt.');return};session={sessionId:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9),questions:picked,i:0,answered:false,selected:null,hints:0,right:0,independent:0,start:Date.now(),topic};tab='training';draw()}
function sessionHTML(){if(!session)return `<p class="lc-muted">Trainiere in kleinen Einheiten. Die ausgewählten Fragen stammen aus dem bereits vorhandenen Fragenpool der App. Richtig beantwortete Fragen mit Hilfe zählen nicht als selbstständig beherrscht.</p><label>Thema auswählen<select id="lcTopic"><option value="">Alle Themen</option>${Object.entries(TOPICS).map(([id,n])=>`<option value="${id}">${esc(n)}</option>`).join('')}</select></label><button data-lc="start">Training starten</button>`;
 const q=session.questions[session.i];if(!q)return `<h3>Training abgeschlossen</h3>${profile().settings.timer?`<p>Bearbeitungszeit: ${Math.max(1,Math.round((Date.now()-session.start)/60000))} Minute(n) – ohne Zeitlimit oder Zeitbonus.</p>`:``}<div class="lc-kpis"><div><b>${session.right}/${session.questions.length}</b><span>richtig</span></div><div><b>${session.independent}</b><span>ohne Hilfe</span></div></div><p>Bei Unsicherheiten helfen die Lernwelten, Zeichnungen und vertiefenden Erklärungen. Wiederhole Fehler an einem anderen Tag.</p><button data-lc="retry">Noch einmal üben</button><button data-lc="goHome">Zum Fach zurück</button>`;
 const opts=session.order||shuffle(q.opts.map((x,i)=>({text:x,i})));session.order=opts;
 return `<div class="lc-between"><b>Aufgabe ${session.i+1}/${session.questions.length}</b><small>${esc(TOPICS[q.topic]||q.topic)} · Niveau ${q.level}</small></div>${bar(session.i,session.questions.length)}<h3>${esc(q.ask)}</h3><div class="lc-answers">${opts.map(o=>`<button ${session.answered?'disabled':''} class="${session.selected===o.i?'selected':''}" data-lc="answer" data-id="${o.i}">${esc(o.text)}</button>`).join('')}</div>${!session.answered?`<div class="lc-actions">${profile().settings.help?'<button data-lc="hint">Hinweis '+(session.hints?session.hints:'')+'</button>':''}<button data-lc="check" ${session.selected===null?'disabled':''}>Antwort prüfen</button></div>`:''}${session.hints?`<p class="lc-hint">${esc(q.hints[Math.min(session.hints-1,q.hints.length-1)]||'Achte auf den Fachbegriff und seine Funktion.')}</p>`:''}${session.answered?`<div class="lc-feedback"><b>${session.isCorrect?'✓ Richtig':'Noch nicht richtig'}</b><p>${esc(q.why)}</p><p>${session.hints?'Diese Antwort wurde mit Hinweis bearbeitet.':'Ohne Hinweis bearbeitet.'}</p></div><button data-lc="next">${session.i===session.questions.length-1?'Auswertung ansehen':'Nächste Aufgabe →'}</button>`:''}<button class="lc-plain" data-lc="abandon">Training beenden</button>`;
}
function settingsPage(){const s=profile().settings,sel=(id,v,opts)=>`<label>${id}<select data-set="${v}">${opts.map(([a,b])=>`<option value="${a}" ${String(s[v])===String(a)?'selected':''}>${b}</option>`).join('')}</select></label>`;return `<p class="lc-muted">Alle Änderungen werden für dieses lokale Lernprofil gespeichert.</p><div class="lc-settings">${sel('Darstellung','theme',[['system','Geräteeinstellung'],['light','Hell'],['dark','Dunkel'],['contrast','Hoher Kontrast']])}${sel('Schriftgröße','font',[['normal','Normal'],['large','Groß'],['xl','Sehr groß']])}${sel('Animationen','motion',[['system','Geräteeinstellung'],['normal','Normal'],['slow','Langsam'],['off','Aus']])}${sel('Bevorzugtes Lernniveau','level',[[1,'Grundlagen'],[2,'Verstehen'],[3,'Anwenden']])}${sel('Aufgaben pro Einheit','count',[[5,'5 Fragen'],[10,'10 Fragen'],[15,'15 Fragen'],[20,'20 Fragen']])}${sel('Wiederholungen','review',[['adaptive','Nach Lernbedarf (7 Tage)'],['daily','Jeden Tag'],['3days','Alle drei Tage']])}${sel('Sprachtempo','rate',[[0.7,'Langsam'],[0.85,'Etwas langsamer'],[1,'Normal'],[1.2,'Schneller']])}<label>Vorlesestimme<select id="lcVoice" data-set="voice"><option value="">Gerätestimme</option></select></label><label class="lc-check"><input type="checkbox" data-check="focus" ${s.focus?'checked':''}> Konzentrationsmodus: weniger Ablenkung</label><label class="lc-check"><input type="checkbox" data-check="help" ${s.help?'checked':''}> Hinweise im Cockpit-Training anbieten</label><label class="lc-check"><input type="checkbox" data-check="timer" ${s.timer?'checked':''}> Zeit im Ergebnis anzeigen (ohne Zeitlimit)</label><label class="lc-check"><input type="checkbox" data-check="rewards" ${s.rewards?'checked':''}> Abzeichenanzeige aktivieren</label></div><div class="lc-actions"><button data-lc="speak">Vorlesen testen</button><button data-lc="stopVoice">Vorlesen stoppen</button></div><p class="lc-muted">Die Einstellung für Aufgabenanzahl und Niveau steuert das neue Cockpit-Training. In älteren Übungsmodulen bleiben die ursprünglichen Fragen erhalten. Die Sprachausgabe hängt von den auf deinem Gerät vorhandenen Stimmen ab.</p>`}
function profilePage(){return `<h3>Lokale Lernprofile und Datensicherung</h3><p class="lc-muted">Profile bleiben nur in diesem Browser. Ein Wechsel lädt die App neu und trennt auch die bisherigen Ergebnisse der Lernwelten. Maximal sechs Profile pro Fach.</p><label>Aktives Profil<select id="lcProfile">${Object.keys(store.profiles).map(k=>`<option ${k===store.active?'selected':''} value="${esc(k)}">${esc(k)}</option>`).join('')}</select></label><div class="lc-actions"><button data-lc="switch">Profil wechseln</button><button data-lc="create">Neues Profil anlegen</button></div><h3>Sichern und wiederherstellen</h3><div class="lc-actions"><button data-lc="export">Sicherung als JSON</button><button data-lc="csv">Lernbericht als CSV</button><button data-lc="print">Bericht drucken</button></div><label>Sicherungsdatei auswählen<input type="file" id="lcImportFile" accept="application/json,.json"></label><div class="lc-actions"><button data-lc="import">Sicherung überprüfen und importieren</button><button data-lc="reset">Aktives Profil zurücksetzen</button></div><p class="lc-muted">Ein Import überschreibt nach Bestätigung die Profile dieses Fachs. Biologie- und Chemie-Dateien können nicht miteinander verwechselt werden. Vor einem Wechsel auf ein anderes Gerät die JSON-Sicherung exportieren.</p>`}
function draw(){document.getElementById('lcTabs').innerHTML=tabs.map(([id,l])=>`<button class="${tab===id?'active':''}" data-tab="${id}" aria-current="${tab===id?'page':'false'}">${l}</button>`).join('');document.getElementById('lcBody').innerHTML=({lernstand:summary,lehrkraft:teacherPage,abzeichen:badgePage,training:sessionHTML,einstellungen:settingsPage,profile:profilePage})[tab]();const notice=document.getElementById('lcNotice');notice.hidden=true;if(tab==='einstellungen'){toggleVoice()}}
function apply(){let s=profile().settings;document.body.classList.toggle('lc-theme-dark',s.theme==='dark');document.body.classList.toggle('lc-theme-light',s.theme==='light');document.body.classList.toggle('lc-theme-contrast',s.theme==='contrast');document.body.classList.toggle('lc-font-large',s.font==='large');document.body.classList.toggle('lc-font-xl',s.font==='xl');document.body.classList.toggle('lc-focus',!!s.focus);document.body.classList.toggle('lc-reduced',s.motion==='off'||(s.motion==='system'&&matchMedia('(prefers-reduced-motion: reduce)').matches));document.body.classList.toggle('lc-slow',s.motion==='slow');document.body.classList.toggle('lc-hide-rewards',!s.rewards);document.body.classList.toggle('lc-no-timer',!s.timer);}
function fileSave(name,content,type){let b=new Blob([content],{type}),a=document.createElement('a'),url=URL.createObjectURL(b);a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function printReport(cert=false){const m=metrics();const p=profile();const markup=cert?`<h1>Urkunde – ${esc(SUBJECT)}</h1><h2>${esc(store.active)}</h2><p>Diese Abzeichen wurden durch gespeicherte Übungen erreicht:</p>${BADGES.filter(b=>p.badges.includes(b.id)).map(b=>`<p>${b.icon} ${esc(b.name)}: ${esc(b.desc)}</p>`).join('')}`:`<h1>Lernstand – ${esc(SUBJECT)}</h1><p>Profil: ${esc(store.active)} · erstellt: ${new Date().toLocaleDateString('de-DE')}</p><p>Ohne Hilfe richtig: ${m.clean} · mit Hilfe: ${m.assisted} · zu wiederholen: ${m.wrong}</p>${m.by.map(t=>`<p><b>${esc(t.title)}:</b> ${t.low?'Noch zu wenig Ergebnisse':t.secure+' sicher von '+t.count} · ${t.correct} selbstständig · ${t.helped} mit Hilfe · ${t.wrong} falsch</p>`).join('')}`;
 const w=window.open('','_blank');if(!w){notify('Pop-ups blockiert. Bitte Druckfenster im Browser erlauben.');return}w.document.write('<!doctype html><html lang="de"><meta charset="utf-8"><title>Lernbericht</title><style>body{font-family:Arial,sans-serif;padding:28px;line-height:1.6;max-width:750px}h1{color:#18465e}@media print{body{padding:0}}</style>'+markup+'<p><small>Auswertung der im Browser gespeicherten Übungsergebnisse. Keine Schulnote.</small></p></html>');w.document.close();w.focus();setTimeout(()=>w.print(),350)}
function switchTo(name){if(!store.profiles[name])return;save();store.active=name;loadNative(store.profiles[name].native||{});put(HUBKEY,JSON.stringify(store));location.reload()}
function importFile(file){if(!file){notify('Bitte eine JSON-Sicherung auswählen.');return}if(file.size>3500000){notify('Diese Sicherung ist zu groß.');return}file.text().then(str=>{let x=JSON.parse(str);if(x?.app!==APP||x.schema!==2||!x.store?.profiles||!x.store?.active||!x.store.profiles[x.store.active])throw Error('Keine gültige '+SUBJECT+'-Sicherung');if(Object.keys(x.store.profiles).length>6)throw Error('Zu viele Profile');const clean={schema:2,subject:APP,active:String(x.store.active),profiles:{}};for(const [name,p] of Object.entries(x.store.profiles)){if(name.length>35||!p||!Array.isArray(p.events)||!p.native||p.events.length>3000)throw Error('Ungültige Profildaten');const native={};NATIVE.forEach(k=>{if(typeof p.native[k]==='string'&&p.native[k].length<1000000)native[k]=p.native[k]});clean.profiles[name]={...emptyProfile(),settings:{...defaultSettings(),...p.settings},events:p.events.filter(e=>e&&typeof e.id==='string'&&typeof e.correct==='boolean').slice(-3000),completedRuns:(Array.isArray(p.completedRuns)?p.completedRuns:[]).filter(v=>typeof v==='string').slice(-300),rewardKeys:(Array.isArray(p.rewardKeys)?p.rewardKeys:[]).filter(v=>typeof v==='string').slice(-5000),badges:(Array.isArray(p.badges)?p.badges:[]).filter(v=>typeof v==='string'),native,migration:1};}if(!confirm('Die bestehenden '+SUBJECT+'-Profile werden durch die Sicherung ersetzt. Fortfahren?'))return;store=clean;put(HUBKEY,JSON.stringify(store));loadNative(profile().native);location.reload()}).catch(e=>notify('Import abgebrochen: '+e.message))}
modal.addEventListener('click',e=>{const b=e.target.closest('button[data-lc],button[data-tab]');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;draw();return}const action=b.dataset.lc;
 if(action==='start'){startSession(document.getElementById('lcTopic').value);return}
 if(action==='trainTopic'){startSession(b.dataset.id);return}
 if(action==='answer'){if(session&&!session.answered){session.selected=Number(b.dataset.id);draw()}return}
 if(action==='hint'){if(session&&!session.answered){session.hints=Math.min(3,session.hints+1);draw()}return}
 if(action==='check'){if(!session||session.answered||session.selected===null)return;const q=session.questions[session.i],ok=q.correct===session.selected;session.answered=true;session.isCorrect=ok;if(ok){session.right++;if(!session.hints)session.independent++};record({id:q.id,topic:q.topic,correct:ok,assisted:session.hints>0,mode:'cockpit',sessionId:session.sessionId,skill:['wissen','verstehen','anwenden'][q.level-1]});draw();return}
 if(action==='next'){if(session){session.i++;if(session.i>=session.questions.length){const p=profile();p.completedRuns=p.completedRuns||[];if(!p.completedRuns.includes(session.sessionId))p.completedRuns.push(session.sessionId);p.completedRuns=p.completedRuns.slice(-300);updateBadges();save();}session.answered=false;session.selected=null;session.hints=0;session.order=null;draw()}return}
 if(action==='retry'){startSession(session.topic);return}
 if(action==='abandon'){session=null;draw();return}
 if(action==='goHome'){session=null;close();return}
 if(action==='speak'){speaking('Willkommen im Lerncockpit. Du kannst dein Lerntempo selbst bestimmen.');return}
 if(action==='stopVoice'){if('speechSynthesis' in window)speechSynthesis.cancel();return}
 if(action==='printCert'){printReport(true);return}
 if(action==='print'){printReport();return}
 if(action==='export'){save();fileSave(SUBJECT+'_Lerncockpit_Sicherung.json',JSON.stringify({app:APP,schema:2,exported:new Date().toISOString(),store},null,2),'application/json');notify('JSON-Sicherung erstellt.');return}
 if(action==='csv'){const a=[['Datum','Thema','Aufgabe','Ergebnis','Hilfe','Kompetenz'],...evidence().map(x=>[x.at,x.topic,x.id,x.correct?'richtig':'falsch',x.assisted?'ja':'nein',x.skill])];fileSave(SUBJECT+'_Lernbericht.csv','\uFEFF'+a.map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\n'),'text/csv;charset=utf-8');return}
 if(action==='import'){importFile(document.getElementById('lcImportFile')?.files?.[0]);return}
 if(action==='switch'){switchTo(document.getElementById('lcProfile').value);return}
 if(action==='create'){if(Object.keys(store.profiles).length>=6){notify('Maximal sechs Profile pro Fach.');return}const name=(prompt('Neuer Profilname (z. B. Lernender 2):')||'').trim().slice(0,35);if(!name||store.profiles[name]){notify('Bitte einen anderen Profilnamen wählen.');return}save();store.profiles[name]=emptyProfile();switchTo(name);return}
 if(action==='reset'){if(!confirm('Wirklich alle Lernstände und Abzeichen des aktuellen Profils löschen?'))return;let name=store.active;store.profiles[name]=emptyProfile();loadNative({});put(HUBKEY,JSON.stringify(store));location.reload();return}
});
modal.addEventListener('change',e=>{const el=e.target;const k=el.dataset.set||el.dataset.check;if(!k)return;const p=profile();p.settings[k]=el.type==='checkbox'?el.checked:(['rate'].includes(k)?Number(el.value):['count','level'].includes(k)?Number(el.value):el.value);save();apply();if(k!=='voice'){draw();}});
apply();
})();</script></body></html>
